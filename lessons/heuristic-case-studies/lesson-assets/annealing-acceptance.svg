<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" role="img" aria-labelledby="title desc">
<title id="title">나쁜 이동의 채택 확률 exp(−loss / T)</title><desc id="desc">손해 loss가 0.5T, T, 2T, 3T일 때 채택 확률은 약 61%, 37%, 14%, 5%입니다. 온도를 절반으로 낮추면 같은 손해 T에서 채택 확률이 37%에서 14%로 줄어듭니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="728" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#ae5515"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">나쁜 이동의 채택 확률 exp(−loss / T)</text>
<text x="28" y="86" font-size="21" fill="#53657d" font-weight="400" text-anchor="start">가로 = 손해 크기 (T 단위) · 세로 = 채택 확률</text>
<rect x="20" y="104" width="680" height="500" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="100" y1="520" x2="640" y2="520" stroke="#eef2f7" stroke-width="2" stroke-linecap="round"/>
<text x="88" y="527" font-size="19" fill="#53657d" font-weight="600" text-anchor="end">0%</text>
<line x1="100" y1="350.0" x2="640" y2="350.0" stroke="#eef2f7" stroke-width="2" stroke-linecap="round"/>
<text x="88" y="357.0" font-size="19" fill="#53657d" font-weight="600" text-anchor="end">50%</text>
<line x1="100" y1="180" x2="640" y2="180" stroke="#eef2f7" stroke-width="2" stroke-linecap="round"/>
<text x="88" y="187" font-size="19" fill="#53657d" font-weight="600" text-anchor="end">100%</text>
<line x1="100" y1="520" x2="100" y2="528" stroke="#53657d" stroke-width="2" stroke-linecap="round"/>
<text x="100" y="554" font-size="19" fill="#53657d" font-weight="600" text-anchor="middle">0</text>
<line x1="235" y1="520" x2="235" y2="528" stroke="#53657d" stroke-width="2" stroke-linecap="round"/>
<text x="235" y="554" font-size="19" fill="#53657d" font-weight="600" text-anchor="middle">1T</text>
<line x1="370" y1="520" x2="370" y2="528" stroke="#53657d" stroke-width="2" stroke-linecap="round"/>
<text x="370" y="554" font-size="19" fill="#53657d" font-weight="600" text-anchor="middle">2T</text>
<line x1="505" y1="520" x2="505" y2="528" stroke="#53657d" stroke-width="2" stroke-linecap="round"/>
<text x="505" y="554" font-size="19" fill="#53657d" font-weight="600" text-anchor="middle">3T</text>
<line x1="640" y1="520" x2="640" y2="528" stroke="#53657d" stroke-width="2" stroke-linecap="round"/>
<text x="640" y="554" font-size="19" fill="#53657d" font-weight="600" text-anchor="middle">4T</text>
<path d="M 100.0 180.0 L 113.5 212.4 L 127.0 241.6 L 140.5 268.1 L 154.0 292.1 L 167.5 313.8 L 181.0 333.4 L 194.5 351.2 L 208.0 367.2 L 221.5 381.8 L 235.0 394.9 L 248.5 406.8 L 262.0 417.6 L 275.5 427.3 L 289.0 436.2 L 302.5 444.1 L 316.0 451.4 L 329.5 457.9 L 343.0 463.8 L 356.5 469.1 L 370.0 474.0 L 383.5 478.4 L 397.0 482.3 L 410.5 485.9 L 424.0 489.2 L 437.5 492.1 L 451.0 494.7 L 464.5 497.2 L 478.0 499.3 L 491.5 501.3 L 505.0 503.1 L 518.5 504.7 L 532.0 506.1 L 545.5 507.5 L 559.0 508.7 L 572.5 509.7 L 586.0 510.7 L 599.5 511.6 L 613.0 512.4 L 626.5 513.1 L 640.0 513.8" fill="none" stroke="#2664ce" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 100.0 180.0 L 113.5 241.6 L 127.0 292.1 L 140.5 333.4 L 154.0 367.2 L 167.5 394.9 L 181.0 417.6 L 194.5 436.2 L 208.0 451.4 L 221.5 463.8 L 235.0 474.0 L 248.5 482.3 L 262.0 489.2 L 275.5 494.7 L 289.0 499.3 L 302.5 503.1 L 316.0 506.1 L 329.5 508.7 L 343.0 510.7 L 356.5 512.4 L 370.0 513.8 L 383.5 514.9 L 397.0 515.8 L 410.5 516.6 L 424.0 517.2 L 437.5 517.7 L 451.0 518.1 L 464.5 518.5 L 478.0 518.7 L 491.5 519.0 L 505.0 519.2 L 518.5 519.3 L 532.0 519.4 L 545.5 519.5 L 559.0 519.6 L 572.5 519.7 L 586.0 519.7 L 599.5 519.8 L 613.0 519.8 L 626.5 519.9 L 640.0 519.9" fill="none" stroke="#ae5515" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/>
<circle cx="167.5" cy="313.7795756977047" r="8" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="185.5" y="307.7795756977047" font-size="20" fill="#2664ce" font-weight="750" text-anchor="start">61%</text>
<circle cx="235" cy="394.9209900017096" r="8" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="253" y="388.9209900017096" font-size="20" fill="#2664ce" font-weight="750" text-anchor="start">37%</text>
<circle cx="370" cy="473.9860036995517" r="8" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="388" y="461.9860036995517" font-size="20" fill="#2664ce" font-weight="750" text-anchor="start">14%</text>
<circle cx="505" cy="503.0723967549263" r="8" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="521" y="489.0723967549263" font-size="20" fill="#2664ce" font-weight="750" text-anchor="start">5%</text>
<circle cx="235" cy="473.9860036995517" r="8" fill="#fff" stroke="#ae5515" stroke-width="3"/>
<text x="221" y="503.9860036995517" font-size="20" fill="#ae5515" font-weight="750" text-anchor="end">14%</text>
<line x1="60" y1="150" x2="100" y2="150" stroke="#2664ce" stroke-width="4" stroke-linecap="round"/>
<text x="112" y="157" font-size="20" fill="#2664ce" font-weight="700" text-anchor="start">온도 T</text>
<line x1="250" y1="150" x2="290" y2="150" stroke="#ae5515" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 7"/>
<text x="302" y="157" font-size="20" fill="#ae5515" font-weight="700" text-anchor="start">온도 T/2 (절반)</text>
<rect x="28" y="624" width="664" height="86" rx="12" fill="#fdf0e3" stroke="#f0d3b6" stroke-width="1.5"/>
<text x="360" y="658" font-size="22" fill="#ae5515" font-weight="750" text-anchor="middle">같은 손해 T에서 37% → 14%</text>
<text x="360" y="692" font-size="20" fill="#ae5515" font-weight="600" text-anchor="middle">온도를 내리면 나쁜 이동을 덜 받아들임</text>
</svg>
