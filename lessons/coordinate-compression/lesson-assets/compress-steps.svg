<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 674" role="img" aria-labelledby="title desc">
<title id="title">좌표 압축: 정렬 → 중복 제거 → 순위</title><desc id="desc">배열 -10,100,-10,7,100,8을 정렬하면 -10,-10,7,8,100,100이고 중복을 제거하면 -10,7,8,100입니다. 각 원소를 이 배열에서의 위치로 바꾸면 0,3,0,1,3,2가 됩니다. 같은 값은 같은 색으로 표시했습니다.</desc>
