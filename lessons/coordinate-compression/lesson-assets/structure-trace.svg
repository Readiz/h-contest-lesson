<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" role="img" aria-labelledby="title desc">
<title id="title">좌표 압축: 순위와 거리는 다릅니다</title><desc id="desc">좌표 10, 20, 100은 인덱스 0, 1, 2가 되지만 실제 간격 10과 80은 둘 다 인덱스 차이 1로 바뀝니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="548" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">좌표 압축: 순위와 거리는 다릅니다</text>
<rect x="28" y="76" width="664" height="214" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="108" font-size="22" fill="#172b45" font-weight="700">원래 좌표: 10, 20, 100</text>
<line x1="60" y1="150" x2="660" y2="150" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="80" y1="138" x2="80" y2="162" stroke="#172b45" stroke-width="2.5" stroke-linecap="round"/>
<text x="80" y="194" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">10</text>
<line x1="142.2" y1="138" x2="142.2" y2="162" stroke="#172b45" stroke-width="2.5" stroke-linecap="round"/>
<text x="142.2" y="194" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">20</text>
<line x1="640" y1="138" x2="640" y2="162" stroke="#172b45" stroke-width="2.5" stroke-linecap="round"/>
<text x="640" y="194" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">100</text>
<path d="M80 212 L80 220 L142.2 220 L142.2 212" fill="none" stroke="#ae5515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="111.1" y="248" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">거리 10</text>
<path d="M142.2 212 L142.2 220 L640 220 L640 212" fill="none" stroke="#ae5515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="391.1" y="248" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">거리 80</text>
<rect x="28" y="306" width="664" height="140" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="338" font-size="22" fill="#172b45" font-weight="700">압축 인덱스: 0, 1, 2</text>
<line x1="110" y1="382" x2="610" y2="382" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="110" cy="382" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="110" y="389" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<circle cx="360" cy="382" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="360" y="389" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<circle cx="610" cy="382" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="610" y="389" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<text x="235" y="366" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">차이 1</text>
<text x="485" y="366" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">차이 1</text>
<rect x="28" y="466" width="664" height="54" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="1.5"/>
<text x="46" y="500" font-size="20" fill="#172b45" font-weight="700">순서는 보존하지만 실제 거리는 사라집니다.</text>
</svg>
