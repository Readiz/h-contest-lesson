<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">좌표 압축: 순위와 거리는 다릅니다</title><desc id="desc">좌표10,20,100은 인덱스0,1,2가 되지만 실제 간격10과80은 둘 다 인덱스 차이1로 바뀝니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="590" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">좌표 압축: 순위와 거리는 다릅니다</text><text x="24" y="92" font-size="24" fill="#18324f">원래 좌표: 10, 20, 100</text><path d="M55 160 L550 160" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M55 149 L55 173" fill="none" stroke="#607b98" stroke-width="2.5"/><text x="37" y="210" font-size="24" fill="#18324f">10</text><path d="M110 149 L110 173" fill="none" stroke="#607b98" stroke-width="2.5"/><text x="92" y="210" font-size="24" fill="#18324f">20</text><path d="M550 149 L550 173" fill="none" stroke="#607b98" stroke-width="2.5"/><text x="532" y="210" font-size="24" fill="#18324f">100</text><text x="48" y="257" font-size="22" fill="#18324f">거리 10</text><text x="315" y="257" font-size="22" fill="#18324f">거리 80</text><text x="24" y="315" font-size="24" fill="#18324f">압축 인덱스: 0, 1, 2</text><path d="M65 365 L525 365" fill="none" stroke="#607b98" stroke-width="2.5"/><circle cx="65" cy="365" r="27" fill="#dbeafe" stroke="#607b98"/><text x="65" y="373" text-anchor="middle" font-size="24">0</text><circle cx="295" cy="365" r="27" fill="#dbeafe" stroke="#607b98"/><text x="295" y="373" text-anchor="middle" font-size="24">1</text><circle cx="525" cy="365" r="27" fill="#dbeafe" stroke="#607b98"/><text x="525" y="373" text-anchor="middle" font-size="24">2</text><text x="95" y="426" font-size="22" fill="#18324f">차이 1</text><text x="345" y="426" font-size="22" fill="#18324f">차이 1</text><rect x="24" y="464" width="550" height="65" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="504.5" font-size="23" fill="#18324f">순서는 보존하지만 실제 거리는 사라집니다.</text></svg>
