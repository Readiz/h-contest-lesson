<text x="110" y="500" font-size="18" fill="#53657d" text-anchor="middle">0</text>
<rect x="166" y="420" width="88" height="52" rx="10" fill="#dbeafe" stroke="#9fb0c6" stroke-width="1.5"/>
<text x="210" y="453.7" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">7</text>
<text x="210" y="500" font-size="18" fill="#53657d" text-anchor="middle">1</text>
