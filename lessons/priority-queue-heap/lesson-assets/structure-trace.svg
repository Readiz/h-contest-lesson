<line x1="218" y1="264.8" x2="272" y2="321.2" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="502" y1="264.8" x2="448" y2="321.2" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="360" cy="152" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="360" y="159" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">10</text>
<text x="394" y="158" font-size="18" fill="#53657d">i=0</text>
<circle cx="200" cy="246" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
