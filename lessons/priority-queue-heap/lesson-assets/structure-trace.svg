<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">힙: 트리와 배열은 같은 구조입니다</title><desc id="desc">max heap10,7,9,1,3,4를 층별로 배열에 저장합니다. 인덱스1의 자식은3과4입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="590" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">힙: 트리와 배열은 같은 구조입니다</text><text x="24" y="88" font-size="24" fill="#18324f">본문의 max-heap을 0-index 배열로 저장</text><path d="M300 169 L165 222" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M300 169 L435 222" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M165 274 L85 327" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M165 274 L235 327" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M435 274 L365 327" fill="none" stroke="#607b98" stroke-width="2.5"/><circle cx="300" cy="145" r="27" fill="#dbeafe" stroke="#607b98"/><text x="300" y="153" text-anchor="middle" font-size="24">10</text><text x="330" y="153" font-size="18" fill="#18324f">i=0</text><circle cx="165" cy="250" r="27" fill="#dbeafe" stroke="#607b98"/><text x="165" y="258" text-anchor="middle" font-size="24">7</text><text x="195" y="258" font-size="18" fill="#18324f">i=1</text><circle cx="435" cy="250" r="27" fill="#dbeafe" stroke="#607b98"/><text x="435" y="258" text-anchor="middle" font-size="24">9</text><text x="465" y="258" font-size="18" fill="#18324f">i=2</text><circle cx="85" cy="355" r="27" fill="#dbeafe" stroke="#607b98"/><text x="85" y="363" text-anchor="middle" font-size="24">1</text><text x="115" y="363" font-size="18" fill="#18324f">i=3</text><circle cx="235" cy="355" r="27" fill="#dbeafe" stroke="#607b98"/><text x="235" y="363" text-anchor="middle" font-size="24">3</text><text x="265" y="363" font-size="18" fill="#18324f">i=4</text><circle cx="365" cy="355" r="27" fill="#dbeafe" stroke="#607b98"/><text x="365" y="363" text-anchor="middle" font-size="24">4</text><text x="395" y="363" font-size="18" fill="#18324f">i=5</text><rect x="24" y="423" width="82" height="54" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="458.0" font-size="24" fill="#18324f">10</text><text x="52" y="510" font-size="20" fill="#18324f">0</text><rect x="116" y="423" width="82" height="54" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="128" y="458.0" font-size="24" fill="#18324f">7</text><text x="144" y="510" font-size="20" fill="#18324f">1</text><rect x="208" y="423" width="82" height="54" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="220" y="458.0" font-size="24" fill="#18324f">9</text><text x="236" y="510" font-size="20" fill="#18324f">2</text><rect x="300" y="423" width="82" height="54" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="312" y="458.0" font-size="24" fill="#18324f">1</text><text x="328" y="510" font-size="20" fill="#18324f">3</text><rect x="392" y="423" width="82" height="54" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="404" y="458.0" font-size="24" fill="#18324f">3</text><text x="420" y="510" font-size="20" fill="#18324f">4</text><rect x="484" y="423" width="82" height="54" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="496" y="458.0" font-size="24" fill="#18324f">4</text><text x="512" y="510" font-size="20" fill="#18324f">5</text><text x="24" y="562" font-size="24" fill="#18324f">부모 i의 자식: 2i+1, 2i+2</text></svg>
