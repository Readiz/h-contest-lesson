<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="title desc">
<title id="title">힙: 트리와 배열은 같은 구조입니다</title><desc id="desc">max heap 10, 7, 9, 1, 3, 4를 층별로 배열에 저장합니다. 인덱스 1의 자식은 3과 4입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="598" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">힙: 트리와 배열은 같은 구조입니다</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">본문의 max-heap을 0-index 배열로 저장</text>
<rect x="28" y="108" width="664" height="290" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="337.6" y1="165.2" x2="222.4" y2="232.8" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="382.4" y1="165.2" x2="497.6" y2="232.8" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
