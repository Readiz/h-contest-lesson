<rect x="28" y="522" width="664" height="52" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="1.5"/>
<text x="46" y="555" font-size="20" fill="#172b45" font-weight="700">부모 i의 자식: 2i+1, 2i+2</text>
