<text x="144" y="346" font-size="18" fill="#53657d">i=3</text>
<circle cx="290" cy="340" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="290" y="347" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
