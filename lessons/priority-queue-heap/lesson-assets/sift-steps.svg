<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1068" role="img" aria-labelledby="title desc">
<title id="title">힙: 넣을 때 올리고 뺄 때 내림</title><desc id="desc">max-heap 10,7,9,1,3,4에 11을 넣으면 끝에 놓인 11이 부모 9, 10과 차례로 교환되어 루트로 올라갑니다. 루트를 뺄 때는 마지막 값 9를 루트에 두고 더 큰 자식 10과 교환하면 원래 힙 10,7,9,1,3,4로 돌아옵니다.</desc>
