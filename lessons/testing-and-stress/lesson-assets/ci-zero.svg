<text x="360" y="338" font-size="22" fill="#147d69" font-weight="700" text-anchor="middle">평균 4 · 구간 [3.1, 4.9]</text>
<rect x="20" y="384" width="680" height="262" rx="10" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="418" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">예시 2: 구간이 0을 덮음</text>
