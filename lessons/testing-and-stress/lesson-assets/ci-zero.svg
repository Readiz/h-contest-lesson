<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" role="img" aria-labelledby="title desc">
<title id="title">차이의 평균±2·stderr 구간과 0</title><desc id="desc">입력 8개에서 A-B 차이를 점으로 찍고 평균±2·stderr 구간을 0과 비교합니다. 첫 예시는 차이 3,5,4,6,2,5,4,3으로 평균 4.0, 구간 3.1에서 4.9라 0을 포함하지 않아 개선 근거입니다. 둘째 예시는 6,-4,3,-5,7,-2,4,-3으로 평균 0.75, 구간 -2.6에서 4.1이라 0을 포함해 확정할 수 없습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="738" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">차이의 평균±2·stderr 구간과 0</text>
<text x="28" y="86" font-size="20" fill="#53657d" font-weight="400" text-anchor="start">점 하나 = 입력 하나의 점수 차이 (양수 = 후보가 좋음)</text>
<rect x="20" y="104" width="680" height="262" rx="10" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="138" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">예시 1: 구간이 0 오른쪽</text>
<text x="682" y="138" font-size="22" fill="#147d69" font-weight="750" text-anchor="end">0 미포함: 개선 근거</text>
