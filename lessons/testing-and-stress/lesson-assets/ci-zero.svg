<line x1="360.0" y1="444" x2="360.0" y2="590" stroke="#53657d" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="261.55009981381437" y1="576" x2="514.6999001861857" y2="576" stroke="#ae5515" stroke-width="7" stroke-linecap="round"/>
<circle cx="388.125" cy="576" r="7" fill="#fff" stroke="#ae5515" stroke-width="3"/>
<text x="360" y="618" font-size="22" fill="#ae5515" font-weight="700" text-anchor="middle">평균 0.75 · 구간 [−2.6, 4.1]</text>
<rect x="28" y="668" width="664" height="54" rx="12" fill="#eef2f7" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="360" y="703" font-size="20" fill="#53657d" font-weight="600" text-anchor="middle">구간 = 평균 ± 2 × stderr · 세로 점선은 차이 0</text>
</svg>
