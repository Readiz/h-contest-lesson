<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 772" role="img" aria-labelledby="title desc">
<title id="title">차분값과 전체 재계산 대조</title><desc id="desc">순서 0,A,B,C,D, 좌표 0=0 A=1 B=9 C=8 D=2에서 꼬리 B,C,D를 뒤집습니다. 열린 경로 차분식은 제거 8, 추가 1이라 -7이고 전체 재계산도 16에서 9로 -7이라 일치합니다. 사이클 공식을 잘못 쓰면 제거 10, 추가 10이라 차분이 0이어서 전체 재계산과 불일치합니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="770" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">차분값과 전체 재계산 대조</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">같은 입력에서 꼬리 B, C, D 뒤집기</text>
<text x="28" y="114" font-size="20" fill="#53657d" font-weight="400" text-anchor="start">좌표 0=0 · A=1 · B=9 · C=8 · D=2</text>
<rect x="20" y="136" width="680" height="152" rx="10" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="170" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">① 차분식: 경계 간선만</text>
<text x="682" y="170" font-size="20" fill="#2664ce" font-weight="750" text-anchor="end">−7</text>
<text x="40" y="208" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">제거  A–B = |1−9| = 8</text>
<text x="40" y="240" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">추가  A–D = |1−2| = 1</text>
<text x="40" y="272" font-size="22" fill="#2664ce" font-weight="750" text-anchor="start">차분 = 1 − 8 = −7</text>
<rect x="20" y="302" width="680" height="152" rx="10" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="336" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">② 전체 재계산: get_path_dist</text>
<text x="682" y="336" font-size="20" fill="#147d69" font-weight="750" text-anchor="end">−7</text>
<text x="40" y="374" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">before 0→A→B→C→D = 1+8+1+6 = 16</text>
<text x="40" y="406" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">after   0→A→D→C→B = 1+1+6+1 = 9</text>
<text x="40" y="438" font-size="22" fill="#147d69" font-weight="750" text-anchor="start">after − before = 9 − 16 = −7</text>
<rect x="28" y="468" width="664" height="50" rx="12" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="360" y="501" font-size="20" fill="#147d69" font-weight="750" text-anchor="middle">−7 = −7 → 차분식 통과</text>
<rect x="20" y="534" width="680" height="152" rx="10" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="568" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">③ 사이클 공식을 잘못 가져온 경우</text>
<text x="682" y="568" font-size="20" fill="#b42318" font-weight="750" text-anchor="end">0</text>
<text x="40" y="606" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">제거  A–B + D–0 = 8 + 2 = 10</text>
<text x="40" y="638" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">추가  A–D + B–0 = 1 + 9 = 10</text>
<text x="40" y="670" font-size="22" fill="#b42318" font-weight="750" text-anchor="start">차분 = 10 − 10 = 0</text>
<rect x="28" y="700" width="664" height="50" rx="12" fill="#fdeaea" stroke="#f3c1bd" stroke-width="1.5"/>
<text x="360" y="733" font-size="20" fill="#b42318" font-weight="750" text-anchor="middle">0 ≠ −7 → 한 입력으로 불일치 재현</text>
</svg>
