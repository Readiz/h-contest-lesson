<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">트리 중심과 센트로이드는 다릅니다</title><desc id="desc">정점 0에 네 잎과 길이 4의 꼬리가 붙은 9정점 트리에서 거리 중심은 5와 6, 센트로이드는 0입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="638" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">트리 중심과 센트로이드는 다릅니다</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">9개 정점 / 모든 간선 길이 1</text>
<rect x="28" y="108" width="664" height="330" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="262" y1="275" x2="110" y2="175" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="262" y1="275" x2="104" y2="275" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="262" y1="275" x2="114" y2="375" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="262" y1="275" x2="232" y2="155" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="262" y1="275" x2="370" y2="275" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="370" y1="275" x2="462" y2="275" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="462" y1="275" x2="554" y2="275" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<line x1="554" y1="275" x2="628" y2="375" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="262" cy="275" r="24" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="262" y="282" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<circle cx="110" cy="175" r="24" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="110" y="182" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<circle cx="104" cy="275" r="24" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="104" y="282" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<circle cx="114" cy="375" r="24" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="114" y="382" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<circle cx="232" cy="155" r="24" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="232" y="162" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<circle cx="370" cy="275" r="24" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
<text x="370" y="282" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">5</text>
<circle cx="462" cy="275" r="24" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
<text x="462" y="282" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">6</text>
<circle cx="554" cy="275" r="24" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="554" y="282" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">7</text>
<circle cx="628" cy="375" r="24" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="628" y="382" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">8</text>
<rect x="28" y="458" width="664" height="52" rx="10" fill="#fef3c7" stroke="#b7791f" stroke-width="1.5"/>
<text x="46" y="491" font-size="20" fill="#172b45" font-weight="700">중심 5,6: 최대 거리 3으로 최소</text>
<rect x="28" y="522" width="664" height="52" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="46" y="555" font-size="20" fill="#172b45" font-weight="700">센트로이드 0: 제거 뒤 크기 4,1,1,1,1</text>
<text x="36" y="612" font-size="20" fill="#172b45">지름 1→0→5→6→7→8의 길이는 5</text>
</svg>
