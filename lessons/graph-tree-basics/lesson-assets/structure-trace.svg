<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="title desc"><title id="title">트리 중심과 센트로이드는 다릅니다</title><desc id="desc">정점0에 네 잎과 길이4의 꼬리가 붙은9정점 트리에서 거리 중심은5와6, 센트로이드는0입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="620" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">트리 중심과 센트로이드는 다릅니다</text><text x="24" y="88" font-size="24" fill="#18324f">9개 정점 / 모든 간선 길이 1</text><path d="M220 235 L75 135" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M220 235 L70 235" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M220 235 L80 335" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M220 235 L190 115" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M220 235 L315 235" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M315 235 L405 235" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M405 235 L495 235" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M495 235 L565 335" fill="none" stroke="#607b98" stroke-width="2.5"/><circle cx="220" cy="235" r="24" fill="#d1fae5" stroke="#607b98"/><text x="220" y="243" text-anchor="middle" font-size="24">0</text><circle cx="75" cy="135" r="24" fill="#dbeafe" stroke="#607b98"/><text x="75" y="143" text-anchor="middle" font-size="24">1</text><circle cx="70" cy="235" r="24" fill="#dbeafe" stroke="#607b98"/><text x="70" y="243" text-anchor="middle" font-size="24">2</text><circle cx="80" cy="335" r="24" fill="#dbeafe" stroke="#607b98"/><text x="80" y="343" text-anchor="middle" font-size="24">3</text><circle cx="190" cy="115" r="24" fill="#dbeafe" stroke="#607b98"/><text x="190" y="123" text-anchor="middle" font-size="24">4</text><circle cx="315" cy="235" r="24" fill="#fde68a" stroke="#607b98"/><text x="315" y="243" text-anchor="middle" font-size="24">5</text><circle cx="405" cy="235" r="24" fill="#fde68a" stroke="#607b98"/><text x="405" y="243" text-anchor="middle" font-size="24">6</text><circle cx="495" cy="235" r="24" fill="#dbeafe" stroke="#607b98"/><text x="495" y="243" text-anchor="middle" font-size="24">7</text><circle cx="565" cy="335" r="24" fill="#dbeafe" stroke="#607b98"/><text x="565" y="343" text-anchor="middle" font-size="24">8</text><rect x="24" y="397" width="550" height="56" rx="9" fill="#fef3c7" stroke="#91a4b9"/><text x="36" y="433.0" font-size="23" fill="#18324f">중심 5,6: 최대 거리 3으로 최소</text><rect x="24" y="473" width="550" height="56" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="36" y="509.0" font-size="22" fill="#18324f">센트로이드 0: 제거 뒤 크기 4,1,1,1,1</text><text x="24" y="579" font-size="22" fill="#18324f">지름 1→0→5→6→7→8의 길이는 5</text></svg>
