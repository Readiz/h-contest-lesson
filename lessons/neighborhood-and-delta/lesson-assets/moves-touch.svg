<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">세 이동이 건드리는 간선</title>
<desc id="desc">점 0부터 6까지 일곱 개가 번호 순서로 이어진 경로에서 세 이동을 적용했을 때 바뀌는 간선입니다. 위치 1과 4의 두 점 교환은 간선 0-1, 1-2, 3-4, 4-5가 사라지고 0-4, 1-3, 1-5, 2-4가 생깁니다. 5번 점을 1번 자리로 옮기면 0-1, 4-5, 5-6이 사라지고 0-5, 1-5, 4-6이 생깁니다. 위치 2부터 4까지 구간을 뒤집으면 1-2와 4-5가 사라지고 1-4와 2-5가 생기며 구간 안쪽 간선 2-3, 3-4는 그대로입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="558" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">이동이 건드리는 간선</text>
<text x="28" y="84" font-size="20" fill="#53657d">점 7개의 경로 0-1-2-3-4-5-6에서 바뀌는 간선만 표시</text>
<line x1="34" y1="116" x2="74" y2="116" stroke="#ae5515" stroke-width="5"/><text x="82" y="122" font-size="18" fill="#172b45">사라지는 간선</text>
<path d="M 238 120 Q 258 100 278 120" fill="none" stroke="#2664ce" stroke-width="3.5"/><text x="288" y="122" font-size="18" fill="#172b45">생기는 간선</text>
<line x1="428" y1="116" x2="468" y2="116" stroke="#9aa8bb" stroke-width="3"/><text x="476" y="122" font-size="18" fill="#172b45">그대로인 간선</text>

<text x="28" y="168" font-size="20" fill="#172b45" font-weight="700">두 점 교환 (위치 1, 4)</text>
<line x1="60" y1="204" x2="160" y2="204" stroke="#ae5515" stroke-width="5"/>
<line x1="160" y1="204" x2="260" y2="204" stroke="#ae5515" stroke-width="5"/>
<line x1="260" y1="204" x2="360" y2="204" stroke="#9aa8bb" stroke-width="3"/>
<line x1="360" y1="204" x2="460" y2="204" stroke="#ae5515" stroke-width="5"/>
<line x1="460" y1="204" x2="560" y2="204" stroke="#ae5515" stroke-width="5"/>
<line x1="560" y1="204" x2="660" y2="204" stroke="#9aa8bb" stroke-width="3"/>
<path d="M 60 222 Q 160 322 460 222" fill="none" stroke="#2664ce" stroke-width="3.5"/>
<path d="M 160 222 Q 210 272 360 222" fill="none" stroke="#2664ce" stroke-width="3.5"/>
<path d="M 160 222 Q 260 312 560 222" fill="none" stroke="#2664ce" stroke-width="3.5"/>
<path d="M 260 222 Q 310 272 460 222" fill="none" stroke="#2664ce" stroke-width="3.5"/>

<text x="28" y="320" font-size="20" fill="#172b45" font-weight="700">한 점 옮기기 (5번 위치의 점을 1번 위치로)</text>
<line x1="60" y1="356" x2="160" y2="356" stroke="#ae5515" stroke-width="5"/>
<line x1="160" y1="356" x2="260" y2="356" stroke="#9aa8bb" stroke-width="3"/>
<line x1="260" y1="356" x2="360" y2="356" stroke="#9aa8bb" stroke-width="3"/>
<line x1="360" y1="356" x2="460" y2="356" stroke="#9aa8bb" stroke-width="3"/>
<line x1="460" y1="356" x2="560" y2="356" stroke="#ae5515" stroke-width="5"/>
<line x1="560" y1="356" x2="660" y2="356" stroke="#ae5515" stroke-width="5"/>
<path d="M 60 374 Q 310 474 560 374" fill="none" stroke="#2664ce" stroke-width="3.5"/>
<path d="M 160 374 Q 260 424 560 374" fill="none" stroke="#2664ce" stroke-width="3.5"/>
<path d="M 460 374 Q 510 404 660 374" fill="none" stroke="#2664ce" stroke-width="3.5"/>

<text x="28" y="480" font-size="20" fill="#172b45" font-weight="700">구간 뒤집기 (위치 2부터 4까지)</text>
<line x1="60" y1="516" x2="160" y2="516" stroke="#9aa8bb" stroke-width="3"/>
<line x1="160" y1="516" x2="260" y2="516" stroke="#ae5515" stroke-width="5"/>
<line x1="260" y1="516" x2="360" y2="516" stroke="#9aa8bb" stroke-width="3"/>
<line x1="360" y1="516" x2="460" y2="516" stroke="#9aa8bb" stroke-width="3"/>
<line x1="460" y1="516" x2="560" y2="516" stroke="#ae5515" stroke-width="5"/>
<line x1="560" y1="516" x2="660" y2="516" stroke="#9aa8bb" stroke-width="3"/>
<path d="M 160 534 Q 260 554 460 534" fill="none" stroke="#2664ce" stroke-width="3.5"/>
<path d="M 260 534 Q 410 554 560 534" fill="none" stroke="#2664ce" stroke-width="3.5"/>

<g fill="#ffffff" stroke="#172b45" stroke-width="2">
<circle cx="60" cy="204" r="16"/><circle cx="160" cy="204" r="16"/><circle cx="260" cy="204" r="16"/><circle cx="360" cy="204" r="16"/><circle cx="460" cy="204" r="16"/><circle cx="560" cy="204" r="16"/><circle cx="660" cy="204" r="16"/>
<circle cx="60" cy="356" r="16"/><circle cx="160" cy="356" r="16"/><circle cx="260" cy="356" r="16"/><circle cx="360" cy="356" r="16"/><circle cx="460" cy="356" r="16"/><circle cx="560" cy="356" r="16"/><circle cx="660" cy="356" r="16"/>
<circle cx="60" cy="516" r="16"/><circle cx="160" cy="516" r="16"/><circle cx="260" cy="516" r="16"/><circle cx="360" cy="516" r="16"/><circle cx="460" cy="516" r="16"/><circle cx="560" cy="516" r="16"/><circle cx="660" cy="516" r="16"/>
</g>
<g font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">
<text x="60" y="210">0</text><text x="160" y="210">1</text><text x="260" y="210">2</text><text x="360" y="210">3</text><text x="460" y="210">4</text><text x="560" y="210">5</text><text x="660" y="210">6</text>
<text x="60" y="362">0</text><text x="160" y="362">1</text><text x="260" y="362">2</text><text x="360" y="362">3</text><text x="460" y="362">4</text><text x="560" y="362">5</text><text x="660" y="362">6</text>
<text x="60" y="522">0</text><text x="160" y="522">1</text><text x="260" y="522">2</text><text x="360" y="522">3</text><text x="460" y="522">4</text><text x="560" y="522">5</text><text x="660" y="522">6</text>
</g>
</svg>
