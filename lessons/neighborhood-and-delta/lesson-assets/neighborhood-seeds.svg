<text x="585.2" y="383" font-size="17" fill="#172b45">비용 14,245</text>
<text x="28" y="421" font-size="19" fill="#172b45">교환 + 옮기기 + 뒤집기</text>
<rect x="256.7" y="402" width="253.2" height="24" fill="#2664ce"/>
