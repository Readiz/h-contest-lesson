<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 515" role="img" aria-labelledby="title desc">
<title id="title">이동 구성별 승패 (기준: 구간 뒤집기)</title>
<desc id="desc">순서 틀에서 이동의 구성을 바꿨을 때 기준(구간 뒤집기만)과 같은 시드끼리 비교한 결과입니다. 기준보다 나은 시드와 못한 시드의 수는 두 점 교환 0 대 20, 한 점 옮기기 0 대 20, 이웃한 두 점 교환 0 대 20, 교환 + 뒤집기 5 대 15, 옮기기 + 뒤집기 16 대 4, 교환 + 옮기기 + 뒤집기 16 대 4, 넷 모두 11 대 9입니다. 옮기기와 뒤집기를 함께 쓰면 20개 중 16개에서 낫고 두 점 교환이나 이웃한 두 점 교환만 쓰면 모두 못합니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="513" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">이동 구성별 승패 (기준: 구간 뒤집기)</text>
<text x="28" y="84" font-size="19" fill="#53657d">순서 틀, 시드 20개를 기준과 짝지어 비교했습니다. 오른쪽 비용은 시드</text>
<text x="28" y="109" font-size="19" fill="#53657d">20개 중 10번째로 작은 값입니다</text>
<rect x="28" y="125" width="14" height="14" fill="#2664ce"/>
<text x="50" y="137" font-size="18" fill="#172b45">기준보다 나은 시드</text>
<rect x="247.8" y="125" width="14" height="14" fill="#ae5515"/>
<text x="269.8" y="137" font-size="18" fill="#172b45">기준보다 못한 시드</text>
<text x="28" y="193" font-size="19" fill="#172b45">구간 뒤집기</text>
<rect x="256.7" y="174" width="316.5" height="24" fill="#d8e1ed"/>
<text x="415" y="193" font-size="17" fill="#53657d" text-anchor="middle">기준</text>
<text x="585.2" y="193" font-size="17" fill="#172b45">비용 14,726</text>
<text x="28" y="231" font-size="19" fill="#172b45">두 점 교환</text>
<rect x="256.7" y="212" width="316.5" height="24" fill="#ae5515"/>
<text x="415" y="231" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">20</text>
<text x="585.2" y="231" font-size="17" fill="#172b45">비용 29,199</text>
<text x="28" y="269" font-size="19" fill="#172b45">한 점 옮기기</text>
<rect x="256.7" y="250" width="316.5" height="24" fill="#ae5515"/>
<text x="415" y="269" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">20</text>
<text x="585.2" y="269" font-size="17" fill="#172b45">비용 20,467</text>
<text x="28" y="307" font-size="19" fill="#172b45">이웃한 두 점 교환</text>
<rect x="256.7" y="288" width="316.5" height="24" fill="#ae5515"/>
<text x="415" y="307" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">20</text>
<text x="585.2" y="307" font-size="17" fill="#172b45">비용 101,979</text>
