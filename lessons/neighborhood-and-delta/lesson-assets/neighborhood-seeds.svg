<text x="585.2" y="459" font-size="17" fill="#172b45">비용 14,450</text>
<line x1="256.7" y1="167" x2="256.7" y2="471" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="499" font-size="17" fill="#53657d" text-anchor="middle">시드 20개 중 나은 시드와 못한 시드의 수</text>
</svg>
