<line x1="509.9" y1="402" x2="509.9" y2="426" stroke="#f6f8fc" stroke-width="2"/>
<line x1="509.9" y1="402" x2="509.9" y2="426" stroke="#f6f8fc" stroke-width="2"/>
<text x="585.2" y="421" font-size="17" fill="#172b45">비용 14,267</text>
<text x="28" y="459" font-size="19" fill="#172b45">넷 모두</text>
<rect x="256.7" y="440" width="174.1" height="24" fill="#2664ce"/>
<text x="343.7" y="459" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">11</text>
