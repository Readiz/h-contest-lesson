<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc"><title id="title">Alpha-Beta: 이미 확보한 선택과 비교</title><desc id="desc">왼쪽 MIN 값3을 확보한 MAX는 오른쪽 MIN의 첫 값2를 보고 나머지9를 생략합니다. 오른쪽 값은2 이하입니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#172a46;font-size:21px}.small{font-size:18px}.title{font-size:28px;font-weight:700}.strong{font-weight:700}rect,line,path,circle{vector-effect:non-scaling-stroke}</style><rect width="720" height="500" rx="18" fill="#f5f8fc"/><text x="28" y="44" class="title">Alpha-Beta: 이미 확보한 선택과 비교</text><rect x="295" y="90" width="130" height="55" rx="8" fill="#d1fae5" stroke="#607999"/><text x="307" y="124.5" class="">MAX = 3</text><line x1="310" y1="145" x2="180" y2="205" stroke="#607999" stroke-width="3"/><line x1="410" y1="145" x2="545" y2="205" stroke="#607999" stroke-width="3"/><rect x="100" y="205" width="170" height="55" rx="8" fill="#dbeafe" stroke="#607999"/><text x="112" y="239.5" class="">MIN = 3</text><rect x="460" y="205" width="200" height="55" rx="8" fill="#fde68a" stroke="#607999"/><text x="472" y="239.5" class="">MIN ≤ 2</text><rect x="75" y="330" width="76" height="55" rx="8" fill="#fff" stroke="#607999"/><text x="87" y="364.5" class="">3</text><rect x="235" y="330" width="76" height="55" rx="8" fill="#fff" stroke="#607999"/><text x="247" y="364.5" class="">5</text><rect x="445" y="330" width="76" height="55" rx="8" fill="#fff" stroke="#607999"/><text x="457" y="364.5" class="">2</text><rect x="600" y="330" width="76" height="55" rx="8" fill="#fee2e2" stroke="#607999"/><text x="612" y="364.5" class="">9?</text><line x1="155" y1="260" x2="113" y2="325" stroke="#607999" stroke-width="3"/><line x1="215" y1="260" x2="273" y2="325" stroke="#607999" stroke-width="3"/><line x1="505" y1="260" x2="483" y2="325" stroke="#607999" stroke-width="3"/><line x1="600" y1="260" x2="638" y2="325" stroke="#607999" stroke-width="3"/><line x1="595" y1="322" x2="683" y2="393" stroke="#b91c1c" stroke-width="3"/><text x="28" y="438" class="">alpha = 3 ≥ beta = 2 → 마지막 잎 생략</text><text x="28" y="476" class="small">잘린 MIN 값은 정확한 2가 아니라 상한 2</text></svg>
