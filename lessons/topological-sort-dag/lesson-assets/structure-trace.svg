<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">위상 정렬: 마지막 의존성이 풀릴 때</title><desc id="desc">간선0에서2, 1에서2, 2에서3에서2는 두 선행 간선을 모두 제거한 뒤에만 큐에 들어갑니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="610" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">위상 정렬: 마지막 의존성이 풀릴 때</text><circle cx="115" cy="130" r="27" fill="#dbeafe" stroke="#607b98"/><text x="115" y="138" text-anchor="middle" font-size="24">0</text><circle cx="115" cy="270" r="27" fill="#dbeafe" stroke="#607b98"/><text x="115" y="278" text-anchor="middle" font-size="24">1</text><circle cx="330" cy="200" r="27" fill="#fde68a" stroke="#607b98"/><text x="330" y="208" text-anchor="middle" font-size="24">2</text><circle cx="505" cy="200" r="27" fill="#dbeafe" stroke="#607b98"/><text x="505" y="208" text-anchor="middle" font-size="24">3</text><path d="M143 139 L300 188" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M143 261 L300 212" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M358 200 L474 200" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="260" y="275" font-size="22" fill="#18324f">진입 차수 2</text><rect x="24" y="323" width="550" height="54" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="358.0" font-size="24" fill="#18324f">초기 큐 [0, 1] / indegree[2] = 2</text><rect x="24" y="394" width="550" height="54" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="429.0" font-size="23" fill="#18324f">0 처리: 2 → 1 / 아직 2를 넣지 않음</text><rect x="24" y="465" width="550" height="54" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="500.0" font-size="23" fill="#18324f">1 처리: 1 → 0 / 이제 2를 큐에 삽입</text><text x="24" y="570" font-size="22" fill="#18324f">순서 [0,1,2,3]과 [1,0,2,3] 모두 가능</text></svg>
