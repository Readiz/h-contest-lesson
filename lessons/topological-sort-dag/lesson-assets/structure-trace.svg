<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
<title id="title">위상 정렬: 마지막 의존성이 풀릴 때</title><desc id="desc">간선 0에서 2, 1에서 2, 2에서 3에서 2는 두 선행 간선을 모두 제거한 뒤에만 큐에 들어갑니다.</desc>
<defs><marker id="ar-9fb0c6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#9fb0c6"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="578" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">위상 정렬: 마지막 의존성이 풀릴 때</text>
<rect x="28" y="76" width="664" height="230" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="157.1" y1="136.9" x2="339" y2="183.1" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-9fb0c6)"/>
<line x1="157.1" y1="245.1" x2="339" y2="198.9" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-9fb0c6)"/>
<line x1="398" y1="191" x2="568" y2="191" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-9fb0c6)"/>
<circle cx="130" cy="130" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="130" y="137" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<circle cx="130" cy="252" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="130" y="259" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<circle cx="370" cy="191" r="26" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
<text x="370" y="198" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<circle cx="600" cy="191" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="600" y="198" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<text x="370" y="252" font-size="20" fill="#b7791f" font-weight="700" text-anchor="middle">진입 차수 2</text>
<rect x="28" y="326" width="664" height="52" rx="10" fill="#f2f6fb" stroke="#9fb0c6" stroke-width="1.5"/>
<text x="46" y="359" font-size="20" fill="#172b45" font-weight="700">초기 큐 [0, 1] / indegree[2] = 2</text>
<rect x="28" y="390" width="664" height="52" rx="10" fill="#f2f6fb" stroke="#9fb0c6" stroke-width="1.5"/>
<text x="46" y="423" font-size="20" fill="#172b45" font-weight="700">0 처리: 2 → 1 / 아직 2를 넣지 않음</text>
<rect x="28" y="454" width="664" height="52" rx="10" fill="#fef3c7" stroke="#b7791f" stroke-width="1.5"/>
<text x="46" y="487" font-size="20" fill="#172b45" font-weight="700">1 처리: 1 → 0 / 이제 2를 큐에 삽입</text>
<circle cx="40" cy="544.0" r="4" fill="#2664ce"/>
<text x="56" y="550" font-size="20" fill="#172b45">순서 [0,1,2,3]과 [1,0,2,3] 모두 가능</text>
</svg>
