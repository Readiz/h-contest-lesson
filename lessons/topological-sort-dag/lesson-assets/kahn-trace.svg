<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
<title id="title">Kahn: 진입 차수가 0이 되면 큐에 들어감</title><desc id="desc">간선 0→2, 1→2, 1→3, 2→4의 진입 차수는 0,0,2,1,1입니다. 큐 [0,1]에서 시작해 0을 꺼내면 2의 차수가 1, 1을 꺼내면 2와 3의 차수가 0이 되어 큐가 [2,3], 2를 꺼내면 4가 들어가 큐 [3,4]가 되고 순서는 0 1 2 3 4입니다.</desc>
