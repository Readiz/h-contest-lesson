<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">구간별 호출 합, 1단계와 2단계</text>
<text x="28" y="84" font-size="19" fill="#53657d">10개 TC 합입니다. 두 단계는 높이 재기와 비우기가 같고 정렬 구간만</text>
<text x="28" y="109" font-size="19" fill="#53657d">다릅니다. 기준선은 눈금 밖이라 뺐습니다</text>
