<circle cx="254.9" cy="214" r="5.5" fill="#ae5515" fill-opacity="0.6"/>
<line x1="254.2" y1="199" x2="254.2" y2="229" stroke="#172b45" stroke-width="3.5"/>
<text x="589.1" y="220" font-size="17" fill="#172b45">235,134,729</text>
<text x="28" y="264" font-size="19" fill="#172b45">경로: x 먼저만</text>
<circle cx="318.3" cy="258" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<circle cx="317" cy="258" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<circle cx="316.8" cy="258" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<circle cx="317.7" cy="258" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<circle cx="318.2" cy="258" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<line x1="317.7" y1="243" x2="317.7" y2="273" stroke="#172b45" stroke-width="3.5"/>
<text x="589.1" y="264" font-size="17" fill="#172b45">247,900,703</text>
<text x="28" y="308" font-size="19" fill="#172b45">임시 칸 4개</text>
<circle cx="543" cy="302" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<circle cx="539.3" cy="302" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<circle cx="541.1" cy="302" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<circle cx="543.9" cy="302" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<circle cx="542.5" cy="302" r="5.5" fill="#2664ce" fill-opacity="0.6"/>
<line x1="542.5" y1="287" x2="542.5" y2="317" stroke="#172b45" stroke-width="3.5"/>
<text x="589.1" y="308" font-size="17" fill="#172b45">293,033,959</text>
<line x1="178.8" y1="192" x2="178.8" y2="324" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="374" font-size="17" fill="#53657d" text-anchor="middle">10개 TC 점수 합 ↓ (작을수록 좋음)</text>
</svg>
