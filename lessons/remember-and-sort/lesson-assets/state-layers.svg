<text x="262" y="460" font-size="19" fill="#172b45" font-weight="700" text-anchor="start">H = 5, orig = 3</text>
<text x="486" y="460" font-size="19" fill="#172b45" font-weight="700" text-anchor="start">H = 4, orig = 3</text>
<text x="38" y="484" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="start">5개 값을 모두 안다</text>
<text x="262" y="484" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="start">위 2개만 값을 기억</text>
<text x="486" y="484" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="start">꺼낸 값이 기억과</text>
<text x="486" y="508" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="start">같은지 확인한다</text>
