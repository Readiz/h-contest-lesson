<text x="624.5" y="324" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">20 / 20</text>
<rect x="203.5" y="333" width="392.4" height="24" fill="#ae5515"/>
<text x="603.9" y="352" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">19 / 20</text>
<text x="28" y="413" font-size="19" fill="#172b45" font-weight="700">평가 300,000번</text>
<rect x="203.5" y="383" width="309.8" height="24" fill="#9db6e0"/>
