<rect x="203.5" y="411" width="165.2" height="24" fill="#2664ce"/>
<text x="376.7" y="430" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">8 / 20</text>
<rect x="203.5" y="439" width="82.6" height="24" fill="#ae5515"/>
<text x="294.1" y="458" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">4 / 20</text>
<text x="28" y="519" font-size="19" fill="#172b45" font-weight="700">평가 1,000,000번</text>
<rect x="203.5" y="489" width="309.8" height="24" fill="#9db6e0"/>
<text x="521.3" y="508" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">15 / 20</text>
<rect x="203.5" y="517" width="41.3" height="24" fill="#2664ce"/>
<text x="252.8" y="536" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">2 / 20</text>
<rect x="203.5" y="545" width="20.7" height="24" fill="#ae5515"/>
<text x="232.2" y="564" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1 / 20</text>
<text x="203.5" y="611" font-size="16" fill="#53657d" text-anchor="middle">0</text>
<text x="306.8" y="611" font-size="16" fill="#53657d" text-anchor="middle">5</text>
<text x="410" y="611" font-size="16" fill="#53657d" text-anchor="middle">10</text>
<text x="513.3" y="611" font-size="16" fill="#53657d" text-anchor="middle">15</text>
<text x="616.5" y="611" font-size="16" fill="#53657d" text-anchor="middle">20</text>
<line x1="203.5" y1="165" x2="203.5" y2="589" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="639" font-size="17" fill="#53657d" text-anchor="middle">목표 미달 시드 수 ↓ (작을수록 좋음, 최대 20)</text>
</svg>
