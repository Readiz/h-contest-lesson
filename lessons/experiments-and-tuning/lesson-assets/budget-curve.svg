<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 527" role="img" aria-labelledby="title desc">
<title id="title">예산을 늘릴 때의 최고 비용</title>
<desc id="desc">순서 틀에서 평가 횟수(로그 눈금) 30,000, 100,000, 300,000, 1,000,000번일 때 시드 20개의 최고 비용 중앙값입니다. 거의 0도는 17,863, 14,757, 14,321, 14,321로 300,000번 뒤 멈추고, 일정 온도는 18,088, 14,935, 13,950, 13,623, 고른 설정은 17,869, 14,582, 13,673, 13,385로 예산이 늘수록 계속 내려가 1,000,000번에서 가장 낮습니다.</desc>
