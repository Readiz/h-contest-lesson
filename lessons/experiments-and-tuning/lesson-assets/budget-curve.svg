<text x="28" y="84" font-size="19" fill="#53657d">순서 틀, 시드 20개 중 10번째로 작은 값(중앙값). 한 예산의 순위가</text>
<text x="28" y="109" font-size="19" fill="#53657d">곡선 전체의 순위가 아닙니다</text>
