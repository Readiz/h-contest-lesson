<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 596" role="img" aria-labelledby="title desc">
<title id="title">같은 입력끼리 빼면 차이가 보인다</title>
<desc id="desc">배정 틀 평가 100,000에서 시드 1~6의 거의 0도 설정(원)과 고른 설정(네모)의 비용은 44,000에서 54,000까지 입력마다 크게 달라 두 점이 겹쳐 보입니다. 같은 시드끼리 뺀 차이는 시드 1부터 6까지 모두 양수로 93에서 186 사이이며, 같은 입력끼리 짝지으면 두 설정의 차이가 일관되게 드러납니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="594" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">같은 시드끼리 빼 보기</text>
<text x="28" y="84" font-size="20" fill="#53657d">배정 틀 · 평가 100,000 · 시드 1~6</text>
<text x="28" y="112" font-size="19" fill="#172b45" font-weight="700">시드마다 두 설정의 비용</text>
<line x1="96" y1="262.6" x2="696" y2="262.6" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="88" y="268.6" font-size="16" fill="#53657d" text-anchor="end">44,000</text>
<line x1="96" y1="219.7" x2="696" y2="219.7" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="88" y="225.7" font-size="16" fill="#53657d" text-anchor="end">48,000</text>
<line x1="96" y1="176.9" x2="696" y2="176.9" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="88" y="182.9" font-size="16" fill="#53657d" text-anchor="end">52,000</text>
<circle cx="150" cy="198.9" r="9" fill="#2664ce"/>
<rect x="142" y="189.9" width="16" height="16" fill="#ae5515" fill-opacity="0.85"/>
<text x="150" y="312" font-size="18" fill="#172b45" text-anchor="middle">시드 1</text>
<circle cx="250" cy="262.8" r="9" fill="#2664ce"/>
<rect x="242" y="253.8" width="16" height="16" fill="#ae5515" fill-opacity="0.85"/>
<text x="250" y="312" font-size="18" fill="#172b45" text-anchor="middle">시드 2</text>
<circle cx="350" cy="205.5" r="9" fill="#2664ce"/>
<rect x="342" y="196.1" width="16" height="16" fill="#ae5515" fill-opacity="0.85"/>
<text x="350" y="312" font-size="18" fill="#172b45" text-anchor="middle">시드 3</text>
<circle cx="450" cy="211.1" r="9" fill="#2664ce"/>
<rect x="442" y="201.2" width="16" height="16" fill="#ae5515" fill-opacity="0.85"/>
<text x="450" y="312" font-size="18" fill="#172b45" text-anchor="middle">시드 4</text>
<circle cx="550" cy="226.6" r="9" fill="#2664ce"/>
<rect x="542" y="216.6" width="16" height="16" fill="#ae5515" fill-opacity="0.85"/>
<text x="550" y="312" font-size="18" fill="#172b45" text-anchor="middle">시드 5</text>
<circle cx="650" cy="154.3" r="9" fill="#2664ce"/>
<rect x="642" y="145.1" width="16" height="16" fill="#ae5515" fill-opacity="0.85"/>
<text x="650" y="312" font-size="18" fill="#172b45" text-anchor="middle">시드 6</text>
<text x="28" y="360" font-size="19" fill="#172b45" font-weight="700">같은 시드끼리의 차이(고른 설정 − 거의 0도)</text>
<line x1="96" y1="460" x2="696" y2="460" stroke="#172b45" stroke-width="2"/>
<text x="88" y="466" font-size="16" fill="#53657d" text-anchor="end">0</text>
<rect x="128" y="407.2" width="44" height="52.8" fill="#ae5515"/>
<text x="150" y="399.2" font-size="18" fill="#172b45" text-anchor="middle">+96</text>
<rect x="228" y="408.9" width="44" height="51.2" fill="#ae5515"/>
<text x="250" y="400.9" font-size="18" fill="#172b45" text-anchor="middle">+93</text>
<rect x="328" y="391.8" width="44" height="68.2" fill="#ae5515"/>
<text x="350" y="383.8" font-size="18" fill="#172b45" text-anchor="middle">+124</text>
<rect x="428" y="362.6" width="44" height="97.4" fill="#ae5515"/>
<text x="450" y="354.6" font-size="18" fill="#172b45" text-anchor="middle">+177</text>
<rect x="528" y="357.7" width="44" height="102.3" fill="#ae5515"/>
<text x="550" y="349.7" font-size="18" fill="#172b45" text-anchor="middle">+186</text>
<rect x="628" y="399.5" width="44" height="60.5" fill="#ae5515"/>
<text x="650" y="391.5" font-size="18" fill="#172b45" text-anchor="middle">+110</text>
<circle cx="118" cy="500" r="8" fill="#2664ce"/><text x="134" y="506" font-size="18" fill="#172b45">거의 0도</text>
<rect x="262" y="492" width="16" height="16" fill="#ae5515"/><text x="286" y="506" font-size="18" fill="#172b45">고른 설정</text>
<text x="28" y="544" font-size="18" fill="#172b45">비용은 입력마다 크게 달라 두 설정의 점이 겹쳐 보인다.</text>
<text x="28" y="570" font-size="18" fill="#172b45">같은 시드끼리 빼면 차이가 시드 6개 모두에서 양수다.</text>
</svg>
