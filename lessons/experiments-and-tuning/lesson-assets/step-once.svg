<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
<title id="title">튜닝 한 걸음 stepOnce의 다섯 단계</title>
<desc id="desc">stepOnce의 다섯 단계다. 첫째 현재 설정을 시드 first부터 n개에서 돌려 base를 얻는다. 둘째 nudge가 t0와 t1을 두 배 또는 절반으로, ins를 25 더하거나 빼서 매개변수 하나만 바꾼 후보를 최대 여섯 개 만든다. 셋째 후보를 같은 시드로 돌려 paired로 base와 짝지어 후보가 나은 시드 수를 센다. 넷째 가장 많이 이긴 후보와 그 승 수 bestWins를 기억한다. 다섯째 bestWins가 need 이상이면 현재 설정을 그 후보로 옮기고 아니면 멈춘다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#53657d"/></marker></defs>
<rect x="1" y="1" width="718" height="578" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">튜닝 한 걸음 stepOnce</text>
<text x="28" y="84" font-size="20" fill="#53657d">한 번에 하나씩 바꿔 보고, 충분히 이기는 후보가 있으면 옮깁니다</text>
<rect x="28" y="108" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="152" font-size="19" fill="#172b45" font-weight="700">1. 현재 설정을 돌린다</text>
<text x="300" y="140" font-size="18" fill="#172b45">base[i] = cost(cur, first + i)</text>
<text x="300" y="166" font-size="18" fill="#172b45">시드 n개에서 한 번씩</text>
<line x1="360" y1="184" x2="360" y2="202" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="28" y="202" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="246" font-size="19" fill="#172b45" font-weight="700">2. 하나만 바꾼 후보</text>
<text x="300" y="234" font-size="18" fill="#172b45">nudge(cur, which, cand), which 0..5</text>
<text x="300" y="260" font-size="18" fill="#172b45">t0·t1 두 배·절반, ins ± 25</text>
<line x1="360" y1="278" x2="360" y2="296" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="28" y="296" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="340" font-size="19" fill="#172b45" font-weight="700">3. 같은 시드로 짝짓기</text>
<text x="300" y="328" font-size="18" fill="#172b45">v[i] = cost(cand, first + i)</text>
<text x="300" y="354" font-size="18" fill="#172b45">paired(v, base, n)로 후보가 나은 시드 수</text>
<line x1="360" y1="372" x2="360" y2="390" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="28" y="390" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="434" font-size="19" fill="#172b45" font-weight="700">4. 가장 많이 이긴 후보</text>
<text x="300" y="422" font-size="18" fill="#172b45">t.win이 가장 큰 후보를 best로 기억</text>
<text x="300" y="448" font-size="18" fill="#172b45">그 승 수가 bestWins</text>
<line x1="360" y1="466" x2="360" y2="484" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="28" y="484" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="528" font-size="19" fill="#172b45" font-weight="700">5. 옮길까</text>
<text x="300" y="516" font-size="18" fill="#172b45">bestWins ≥ need이면 cur = best (true)</text>
<text x="300" y="542" font-size="18" fill="#172b45">아니면 그대로 멈춘다 (false)</text>
</svg>
