<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 477" role="img" aria-labelledby="title desc">
<title id="title">거의 0도와 비교하면</title>
<desc id="desc">고른 설정을 거의 0도와 같은 시드끼리 비교한 결과입니다. 확인 시드 21~40 19 대 1, 점 100개 19 대 1, 점 400개 8 대 12, 8개 뭉치 분포 10 대 10, 배정 틀 0 대 20, 예산 100,000 15 대 5, 예산 1,000,000 20 대 0입니다. 배정 틀에서는 모든 시드에서 고른 설정이 나쁩니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="475" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">거의 0도와 비교하면</text>
<text x="28" y="84" font-size="19" fill="#53657d">같은 행을 거의 0도(온도가 거의 없는 탐색)와 비교(시드 20개). 튜닝한</text>
<text x="28" y="109" font-size="19" fill="#53657d">입력 가족 밖에서는 이기지 못하는 곳이 생깁니다</text>
<rect x="28" y="125" width="14" height="14" fill="#2664ce"/>
<text x="50" y="137" font-size="18" fill="#172b45">고른 설정이 나은 시드</text>
<rect x="275.7" y="125" width="14" height="14" fill="#ae5515"/>
<text x="297.7" y="137" font-size="18" fill="#172b45">고른 설정이 못한 시드</text>
<text x="28" y="193" font-size="19" fill="#172b45">확인 시드 21~40</text>
<rect x="191.2" y="174" width="312.9" height="24" fill="#2664ce"/>
<text x="347.6" y="193" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">19</text>
<rect x="504" y="174" width="16.5" height="24" fill="#ae5515"/>
<line x1="504" y1="174" x2="504" y2="198" stroke="#f6f8fc" stroke-width="2"/>
<line x1="504" y1="174" x2="504" y2="198" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="193" font-size="17" fill="#172b45">19 / 1 더 좋음</text>
<text x="28" y="231" font-size="19" fill="#172b45">점 100개</text>
<rect x="191.2" y="212" width="312.9" height="24" fill="#2664ce"/>
<text x="347.6" y="231" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">19</text>
<rect x="504" y="212" width="16.5" height="24" fill="#ae5515"/>
<line x1="504" y1="212" x2="504" y2="236" stroke="#f6f8fc" stroke-width="2"/>
<line x1="504" y1="212" x2="504" y2="236" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="231" font-size="17" fill="#172b45">19 / 1 더 좋음</text>
<text x="28" y="269" font-size="19" fill="#172b45">점 400개</text>
<rect x="191.2" y="250" width="131.7" height="24" fill="#2664ce"/>
<text x="257" y="269" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">8</text>
<rect x="322.9" y="250" width="197.6" height="24" fill="#ae5515"/>
<text x="421.7" y="269" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">12</text>
<line x1="322.9" y1="250" x2="322.9" y2="274" stroke="#f6f8fc" stroke-width="2"/>
<line x1="322.9" y1="250" x2="322.9" y2="274" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="269" font-size="17" fill="#172b45">8 / 12 결정 못 함</text>
<text x="28" y="307" font-size="19" fill="#172b45">8개 뭉치 분포</text>
<rect x="191.2" y="288" width="164.7" height="24" fill="#2664ce"/>
<text x="273.5" y="307" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">10</text>
<rect x="355.8" y="288" width="164.7" height="24" fill="#ae5515"/>
<text x="438.2" y="307" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">10</text>
<line x1="355.8" y1="288" x2="355.8" y2="312" stroke="#f6f8fc" stroke-width="2"/>
<line x1="355.8" y1="288" x2="355.8" y2="312" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="307" font-size="17" fill="#172b45">10 / 10 결정 못 함</text>
<text x="28" y="345" font-size="19" fill="#172b45">배정 틀</text>
<rect x="191.2" y="326" width="329.4" height="24" fill="#ae5515"/>
<text x="355.8" y="345" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">20</text>
<text x="532.5" y="345" font-size="17" fill="#172b45">0 / 20 더 나쁨</text>
<text x="28" y="383" font-size="19" fill="#172b45">예산 100,000</text>
<rect x="191.2" y="364" width="247" height="24" fill="#2664ce"/>
<text x="314.7" y="383" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">15</text>
<rect x="438.2" y="364" width="82.3" height="24" fill="#ae5515"/>
<text x="479.3" y="383" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<line x1="438.2" y1="364" x2="438.2" y2="388" stroke="#f6f8fc" stroke-width="2"/>
<line x1="438.2" y1="364" x2="438.2" y2="388" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="383" font-size="17" fill="#172b45">15 / 5 더 좋음</text>
<text x="28" y="421" font-size="19" fill="#172b45">예산 1,000,000</text>
<rect x="191.2" y="402" width="329.4" height="24" fill="#2664ce"/>
<text x="355.8" y="421" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">20</text>
<text x="532.5" y="421" font-size="17" fill="#172b45">20 / 0 더 좋음</text>
<line x1="191.2" y1="167" x2="191.2" y2="433" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="461" font-size="17" fill="#53657d" text-anchor="middle">시드 20개 중 고른 설정이 나은 / 못한 시드 수 (15개 이상이면 차이 있음)</text>
</svg>
