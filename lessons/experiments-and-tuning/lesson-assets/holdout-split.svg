<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">시드를 용도로 나눈 실험 흐름</title>
<desc id="desc">시드 1~20에서 설정을 비교해 하나를 고르고, 시드 21~40에서 그 설정을 한 번만 확인하며, 크기·분포·예산·문제 틀을 바꾼 입력에서 다시 확인한 뒤 확인한 범위와 함께 확인 시드의 값을 보고하는 네 단계의 흐름입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="558" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">고르는 시드와 확인 시드</text>
<text x="28" y="84" font-size="20" fill="#53657d">확인 시드는 한 번만 본다</text>
<rect x="28" y="112" width="664" height="78" rx="12" fill="#ffffff" stroke="#2664ce" stroke-width="2.5"/>
<text x="48" y="144" font-size="22" fill="#172b45" font-weight="700">시드 1~20 · 고르는 시드</text>
<text x="48" y="173" font-size="18" fill="#53657d">설정 후보를 비교하고 하나를 고른다. 비교가 많을수록 이 시드의 우연이 섞인다</text>
<line x1="360" y1="192" x2="360" y2="216" stroke="#172b45" stroke-width="3"/>
<path d="M 350 207 L 360 218 L 370 207" fill="none" stroke="#172b45" stroke-width="3"/>
<rect x="28" y="218" width="664" height="78" rx="12" fill="#ffffff" stroke="#ae5515" stroke-width="2.5"/>
<text x="48" y="250" font-size="22" fill="#172b45" font-weight="700">시드 21~40 · 확인 시드</text>
<text x="48" y="279" font-size="18" fill="#53657d">고른 설정을 한 번만 본다. 여기서 다시 고르면 이 시드도 고르는 시드가 된다</text>
<line x1="360" y1="298" x2="360" y2="322" stroke="#172b45" stroke-width="3"/>
<path d="M 350 313 L 360 324 L 370 313" fill="none" stroke="#172b45" stroke-width="3"/>
<rect x="28" y="324" width="664" height="78" rx="12" fill="#ffffff" stroke="#53657d" stroke-width="2.5"/>
<text x="48" y="356" font-size="22" fill="#172b45" font-weight="700">변형 입력 · 크기, 분포, 예산, 문제 틀</text>
<text x="48" y="385" font-size="18" fill="#53657d">튜닝한 입력 가족 밖에서도 통하는지 본다. 안 통하면 한정해서 적는다</text>
<line x1="360" y1="404" x2="360" y2="428" stroke="#172b45" stroke-width="3"/>
<path d="M 350 419 L 360 430 L 370 419" fill="none" stroke="#172b45" stroke-width="3"/>
<rect x="28" y="430" width="664" height="78" rx="12" fill="#ffffff" stroke="#53657d" stroke-width="2.5"/>
<text x="48" y="462" font-size="22" fill="#172b45" font-weight="700">보고</text>
<text x="48" y="491" font-size="18" fill="#53657d">확인 시드의 값과 확인한 범위를 적는다. 고른 시드의 값은 참고만 한다</text>
</svg>
