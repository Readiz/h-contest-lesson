<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 572" role="img" aria-labelledby="title desc">
<title id="title">20개 시드에서 이긴 시드 수의 분포</title>
<desc id="desc">위 그림은 두 설정이 실제로 같을 때 시드 20개 중 한 설정이 이긴 시드 수의 분포로, 15개 이상이거나 5개 이하일 확률의 합이 0.0414입니다. 아래 그림은 시드마다 이길 확률이 0.7일 때의 분포로, 같은 구간에 들어갈 확률이 0.4164입니다. 색칠한 막대가 15 / 20 규칙이 차이 있음으로 판정하는 구간입니다.</desc>
