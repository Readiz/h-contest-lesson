<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">15 / 20 규칙의 확률</text>
<text x="28" y="84" font-size="20" fill="#53657d">막대 높이는 정확한 이항 분포(20번)</text>
<text x="28" y="106" font-size="19" fill="#172b45" font-weight="700">두 설정이 같을 때(이길 확률 1/2): 15개 이상 또는 5개 이하의 합 0.0414</text>
