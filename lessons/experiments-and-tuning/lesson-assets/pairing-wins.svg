<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 515" role="img" aria-labelledby="title desc">
<title id="title">짝짓지 않으면 차이가 사라진다</title>
<desc id="desc">같은 입력끼리 짝지어 비교하면 순서 틀은 17 대 3로 차이가 잡히지만 입력을 어긋나게 하면 13 대 7, 13 대 7, 12 대 8, 12 대 8로 결정 못 함입니다. 배정 틀은 짝지으면 0 대 20로 고른 설정이 모두 못하는데 입력을 밀면 12 대 8, 10 대 10로 결정 못 함으로 사라집니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="513" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">짝짓지 않으면 차이가 사라진다</text>
<text x="28" y="84" font-size="19" fill="#53657d">고른 설정이 나은 시드와 못한 시드의 수(시드 20개). 순서 틀은 일정</text>
<text x="28" y="109" font-size="19" fill="#53657d">온도와, 배정 틀은 거의 0도와 비교했습니다</text>
<rect x="28" y="125" width="14" height="14" fill="#2664ce"/>
<text x="50" y="137" font-size="18" fill="#172b45">고른 설정이 나은 시드</text>
<rect x="275.7" y="125" width="14" height="14" fill="#ae5515"/>
<text x="297.7" y="137" font-size="18" fill="#172b45">고른 설정이 못한 시드</text>
<text x="28" y="193" font-size="19" fill="#172b45">순서: 짝지음</text>
<rect x="212.1" y="174" width="262.2" height="24" fill="#2664ce"/>
<text x="343.1" y="193" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">17</text>
<rect x="474.2" y="174" width="46.3" height="24" fill="#ae5515"/>
<text x="497.4" y="193" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<line x1="474.2" y1="174" x2="474.2" y2="198" stroke="#f6f8fc" stroke-width="2"/>
<line x1="474.2" y1="174" x2="474.2" y2="198" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="193" font-size="17" fill="#172b45">17 / 3 더 좋음</text>
<text x="28" y="231" font-size="19" fill="#172b45">순서: 시드 21~40</text>
<rect x="212.1" y="212" width="200.5" height="24" fill="#2664ce"/>
<text x="312.3" y="231" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">13</text>
<rect x="412.5" y="212" width="108" height="24" fill="#ae5515"/>
<text x="466.5" y="231" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
<line x1="412.5" y1="212" x2="412.5" y2="236" stroke="#f6f8fc" stroke-width="2"/>
<line x1="412.5" y1="212" x2="412.5" y2="236" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="231" font-size="17" fill="#172b45">13 / 7 결정 못 함</text>
<text x="28" y="269" font-size="19" fill="#172b45">순서: 시드 41~60</text>
<rect x="212.1" y="250" width="200.5" height="24" fill="#2664ce"/>
<text x="312.3" y="269" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">13</text>
<rect x="412.5" y="250" width="108" height="24" fill="#ae5515"/>
<text x="466.5" y="269" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
<line x1="412.5" y1="250" x2="412.5" y2="274" stroke="#f6f8fc" stroke-width="2"/>
<line x1="412.5" y1="250" x2="412.5" y2="274" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="269" font-size="17" fill="#172b45">13 / 7 결정 못 함</text>
<text x="28" y="307" font-size="19" fill="#172b45">순서: 시드 61~80</text>
<rect x="212.1" y="288" width="185.1" height="24" fill="#2664ce"/>
<text x="304.6" y="307" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">12</text>
<rect x="397.1" y="288" width="123.4" height="24" fill="#ae5515"/>
<text x="458.8" y="307" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">8</text>
<line x1="397.1" y1="288" x2="397.1" y2="312" stroke="#f6f8fc" stroke-width="2"/>
<line x1="397.1" y1="288" x2="397.1" y2="312" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="307" font-size="17" fill="#172b45">12 / 8 결정 못 함</text>
<text x="28" y="345" font-size="19" fill="#172b45">순서: 시드 81~100</text>
<rect x="212.1" y="326" width="185.1" height="24" fill="#2664ce"/>
<text x="304.6" y="345" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">12</text>
<rect x="397.1" y="326" width="123.4" height="24" fill="#ae5515"/>
<text x="458.8" y="345" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">8</text>
<line x1="397.1" y1="326" x2="397.1" y2="350" stroke="#f6f8fc" stroke-width="2"/>
<line x1="397.1" y1="326" x2="397.1" y2="350" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="345" font-size="17" fill="#172b45">12 / 8 결정 못 함</text>
<text x="28" y="383" font-size="19" fill="#172b45">배정: 짝지음</text>
<rect x="212.1" y="364" width="308.4" height="24" fill="#ae5515"/>
<text x="366.3" y="383" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">20</text>
<text x="532.5" y="383" font-size="17" fill="#172b45">0 / 20 더 나쁨</text>
<text x="28" y="421" font-size="19" fill="#172b45">배정: 5칸 밀기</text>
<rect x="212.1" y="402" width="185.1" height="24" fill="#2664ce"/>
<text x="304.6" y="421" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">12</text>
<rect x="397.1" y="402" width="123.4" height="24" fill="#ae5515"/>
<text x="458.8" y="421" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">8</text>
<line x1="397.1" y1="402" x2="397.1" y2="426" stroke="#f6f8fc" stroke-width="2"/>
<line x1="397.1" y1="402" x2="397.1" y2="426" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="421" font-size="17" fill="#172b45">12 / 8 결정 못 함</text>
<text x="28" y="459" font-size="19" fill="#172b45">배정: 10칸 밀기</text>
<rect x="212.1" y="440" width="154.2" height="24" fill="#2664ce"/>
<text x="289.2" y="459" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">10</text>
<rect x="366.3" y="440" width="154.2" height="24" fill="#ae5515"/>
<text x="443.4" y="459" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">10</text>
<line x1="366.3" y1="440" x2="366.3" y2="464" stroke="#f6f8fc" stroke-width="2"/>
<line x1="366.3" y1="440" x2="366.3" y2="464" stroke="#f6f8fc" stroke-width="2"/>
<text x="532.5" y="459" font-size="17" fill="#172b45">10 / 10 결정 못 함</text>
<line x1="212.1" y1="167" x2="212.1" y2="471" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="499" font-size="17" fill="#53657d" text-anchor="middle">시드 20개 중 고른 설정이 나은 / 못한 시드 수 (15개 이상이면 차이 있음)</text>
</svg>
