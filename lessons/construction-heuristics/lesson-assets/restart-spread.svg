<title id="title">64번 구성한 경로 길이의 점 분포</title>
<desc id="desc">입력 시드 1에서 첫 점을 무작위로 바꾼 가장 가까운 점 잇기 64번의 길이 분포입니다. 최솟값은 4번 중 14,809, 16번 중 14,593, 64번 중 14,517이고 결정적인 후회 삽입 한 번은 13,827로 모두보다 짧습니다. 첫 점 0에서 시작한 한 번은 15,683입니다.</desc>
