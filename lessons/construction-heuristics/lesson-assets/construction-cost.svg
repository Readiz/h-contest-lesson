<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 453" role="img" aria-labelledby="title desc">
<title id="title">구성법별 구성 직후 경로 길이</title>
<desc id="desc">순서 틀에서 구성법마다 입력 시드 20개의 구성 직후 경로 길이를 점으로 찍고 중앙값을 세로 눈금으로 보인 그림입니다. 세로 띠 8개 16,396, 가장 가까운 점(NN) 16,051, 가장 싼 삽입 15,366.5, 가장 먼 점 삽입 14,766.5, 후회 삽입 14,302.5이며 후회 삽입이 가장 짧고 분포도 다른 구성법과 거의 겹치지 않습니다. 번호 순서(중앙값 131,664)는 눈금 밖이라 그리지 않았습니다.</desc>
