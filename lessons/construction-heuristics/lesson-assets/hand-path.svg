<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
<title id="title">7개 점에서 가장 가까운 점 잇기와 후회 삽입의 경로 비교</title>
<desc id="desc">왼쪽은 점 0에서 가장 가까운 점을 잇는 방법으로 길이 22이고 4번 점에서 2번 점으로 가는 7칸의 긴 이동이 있습니다. 오른쪽은 후회 삽입으로 길이 18이며 이것이 최단입니다. 경로는 가로 세로로 꺾어 그렸습니다.</desc>
