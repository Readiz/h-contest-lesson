<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">같은 7개 점, 다른 경로</text>
<text x="28" y="84" font-size="19" fill="#53657d">맨해튼 거리라서 경로를 가로 세로로 꺾어 그렸습니다 · 주황은 가장 긴 이동</text>
