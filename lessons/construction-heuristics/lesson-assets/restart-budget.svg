<circle cx="613.1" cy="484.9" r="6" fill="#e1a56f" stroke="#f6f8fc" stroke-width="2"/>
<text x="613.1" y="471.9" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">13,981</text>
<text x="360" y="587" font-size="17" fill="#53657d" text-anchor="middle">평가 횟수 (로그 눈금)</text>
</svg>
