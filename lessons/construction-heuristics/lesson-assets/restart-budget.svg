<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 603" role="img" aria-labelledby="title desc">
<title id="title">평가를 더 쓰면 얼마나 짧아지나</title>
<desc id="desc">순서 틀에서 구성에 쓴 평가 횟수(로그 눈금)와 경로 길이 중앙값의 관계입니다. NN을 첫 점 무작위로 1, 4, 16, 64번 만들면 16,051, 15,534, 15,312.5, 15,124.5로 줄지만 NN 64번(평가 1,273,600번)도 후회 삽입 한 번(14,302.5, 평가 1,353,200번)보다 깁니다. 후회 삽입에 25% 흔들기를 5번 하면 13,981입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
