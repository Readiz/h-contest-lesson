<line x1="92.8" y1="233" x2="680" y2="233" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="130.8" y1="233" x2="130.8" y2="533" stroke="#d8e1ed" stroke-width="1"/>
<line x1="301.2" y1="233" x2="301.2" y2="533" stroke="#d8e1ed" stroke-width="1"/>
<line x1="471.6" y1="233" x2="471.6" y2="533" stroke="#d8e1ed" stroke-width="1"/>
<line x1="642" y1="233" x2="642" y2="533" stroke="#d8e1ed" stroke-width="1"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">평가를 더 쓰면 얼마나 짧아지나</text>
<text x="28" y="84" font-size="19" fill="#53657d">순서 틀, 시드 20개의 중앙값. 가로는 구성에 쓴 평가 횟수(로그</text>
<text x="28" y="109" font-size="19" fill="#53657d">눈금)입니다</text>
<line x1="28" y1="132" x2="48" y2="132" stroke="#2664ce" stroke-width="3.5"/>
<circle cx="38" cy="132" r="4.5" fill="#2664ce"/>
<text x="56" y="137" font-size="18" fill="#172b45">NN, 첫 점 무작위 가장 좋은 것 (1·4·16·64번)</text>
<circle cx="35" cy="160" r="6" fill="#9db6e0"/>
<text x="50" y="165" font-size="18" fill="#172b45">NN 64번, 10% 흔들기</text>
<circle cx="271.9" cy="160" r="6" fill="#ae5515"/>
<text x="286.9" y="165" font-size="18" fill="#172b45">후회 삽입 1번</text>
<circle cx="35" cy="188" r="6" fill="#e1a56f"/>
<text x="50" y="193" font-size="18" fill="#172b45">후회 삽입 + 25% 흔들기 5번</text>
<text x="28" y="219" font-size="17" fill="#53657d">경로 길이 중앙값 ↓ (작을수록 좋음)</text>
<text x="84.8" y="538" font-size="16" fill="#53657d" text-anchor="end">13,500</text>
