<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">시계를 읽는 간격과 상한 넘침</title>
<desc id="desc">연산 상한이 60이고 시계를 한 번 읽는 데 4, 제안 한 번에 5가 드는 모형입니다. 제안마다 읽으면 시계 8번과 제안 7번 끝에 연산이 67이 되어 상한을 7 넘습니다. 제안 4번마다 읽으면 시계 4번과 제안 12번 끝에 연산이 76이 되어 상한을 16 넘습니다. 읽는 횟수가 줄어 제안이 늘지만 넘치는 양도 커집니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="478" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">시계를 읽는 간격과 상한 넘침</text>
<text x="28" y="84" font-size="20" fill="#53657d">상한 60, 시계 읽기 R은 4, 제안 P는 5인 모형</text>

<text x="30" y="128" font-size="19" fill="#172b45" font-weight="700">제안마다 읽기 (every = 1)</text>
<g stroke="#ffffff" stroke-width="1.5"><rect x="30.0" y="140" width="29.6" height="36" fill="#2664ce"/><rect x="59.6" y="140" width="37.0" height="36" fill="#8fa1b8"/><rect x="96.6" y="140" width="29.6" height="36" fill="#2664ce"/><rect x="126.2" y="140" width="37.0" height="36" fill="#8fa1b8"/><rect x="163.2" y="140" width="29.6" height="36" fill="#2664ce"/><rect x="192.8" y="140" width="37.0" height="36" fill="#8fa1b8"/><rect x="229.8" y="140" width="29.6" height="36" fill="#2664ce"/><rect x="259.4" y="140" width="37.0" height="36" fill="#8fa1b8"/><rect x="296.4" y="140" width="29.6" height="36" fill="#2664ce"/><rect x="326.0" y="140" width="37.0" height="36" fill="#8fa1b8"/><rect x="363.0" y="140" width="29.6" height="36" fill="#2664ce"/><rect x="392.6" y="140" width="37.0" height="36" fill="#8fa1b8"/><rect x="429.6" y="140" width="29.6" height="36" fill="#2664ce"/><rect x="459.2" y="140" width="37.0" height="36" fill="#8fa1b8"/><rect x="496.2" y="140" width="29.6" height="36" fill="#2664ce"/></g>
<g><text x="44.8" y="165" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="78.1" y="165" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="111.4" y="165" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="144.7" y="165" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="178.0" y="165" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="211.3" y="165" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="244.6" y="165" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="277.9" y="165" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="311.2" y="165" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="344.5" y="165" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="377.8" y="165" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="411.1" y="165" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="444.4" y="165" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="477.7" y="165" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="511.0" y="165" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text></g>
<text x="30" y="212" font-size="18" fill="#172b45">시계 8번 · 제안 7번 · 끝 67 (상한을 7 넘음)</text>

<text x="30" y="272" font-size="19" fill="#172b45" font-weight="700">4번마다 읽기 (every = 4)</text>
<g stroke="#ffffff" stroke-width="1.5"><rect x="30.0" y="284" width="29.6" height="36" fill="#2664ce"/><rect x="59.6" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="96.6" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="133.6" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="170.6" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="207.6" y="284" width="29.6" height="36" fill="#2664ce"/><rect x="237.2" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="274.2" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="311.2" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="348.2" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="385.2" y="284" width="29.6" height="36" fill="#2664ce"/><rect x="414.8" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="451.8" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="488.8" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="525.8" y="284" width="37.0" height="36" fill="#8fa1b8"/><rect x="562.8" y="284" width="29.6" height="36" fill="#2664ce"/></g>
<g><text x="44.8" y="309" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="78.1" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="115.1" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="152.1" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="189.1" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="222.4" y="309" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="255.7" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="292.7" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="329.7" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="366.7" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="400.0" y="309" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text><text x="433.3" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="470.3" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="507.3" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="544.3" y="309" font-size="18" fill="#172b45" text-anchor="middle" font-weight="700">P</text><text x="577.6" y="309" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">R</text></g>
<text x="30" y="356" font-size="18" fill="#172b45">시계 4번 · 제안 12번 · 끝 76 (상한을 16 넘음)</text>

<line x1="474" y1="122" x2="474" y2="330" stroke="#ae5515" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="474" y="112" font-size="18" fill="#ae5515" text-anchor="middle" font-weight="700">상한 60</text>

<rect x="30" y="392" width="22" height="22" fill="#2664ce"/><text x="60" y="410" font-size="18" fill="#172b45">R 시계 읽기 (4)</text>
<rect x="240" y="392" width="22" height="22" fill="#8fa1b8"/><text x="270" y="410" font-size="18" fill="#172b45">P 제안 (5)</text>
<text x="30" y="448" font-size="18" fill="#53657d">읽는 간격이 길수록 시계에 쓰는 연산이 줄지만 상한을 넘는 양이 커진다.</text>
</svg>
