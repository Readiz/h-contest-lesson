<text x="358.3" y="346" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">32.9%</text>
<rect x="151.2" y="355" width="99.8" height="24" fill="#ae5515"/>
<text x="259.1" y="374" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">16.5%</text>
<text x="28" y="435" font-size="19" fill="#172b45" font-weight="700">64번마다</text>
<rect x="151.2" y="405" width="69.6" height="24" fill="#2664ce"/>
<text x="228.8" y="424" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">11.5%</text>
<rect x="151.2" y="433" width="32.1" height="24" fill="#ae5515"/>
<text x="191.3" y="452" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">5.3%</text>
<text x="28" y="513" font-size="19" fill="#172b45" font-weight="700">256번마다</text>
<rect x="151.2" y="483" width="19.4" height="24" fill="#2664ce"/>
<text x="178.6" y="502" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">3.2%</text>
<rect x="151.2" y="511" width="8.5" height="24" fill="#ae5515"/>
<text x="167.7" y="530" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1.4%</text>
<text x="28" y="591" font-size="19" fill="#172b45" font-weight="700">1,024번마다</text>
<rect x="151.2" y="561" width="4.8" height="24" fill="#2664ce"/>
<text x="164.1" y="580" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">0.8%</text>
<rect x="151.2" y="589" width="1.8" height="24" fill="#ae5515"/>
<text x="161.1" y="608" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">0.3%</text>
<text x="28" y="669" font-size="19" fill="#172b45" font-weight="700">4,096번마다</text>
<rect x="151.2" y="639" width="1.5" height="24" fill="#2664ce"/>
<text x="160.8" y="658" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">0.2%</text>
<rect x="151.2" y="667" width="1.5" height="24" fill="#ae5515"/>
<text x="160.8" y="686" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">0.0%</text>
<text x="151.2" y="733" font-size="16" fill="#53657d" text-anchor="middle">0</text>
<text x="272.2" y="733" font-size="16" fill="#53657d" text-anchor="middle">20</text>
<text x="393.2" y="733" font-size="16" fill="#53657d" text-anchor="middle">40</text>
<text x="514.2" y="733" font-size="16" fill="#53657d" text-anchor="middle">60</text>
<text x="635.2" y="733" font-size="16" fill="#53657d" text-anchor="middle">80</text>
<line x1="151.2" y1="165" x2="151.2" y2="711" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="761" font-size="17" fill="#53657d" text-anchor="middle">예산 중 시계 읽기에 쓴 비율 (%) ↓ (작을수록 좋음)</text>
</svg>
