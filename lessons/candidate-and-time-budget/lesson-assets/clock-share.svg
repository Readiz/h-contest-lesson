<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 777" role="img" aria-labelledby="title desc">
<title id="title">시계 읽기가 예산에서 차지하는 비율</title>
<desc id="desc">시계를 한 번 읽는 비용을 연산 40으로 가정했을 때 예산 2,000,000 중 시계 읽기가 차지하는 비율입니다. 읽는 간격이 1, 4, 16, 64, 256, 1,024, 4,096일 때 순서 틀은 79.1%, 61.5%, 32.9%, 11.5%, 3.2%, 0.8%, 0.2%, 배정 틀은 47.7%, 34.6%, 16.5%, 5.3%, 1.4%, 0.3%, 0.0%입니다. 매 제안 읽으면 예산의 절반 가까이를 시계가 씁니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="775" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="151.2" y1="165" x2="151.2" y2="711" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="272.2" y1="165" x2="272.2" y2="711" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="393.2" y1="165" x2="393.2" y2="711" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="514.2" y1="165" x2="514.2" y2="711" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="635.2" y1="165" x2="635.2" y2="711" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">시계 읽기가 예산에서 차지하는 비율</text>
<text x="28" y="84" font-size="19" fill="#53657d">읽기 비용 40을 연산으로 센 모형, 예산 2,000,000. 제안 몇 번마다</text>
<text x="28" y="109" font-size="19" fill="#53657d">읽는지에 따른 비율입니다</text>
<rect x="28" y="125" width="14" height="14" fill="#2664ce"/>
<text x="50" y="137" font-size="18" fill="#172b45">순서 틀</text>
<rect x="147.9" y="125" width="14" height="14" fill="#ae5515"/>
<text x="169.9" y="137" font-size="18" fill="#172b45">배정 틀</text>
<text x="28" y="201" font-size="19" fill="#172b45" font-weight="700">1번마다</text>
<rect x="151.2" y="171" width="478.6" height="24" fill="#2664ce"/>
<text x="637.8" y="190" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">79.1%</text>
<rect x="151.2" y="199" width="288.6" height="24" fill="#ae5515"/>
<text x="447.8" y="218" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">47.7%</text>
<text x="28" y="279" font-size="19" fill="#172b45" font-weight="700">4번마다</text>
<rect x="151.2" y="249" width="372.1" height="24" fill="#2664ce"/>
<text x="531.3" y="268" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">61.5%</text>
<rect x="151.2" y="277" width="209.3" height="24" fill="#ae5515"/>
<text x="368.6" y="296" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">34.6%</text>
<text x="28" y="357" font-size="19" fill="#172b45" font-weight="700">16번마다</text>
