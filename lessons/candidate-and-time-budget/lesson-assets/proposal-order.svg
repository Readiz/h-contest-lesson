<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
<title id="title">탐색 루프 한 반복의 호출 순서</title>
<desc id="desc">탐색 루프의 한 반복은 다섯 단계다. 첫째 시계를 읽을 차례인지 보고 읽으면 연산에 읽기 비용을 더하고 남은 비율로 후보 수를 다시 정한다. 둘째 제안 한 번을 센다. 셋째 후보 수가 0이면 any로 무작위 이동을 만들고 아니면 항목과 후보 순번을 뽑는다. 넷째 cand가 이동을 만들고 무효이면 다음 제안으로 간다. 다섯째 delta가 0보다 작을 때만 apply로 받는다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#53657d"/></marker></defs>
<rect x="1" y="1" width="718" height="578" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">제안 한 번에 불리는 순서</text>
<text x="28" y="84" font-size="20" fill="#53657d">탐색 루프 climbPlan의 반복 하나입니다</text>
<rect x="28" y="108" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="152" font-size="19" fill="#172b45" font-weight="700">1. 시계를 읽을 차례인가</text>
<text x="300" y="140" font-size="18" fill="#172b45">every번에 한 번 읽고 ops에 읽기 비용을 더함</text>
<text x="300" y="166" font-size="18" fill="#172b45">한도에 닿으면 끝, 아니면 k를 다시 정함</text>
<line x1="360" y1="184" x2="360" y2="202" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="28" y="202" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="246" font-size="19" fill="#172b45" font-weight="700">2. 제안 한 번을 센다</text>
<text x="300" y="234" font-size="18" fill="#172b45">++ops, ++props</text>
<text x="300" y="260" font-size="18" fill="#172b45">(무효인 이동이어도 센다)</text>
<line x1="360" y1="278" x2="360" y2="296" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="28" y="296" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="340" font-size="19" fill="#172b45" font-weight="700">3. 이동을 어디서 고르나</text>
<text x="300" y="328" font-size="18" fill="#172b45">k ≤ 0이면 any(rng, mv)</text>
<text x="300" y="354" font-size="18" fill="#172b45">아니면 item과 r을 pick으로 뽑음</text>
<line x1="360" y1="372" x2="360" y2="390" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="28" y="390" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="434" font-size="19" fill="#172b45" font-weight="700">4. 이동 만들기</text>
<text x="300" y="422" font-size="18" fill="#172b45">cand(item, r, mv)</text>
<text x="300" y="448" font-size="18" fill="#172b45">무효이면 false: 다음 제안으로</text>
<line x1="360" y1="466" x2="360" y2="484" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="28" y="484" width="664" height="76" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="44" y="528" font-size="19" fill="#172b45" font-weight="700">5. 평가하고 받기</text>
<text x="300" y="516" font-size="18" fill="#172b45">d = delta(mv)</text>
<text x="300" y="542" font-size="18" fill="#172b45">d &lt; 0일 때만 apply(mv), cost += d</text>
</svg>
