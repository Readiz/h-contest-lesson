<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 621" role="img" aria-labelledby="title desc">
<title id="title">후보 안에 든 개선량의 비율</title>
<desc id="desc">시작 상태에서 전체 근방의 최선 개선량 가운데 후보 안에서 얻는 몫입니다. 순서 틀은 후보 2, 4, 8, 16, 32개에서 90.8%, 95.5%, 99.4%, 100.0%, 100.0%이고, 배정 틀은 79.9%, 86.3%, 89.9%, 93.7%, 97.3%입니다. 배정 틀의 싼 후보 목록은 후보 수가 같아도 최선 이동을 더 자주 놓칩니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="619" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">후보 안에 든 개선량의 비율</text>
<text x="28" y="84" font-size="19" fill="#53657d">시작 상태, 전체 근방의 최선 개선량 중 후보 안에서 얻는 몫(시드</text>
<text x="28" y="109" font-size="19" fill="#53657d">합)입니다. 100%면 놓치는 개선이 없습니다</text>
<rect x="28" y="125" width="14" height="14" fill="#2664ce"/>
<text x="50" y="137" font-size="18" fill="#172b45">순서 틀</text>
<rect x="147.9" y="125" width="14" height="14" fill="#ae5515"/>
<text x="169.9" y="137" font-size="18" fill="#172b45">배정 틀</text>
<text x="28" y="201" font-size="19" fill="#172b45" font-weight="700">후보 2개</text>
<rect x="130.4" y="171" width="450" height="24" fill="#2664ce"/>
<text x="588.3" y="190" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">90.8%</text>
<rect x="130.4" y="199" width="395.9" height="24" fill="#ae5515"/>
<text x="534.3" y="218" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">79.9%</text>
<text x="28" y="279" font-size="19" fill="#172b45" font-weight="700">후보 4개</text>
<rect x="130.4" y="249" width="473.3" height="24" fill="#2664ce"/>
<text x="611.6" y="268" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">95.5%</text>
<rect x="130.4" y="277" width="427.7" height="24" fill="#ae5515"/>
<text x="566" y="296" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">86.3%</text>
<text x="28" y="357" font-size="19" fill="#172b45" font-weight="700">후보 8개</text>
<rect x="130.4" y="327" width="492.6" height="24" fill="#2664ce"/>
<text x="630.9" y="346" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">99.4%</text>
<rect x="130.4" y="355" width="445.5" height="24" fill="#ae5515"/>
<text x="583.8" y="374" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">89.9%</text>
<text x="28" y="435" font-size="19" fill="#172b45" font-weight="700">후보 16개</text>
<rect x="130.4" y="405" width="495.5" height="24" fill="#2664ce"/>
<text x="633.9" y="424" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">100.0%</text>
<rect x="130.4" y="433" width="464.3" height="24" fill="#ae5515"/>
<text x="602.7" y="452" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">93.7%</text>
<text x="28" y="513" font-size="19" fill="#172b45" font-weight="700">후보 32개</text>
<rect x="130.4" y="483" width="495.5" height="24" fill="#2664ce"/>
<text x="633.9" y="502" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">100.0%</text>
<rect x="130.4" y="511" width="482.2" height="24" fill="#ae5515"/>
<text x="620.5" y="530" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">97.3%</text>
<line x1="130.4" y1="165" x2="130.4" y2="555" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="130.4" y="577" font-size="16" fill="#53657d" text-anchor="middle">0</text>
<line x1="254.2" y1="165" x2="254.2" y2="555" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="254.2" y="577" font-size="16" fill="#53657d" text-anchor="middle">25</text>
<line x1="378.1" y1="165" x2="378.1" y2="555" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="378.1" y="577" font-size="16" fill="#53657d" text-anchor="middle">50</text>
<line x1="502" y1="165" x2="502" y2="555" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="502" y="577" font-size="16" fill="#53657d" text-anchor="middle">75</text>
<line x1="625.9" y1="165" x2="625.9" y2="555" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="625.9" y="577" font-size="16" fill="#53657d" text-anchor="middle">100</text>
<line x1="130.4" y1="165" x2="130.4" y2="555" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="605" font-size="17" fill="#53657d" text-anchor="middle">후보 안의 최선 개선량 / 전체 근방의 최선 개선량 (%)</text>
</svg>
