<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 646" role="img" aria-labelledby="title desc">
<title id="title">2차원 누적합: 네 영역 더하고 빼기</title><desc id="desc">모든 칸이 1인 4x4 격자에서 y1=1,x1=1,y2=2,x2=2인 2x2 직사각형의 합을 구합니다. prefix[3][3]=9에서 위쪽 prefix[1][3]=3과 왼쪽 prefix[3][1]=3을 빼면 왼쪽 위 한 칸이 두 번 빠지므로 prefix[1][1]=1을 더해 9-3-3+1=4가 됩니다.</desc>
