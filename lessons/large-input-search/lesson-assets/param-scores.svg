<text x="50" y="137" font-size="18" fill="#172b45">적재 수</text>
<rect x="147.9" y="125" width="14" height="14" fill="#9db6e0"/>
<text x="169.9" y="137" font-size="18" fill="#172b45">밀도 가중치</text>
<rect x="303.8" y="125" width="14" height="14" fill="#c3cddb"/>
<text x="325.8" y="137" font-size="18" fill="#172b45">순서 개선 반복</text>
<rect x="487.6" y="125" width="14" height="14" fill="#ae5515"/>
<text x="509.6" y="137" font-size="18" fill="#172b45">본문 설정</text>
