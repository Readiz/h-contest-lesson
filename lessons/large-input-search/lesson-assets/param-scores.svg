<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 713" role="img" aria-labelledby="title desc">
<title id="title">한 값씩 바꿨을 때의 점수</title>
<desc id="desc">한 번에 한 값씩 바꿔 얻은 점수입니다(나머지는 적재 20, 가중치 25, 개선 3회, 정확한 탐색). 적재 10개 10,598,486,430 (+13.9%), 적재 20개 9,306,067,620, 적재 30개 9,504,889,620 (+2.1%), 적재 50개 10,762,331,820 (+15.6%), 밀도 가중치 0 10,242,347,070 (+10.1%), 밀도 가중치 10 9,285,607,570 (-0.2%), 밀도 가중치 25 9,306,067,620, 밀도 가중치 100 9,377,977,200 (+0.8%), 순서 개선 0회 9,412,006,660 (+1.1%), 순서 개선 1회 9,317,765,440 (+0.1%), 순서 개선 3회 9,306,067,620, 순서 개선 10회 9,313,973,200 (+0.1%)입니다. 적재 10개와 50개, 가중치 0이 눈에 띄게 높고 나머지는 9.3억에서 9.5억대로 모여 있으며, 본문 설정 세 값은 같은 점수 9,306,067,620입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="711" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="189.2" y1="167" x2="189.2" y2="647" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="281.8" y1="167" x2="281.8" y2="647" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="374.4" y1="167" x2="374.4" y2="647" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="466.9" y1="167" x2="466.9" y2="647" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">한 값씩 바꿨을 때의 점수</text>
<text x="28" y="84" font-size="19" fill="#53657d">입력 1개, 점수는 결정적입니다. 주황은 본문이 쓰는 값(세 설정이 같은</text>
<text x="28" y="109" font-size="19" fill="#53657d">점수)이고, 괄호는 본문 점수 대비 차이입니다. 막대는 0에서 시작합니다</text>
