<rect x="189.2" y="173" width="196.2" height="26" fill="#2664ce"/>
<text x="393.5" y="193" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">10,598,486,430 (+13.9%)</text>
