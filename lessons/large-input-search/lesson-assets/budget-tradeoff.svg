<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">시간과 점수의 맞교환</title>
<desc id="desc">가로는 실행 시간 0초에서 14초, 세로는 점수 90억에서 160억입니다. 적재 50개 12,592,618,150에서 적재 20, 센터 선택, 순서 개선으로 9,306,067,620까지 내려갑니다. 근사 탐색 0링은 9,690,535,030으로 시간이 짧은 대신 점수가 높습니다. 칸 크기 4와 64는 점수가 거의 같고 시간만 늘어납니다. 통과 기준은 150억입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
