<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">시간과 점수의 맞교환: 탐색 정확도와 칸 크기</title>
<desc id="desc">가로는 채점기 실행 시간 2초에서 13초, 세로는 점수 92억에서 98억입니다. 본문 설정(정확한 탐색, 칸 16)은 4.7초에 9,306,067,620입니다. 근사 탐색 0링은 3.1초에 9,690,535,030, 2링은 4.0초에 9,496,733,150으로 시간은 짧지만 점수가 높습니다. 칸 크기 4, 8, 32, 64는 점수가 거의 같고 시간만 5.2초에서 11.9초로 늘어납니다. 시간 제한 10초 선이 있고 통과 기준 150억은 그림 위쪽 밖입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="558" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">시간과 점수의 맞교환</text>
<text x="28" y="84" font-size="19" fill="#53657d">점수는 낮을수록 좋음 · 통과 기준 150억은 그림 위쪽 밖</text>
<circle cx="38" cy="114" r="7" fill="#ffffff" stroke="#2664ce" stroke-width="3"/><text x="54" y="120" font-size="18" fill="#172b45">본문 설정: 정확한 탐색, 칸 16</text>
<rect x="31" y="136" width="14" height="14" fill="#ae5515"/><text x="54" y="150" font-size="18" fill="#172b45">근사 탐색: 첫 후보 뒤 0·1·2링만 더 봄</text>
<path d="M 38 160 l 8 8 l -8 8 l -8 -8 z" fill="#1d7a4c"/><text x="54" y="177" font-size="18" fill="#172b45">정확한 탐색에서 칸 한 변을 4·8·32·64로 바꿈</text>
