<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" role="img" aria-labelledby="title desc">
<title id="title">단계별 점수, 통과 기준 대비</title>
<desc id="desc">통과 기준 15,000,000,000에 대한 점수의 배수입니다. 50개씩 운행 0.84배, + 적재 20개 0.69배, + 센터 선택 밀도 0.63배, + 순서 개선 0.62배이며 1배 아래면 통과입니다. 1개씩 싣는 기준선은 7.20배라 눈금 밖이라 뺐습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="363" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="197.8" y1="139" x2="197.8" y2="299" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="305.2" y1="139" x2="305.2" y2="299" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="412.7" y1="139" x2="412.7" y2="299" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="520.2" y1="139" x2="520.2" y2="299" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="627.6" y1="139" x2="627.6" y2="299" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">단계별 점수, 통과 기준 대비</text>
<text x="28" y="84" font-size="19" fill="#53657d">입력 1개, 점수는 결정적입니다. 1배가 통과 기준이고 1개씩 싣는</text>
<text x="28" y="109" font-size="19" fill="#53657d">기준선(7.20배)은 눈금 밖이라 뺐습니다</text>
<text x="28" y="165" font-size="19" fill="#172b45">50개씩 운행</text>
<rect x="197.8" y="145" width="360.8" height="26" fill="#9db6e0"/>
<text x="566.6" y="165" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">0.84배</text>
<text x="28" y="205" font-size="19" fill="#172b45">+ 적재 20개</text>
<rect x="197.8" y="185" width="297.5" height="26" fill="#9db6e0"/>
<text x="503.3" y="205" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">0.69배</text>
<text x="28" y="245" font-size="19" fill="#172b45">+ 센터 선택 밀도</text>
<rect x="197.8" y="225" width="269.7" height="26" fill="#9db6e0"/>
<text x="475.5" y="245" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">0.63배</text>
<text x="28" y="285" font-size="19" fill="#172b45" font-weight="700">+ 순서 개선</text>
<rect x="197.8" y="265" width="266.6" height="26" fill="#ae5515"/>
<text x="472.4" y="285" font-size="17" fill="#172b45" font-weight="700" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">0.62배</text>
<text x="197.8" y="321" font-size="16" fill="#53657d" text-anchor="middle">0</text>
<text x="305.2" y="321" font-size="16" fill="#53657d" text-anchor="middle">0.2</text>
<text x="412.7" y="321" font-size="16" fill="#53657d" text-anchor="middle">0.5</text>
<text x="520.2" y="321" font-size="16" fill="#53657d" text-anchor="middle">0.8</text>
<text x="627.6" y="321" font-size="16" fill="#53657d" text-anchor="middle">1</text>
<line x1="197.8" y1="139" x2="197.8" y2="299" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="349" font-size="17" fill="#53657d" text-anchor="middle">점수 ÷ 통과 기준 ↓ (작을수록 좋음, 1배 미만이 통과)</text>
</svg>
