<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 445" role="img" aria-labelledby="title desc">
<title id="title">방법별 연산 수와 예산</title>
<desc id="desc">방법별 연산 수를 로그 눈금 막대로 비교하고 시간 제한의 절반에 해당하는 예산 5×10^9에 선을 그은 그림입니다. 센터 목록에서 고르기 5×10^6, 운행 안 순서 개선 약 10^9, 배송마다 센터 전부 10^9는 예산 안이고, 칸으로 후보 줄이기 6.4×10^9는 예산을 조금 넘지만 측정으로 가능했으며, 남은 배송 전부 훑기와 배송 쌍 거리 전부는 5×10^11로 예산의 백 배가 넘어 불가능합니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="443" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">방법별 연산 수와 예산</text>
<text x="28" y="84" font-size="19" fill="#53657d">후보 하나를 확인하는 일을 기본 연산 1회로 세고, 시간 제한의 절반인</text>
<text x="28" y="109" font-size="19" fill="#53657d">5×10^9를 상한으로 잡았습니다 (가로는 로그 눈금)</text>
<line x1="272" y1="139" x2="272" y2="379" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="272" y="401" font-size="16" fill="#53657d" text-anchor="middle">10^6</text>
<line x1="375.3" y1="139" x2="375.3" y2="379" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="375.3" y="401" font-size="16" fill="#53657d" text-anchor="middle">10^8</text>
<line x1="478.7" y1="139" x2="478.7" y2="379" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="478.7" y="401" font-size="16" fill="#53657d" text-anchor="middle">10^10</text>
<line x1="582" y1="139" x2="582" y2="379" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="582" y="401" font-size="16" fill="#53657d" text-anchor="middle">10^12</text>
<text x="28" y="165" font-size="19" fill="#172b45">센터 목록에서 고르기</text>
<rect x="272" y="145" width="36.1" height="26" fill="#2664ce"/>
<text x="594" y="165" font-size="17" fill="#172b45">5×10^6</text>
<text x="28" y="205" font-size="19" fill="#172b45">운행 안 순서 개선</text>
<rect x="272" y="185" width="155" height="26" fill="#2664ce"/>
<text x="594" y="205" font-size="17" fill="#172b45">약 10^9</text>
<text x="28" y="245" font-size="19" fill="#172b45">배송마다 센터 전부</text>
<rect x="272" y="225" width="155" height="26" fill="#2664ce"/>
<text x="594" y="245" font-size="17" fill="#172b45">10^9</text>
<text x="28" y="285" font-size="19" fill="#172b45">칸으로 후보 줄이기</text>
<rect x="272" y="265" width="196.7" height="26" fill="#e1a56f"/>
<text x="594" y="285" font-size="17" fill="#172b45">6.4×10^9</text>
<text x="28" y="325" font-size="19" fill="#172b45" font-weight="700">남은 배송 전부 훑기</text>
<rect x="272" y="305" width="294.4" height="26" fill="#ae5515"/>
<text x="594" y="325" font-size="17" fill="#172b45">5.0×10^11</text>
<text x="28" y="365" font-size="19" fill="#172b45" font-weight="700">배송 쌍 거리 전부</text>
<rect x="272" y="345" width="294.4" height="26" fill="#ae5515"/>
<text x="594" y="365" font-size="17" fill="#172b45">5×10^11</text>
<line x1="463.1" y1="135" x2="463.1" y2="379" stroke="#172b45" stroke-width="3" stroke-dasharray="8 6"/>
<text x="455.1" y="129" font-size="17" fill="#172b45" text-anchor="end" font-weight="700">예산 5×10^9</text>
<line x1="272" y1="139" x2="272" y2="379" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="429" font-size="17" fill="#53657d" text-anchor="middle">연산 수 (로그 눈금) ↓ (적을수록 좋음)</text>
</svg>
