<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">칸을 한 겹씩 넓혀 가장 가까운 배송 찾기</text>
<text x="28" y="84" font-size="19" fill="#53657d">칸 한 변 4 · 센터 (5,5)에 A 1개와 B 2개 · 회색 C는 못 실음</text>
