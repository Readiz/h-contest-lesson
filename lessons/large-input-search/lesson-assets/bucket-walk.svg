<text x="28" y="560" font-size="20" fill="#172b45" font-weight="700">첫 번째 고르기</text>
<text x="28" y="592" font-size="19" fill="#2664ce">링 0 (파랑 칸)에서 배송 1이 거리 4: 아직 끝낼 수 없음</text>
<text x="28" y="622" font-size="19" fill="#ae5515">링 1 (주황 점선 3×3칸)에서 배송 2가 거리 3: 3 ≤ (2-1)×4라 종료</text>
<text x="28" y="652" font-size="19" fill="#a02828">링 0 뒤에 4 ≤ 1×4로 끊으면 배송 1(거리 4)을 고름</text>
<text x="28" y="682" font-size="19" fill="#53657d">회색 칸의 배송 3개는 검사하지 않음 (남은 12개 중 9개 검사)</text>
<text x="28" y="712" font-size="19" fill="#53657d">좌표는 (y,x): 위가 y 0, 왼쪽이 x 0</text>
</svg>
