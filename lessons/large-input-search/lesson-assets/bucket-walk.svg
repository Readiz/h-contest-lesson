<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
<title id="title">손계산 예시: 칸을 한 겹씩 넓혀 가장 가까운 배송 찾기</title>
<desc id="desc">16×16 지도를 4×4 칸으로 나눈 그림입니다. 센터 (5,5)가 A 1개와 B 2개를 가지고 있습니다. 링 0의 칸에서 배송 1(7,7)이 거리 4로 나오지만, 링 1에서 배송 2(5,8)가 거리 3으로 나와 더 가깝습니다. 링 2 앞에서 3이 4 이하라 멈추고, 아래쪽과 오른쪽 칸의 배송 3개는 검사하지 않습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
