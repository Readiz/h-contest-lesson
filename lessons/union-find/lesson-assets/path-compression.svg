<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 672" role="img" aria-labelledby="title desc">
<title id="title">경로 압축: find(5) 전과 후</title><desc id="desc">압축 전에는 5가 4를, 4가 3을, 3이 2를, 2가 1을, 1이 0을 부모로 가리키는 한 줄 사슬이라 find(5)가 5, 4, 3, 2, 1, 0을 지납니다. 압축 후에는 1부터 5까지 모두 대표 0을 직접 가리켜 다음 find는 한 칸만 이동합니다.</desc>
<defs>
<marker id="ar-2664ce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2664ce"/></marker>
<marker id="ar-53657d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#53657d"/></marker>
<marker id="ar-ae5515" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ae5515"/></marker>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="670" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">경로 압축: find(5) 전과 후</text>
<text x="28" y="86" font-size="20" fill="#53657d" font-weight="400" text-anchor="start">화살표 = 부모를 가리킴 · 0이 대표</text>
<rect x="20" y="104" width="680" height="200" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="140" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">압축 전: parent[i] = i − 1</text>
<circle cx="70" cy="216" r="26" fill="#e5f4ef" stroke="#147d69" stroke-width="2.5"/>
<text x="70" y="224" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<circle cx="190" cy="216" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="190" y="224" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<line x1="160" y1="216" x2="102" y2="216" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
<circle cx="310" cy="216" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="310" y="224" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<line x1="280" y1="216" x2="222" y2="216" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
<circle cx="430" cy="216" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="430" y="224" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<line x1="400" y1="216" x2="342" y2="216" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
<circle cx="550" cy="216" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="550" y="224" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<line x1="520" y1="216" x2="462" y2="216" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
<circle cx="670" cy="216" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="670" y="224" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">5</text>
<line x1="640" y1="216" x2="582" y2="216" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
<text x="360" y="274" font-size="20" fill="#2664ce" font-weight="700" text-anchor="middle">find(5): 5 → 4 → 3 → 2 → 1 → 0 (5칸 이동)</text>
<rect x="20" y="320" width="680" height="260" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="356" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">압축 후: 지나간 원소가 대표 0을 직접 가리킴</text>
<circle cx="360" cy="400" r="26" fill="#e5f4ef" stroke="#147d69" stroke-width="2.5"/>
<text x="360" y="408" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<line x1="100" y1="472" x2="308.0" y2="430" stroke="#53657d" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-53657d)"/>
<circle cx="100" cy="500" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="100" y="508" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<line x1="230" y1="472" x2="334.0" y2="430" stroke="#ae5515" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-ae5515)"/>
<circle cx="230" cy="500" r="26" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.5"/>
<text x="230" y="508" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<line x1="360" y1="472" x2="360" y2="430" stroke="#ae5515" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-ae5515)"/>
<circle cx="360" cy="500" r="26" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.5"/>
<text x="360" y="508" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<line x1="490" y1="472" x2="386.0" y2="430" stroke="#ae5515" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-ae5515)"/>
<circle cx="490" cy="500" r="26" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.5"/>
<text x="490" y="508" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<line x1="620" y1="472" x2="412.0" y2="430" stroke="#ae5515" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-ae5515)"/>
<circle cx="620" cy="500" r="26" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.5"/>
<text x="620" y="508" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">5</text>
<text x="360" y="562" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">parent[1..5] = 0 · 주황 = 이번에 바뀐 부모</text>
<rect x="28" y="596" width="664" height="54" rx="12" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="360" y="630" font-size="20" fill="#147d69" font-weight="750" text-anchor="middle">다음 find(5)는 5 → 0, 한 칸만 이동</text>
</svg>
