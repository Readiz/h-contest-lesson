<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" role="img" aria-labelledby="title desc">
<title id="title">Union-Find: find로 대표를 비교하고 union으로 잇기</title><desc id="desc">숲 0←1←3, 2←4, 5에서 find(3)은 0이고 find(4)는 2라 서로 다른 집합입니다. union(3,4)는 두 대표 0과 2를 찾아 크기가 작은 2를 0 밑으로 붙이고, 그 뒤에는 0,1,2,3,4가 한 집합이며 5는 혼자 남습니다.</desc>
<defs>
<marker id="ar-53657d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#53657d"/></marker>
<marker id="ar-ae5515" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ae5515"/></marker>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="728" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">Union-Find: find로 대표를 비교하고 union으로 잇기</text>
<text x="28" y="86" font-size="21" fill="#53657d" font-weight="400" text-anchor="start">화살표 = 부모를 가리킴 · 맨 위 = 대표</text>
<rect x="20" y="104" width="680" height="290" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="140" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">① union 전: 대표 비교</text>
<circle cx="90" cy="190" r="26" fill="#e5f4ef" stroke="#147d69" stroke-width="2.5"/>
<text x="90" y="198" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<line x1="90" y1="238" x2="90" y2="220" stroke="#53657d" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-53657d)"/>
<circle cx="90" cy="266" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="90" y="274" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<line x1="90" y1="314" x2="90" y2="296" stroke="#53657d" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-53657d)"/>
<circle cx="90" cy="342" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="90" y="350" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<circle cx="230" cy="190" r="26" fill="#e5f4ef" stroke="#147d69" stroke-width="2.5"/>
<text x="230" y="198" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<line x1="230" y1="238" x2="230" y2="220" stroke="#53657d" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-53657d)"/>
<circle cx="230" cy="266" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="230" y="274" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<circle cx="360" cy="190" r="26" fill="#e5f4ef" stroke="#147d69" stroke-width="2.5"/>
<text x="360" y="198" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">5</text>
<text x="450" y="200" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">find(3) = 0</text>
<text x="450" y="236" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">find(4) = 2</text>
<text x="450" y="280" font-size="22" fill="#ae5515" font-weight="750" text-anchor="start">0 ≠ 2</text>
<text x="450" y="314" font-size="21" fill="#ae5515" font-weight="700" text-anchor="start">다른 집합</text>
<rect x="20" y="410" width="680" height="300" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="446" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">② union(3, 4): 대표 2를 0 밑으로</text>
<circle cx="170" cy="500" r="26" fill="#e5f4ef" stroke="#147d69" stroke-width="2.5"/>
<text x="170" y="508" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<line x1="90" y1="548" x2="170" y2="530" stroke="#53657d" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-53657d)"/>
<circle cx="90" cy="576" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="90" y="584" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<line x1="90" y1="624" x2="90" y2="606" stroke="#53657d" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-53657d)"/>
<circle cx="90" cy="652" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="90" y="660" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<line x1="250" y1="548" x2="170" y2="530" stroke="#ae5515" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-ae5515)"/>
<circle cx="250" cy="576" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="250" y="584" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<line x1="250" y1="624" x2="250" y2="606" stroke="#53657d" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-53657d)"/>
<circle cx="250" cy="652" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="250" y="660" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<circle cx="360" cy="500" r="26" fill="#e5f4ef" stroke="#147d69" stroke-width="2.5"/>
<text x="360" y="508" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">5</text>
<text x="450" y="520" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">크기 3 ≥ 2</text>
<text x="450" y="556" font-size="21" fill="#ae5515" font-weight="700" text-anchor="start">작은 2를 큰 0 밑으로</text>
<text x="450" y="600" font-size="21" fill="#147d69" font-weight="750" text-anchor="start">0, 1, 2, 3, 4</text>
<text x="450" y="634" font-size="21" fill="#147d69" font-weight="700" text-anchor="start">한 집합 · 5는 혼자</text>
</svg>
