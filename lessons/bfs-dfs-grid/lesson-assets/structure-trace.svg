<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">BFS: 같은 정점을 두 번 넣지 않기</title><desc id="desc">0에서1과2로 가고 둘 다3으로 연결됩니다. 1이3을 큐에 넣으며 방문 표시하므로2는3을 다시 넣지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="610" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">BFS: 같은 정점을 두 번 넣지 않기</text><text x="24" y="90" font-size="24" fill="#18324f">모든 간선 비용 1 / 이웃은 번호순으로 처리</text><circle cx="70" cy="200" r="27" fill="#fde68a" stroke="#607b98"/><text x="70" y="208" text-anchor="middle" font-size="24">0</text><circle cx="275" cy="130" r="27" fill="#dbeafe" stroke="#607b98"/><text x="275" y="138" text-anchor="middle" font-size="24">1</text><circle cx="275" cy="270" r="27" fill="#dbeafe" stroke="#607b98"/><text x="275" y="278" text-anchor="middle" font-size="24">2</text><circle cx="505" cy="200" r="27" fill="#d1fae5" stroke="#607b98"/><text x="505" y="208" text-anchor="middle" font-size="24">3</text><path d="M98 190 L244 140" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M98 210 L244 260" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M303 140 L477 190" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M303 260 L477 210" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="340" width="550" height="52" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="374.0" font-size="24" fill="#18324f">0 처리 → 큐 [1, 2], 거리 1</text><rect x="24" y="409" width="550" height="52" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="443.0" font-size="24" fill="#18324f">1 처리 → 큐 [2, 3], dist[3]=2</text><rect x="24" y="478" width="550" height="52" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="512.0" font-size="22" fill="#18324f">2 처리 → 3은 이미 발견, 추가하지 않음</text><text x="24" y="573" font-size="23" fill="#18324f">방문 표시는 꺼낼 때가 아니라 넣을 때</text></svg>
