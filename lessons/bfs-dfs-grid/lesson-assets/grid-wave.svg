<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556" role="img" aria-labelledby="title desc">
<title id="title">격자 BFS: 거리 0, 1, 2…로 퍼짐</title><desc id="desc">4행 5열 격자에서 (0,0)에서 시작해 상하좌우로 이동합니다. 벽을 피해 각 칸의 거리가 0부터 7까지 층으로 퍼지며 목표 (3,4)의 거리는 7입니다. 큐에는 거리 0, 1, 2 순서대로 칸이 들어갑니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="554" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">격자 BFS: 거리 0, 1, 2…로 퍼짐</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">칸의 숫자 = 처음 큐에 넣을 때 확정된 거리 · # = 벽</text>
<rect x="20" y="104" width="680" height="362" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="38" y="150" width="52" height="52" rx="6" fill="#e9f0ff" stroke="#ae5515" stroke-width="4"/>
<text x="64.0" y="184.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<rect x="94" y="150" width="52" height="52" rx="6" fill="#dce7fc" stroke="#2664ce" stroke-width="2"/>
<text x="120.0" y="184.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<rect x="150" y="150" width="52" height="52" rx="6" fill="#cfdefa" stroke="#2664ce" stroke-width="2"/>
<text x="176.0" y="184.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<rect x="206" y="150" width="52" height="52" rx="6" fill="#53657d" stroke="#53657d" stroke-width="1"/>
<text x="232.0" y="184.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">#</text>
<rect x="262" y="150" width="52" height="52" rx="6" fill="#9bbcf2" stroke="#2664ce" stroke-width="2"/>
<text x="288.0" y="184.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">6</text>
<rect x="38" y="206" width="52" height="52" rx="6" fill="#dce7fc" stroke="#2664ce" stroke-width="2"/>
<text x="64.0" y="240.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<rect x="94" y="206" width="52" height="52" rx="6" fill="#53657d" stroke="#53657d" stroke-width="1"/>
<text x="120.0" y="240.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">#</text>
<rect x="150" y="206" width="52" height="52" rx="6" fill="#c2d6f8" stroke="#2664ce" stroke-width="2"/>
<text x="176.0" y="240.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<rect x="206" y="206" width="52" height="52" rx="6" fill="#b5cdf6" stroke="#2664ce" stroke-width="2"/>
<text x="232.0" y="240.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<rect x="262" y="206" width="52" height="52" rx="6" fill="#a8c5f4" stroke="#2664ce" stroke-width="2"/>
<text x="288.0" y="240.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">5</text>
<rect x="38" y="262" width="52" height="52" rx="6" fill="#cfdefa" stroke="#2664ce" stroke-width="2"/>
<text x="64.0" y="296.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<rect x="94" y="262" width="52" height="52" rx="6" fill="#53657d" stroke="#53657d" stroke-width="1"/>
<text x="120.0" y="296.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">#</text>
<rect x="150" y="262" width="52" height="52" rx="6" fill="#b5cdf6" stroke="#2664ce" stroke-width="2"/>
<text x="176.0" y="296.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<rect x="206" y="262" width="52" height="52" rx="6" fill="#53657d" stroke="#53657d" stroke-width="1"/>
<text x="232.0" y="296.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">#</text>
<rect x="262" y="262" width="52" height="52" rx="6" fill="#9bbcf2" stroke="#2664ce" stroke-width="2"/>
<text x="288.0" y="296.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">6</text>
<rect x="38" y="318" width="52" height="52" rx="6" fill="#c2d6f8" stroke="#2664ce" stroke-width="2"/>
<text x="64.0" y="352.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<rect x="94" y="318" width="52" height="52" rx="6" fill="#b5cdf6" stroke="#2664ce" stroke-width="2"/>
<text x="120.0" y="352.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<rect x="150" y="318" width="52" height="52" rx="6" fill="#a8c5f4" stroke="#2664ce" stroke-width="2"/>
<text x="176.0" y="352.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">5</text>
<rect x="206" y="318" width="52" height="52" rx="6" fill="#53657d" stroke="#53657d" stroke-width="1"/>
<text x="232.0" y="352.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">#</text>
<rect x="262" y="318" width="52" height="52" rx="6" fill="#8fb4f0" stroke="#147d69" stroke-width="4"/>
<text x="288.0" y="352.0" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">7</text>
<text x="36" y="134" font-size="18" fill="#53657d" font-weight="400" text-anchor="start">시작 (0,0) 주황 · 목표 (3,4) 초록</text>
<text x="36" y="402" font-size="20" fill="#53657d" font-weight="400" text-anchor="start">좌표는 (행, 열)</text>
<text x="340" y="146" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">큐에 들어간 순서 (거리 층)</text>
<rect x="340" y="170" width="44" height="28" rx="7" fill="#e9f0ff" stroke="#2664ce" stroke-width="1.5"/>
<text x="362" y="191" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<text x="398" y="191" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">(0,0)</text>
<rect x="340" y="206" width="44" height="28" rx="7" fill="#dce7fc" stroke="#2664ce" stroke-width="1.5"/>
<text x="362" y="227" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<text x="398" y="227" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">(1,0) (0,1)</text>
<rect x="340" y="242" width="44" height="28" rx="7" fill="#cfdefa" stroke="#2664ce" stroke-width="1.5"/>
<text x="362" y="263" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<text x="398" y="263" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">(2,0) (0,2)</text>
<rect x="340" y="278" width="44" height="28" rx="7" fill="#c2d6f8" stroke="#2664ce" stroke-width="1.5"/>
<text x="362" y="299" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<text x="398" y="299" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">(3,0) (1,2)</text>
<rect x="340" y="314" width="44" height="28" rx="7" fill="#b5cdf6" stroke="#2664ce" stroke-width="1.5"/>
<text x="362" y="335" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<text x="398" y="335" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">(3,1) (2,2) (1,3)</text>
<rect x="340" y="350" width="44" height="28" rx="7" fill="#a8c5f4" stroke="#2664ce" stroke-width="1.5"/>
<text x="362" y="371" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">5</text>
<text x="398" y="371" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">(3,2) (1,4)</text>
<rect x="340" y="386" width="44" height="28" rx="7" fill="#9bbcf2" stroke="#2664ce" stroke-width="1.5"/>
<text x="362" y="407" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">6</text>
<text x="398" y="407" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">(0,4) (2,4)</text>
<rect x="340" y="422" width="44" height="28" rx="7" fill="#8fb4f0" stroke="#2664ce" stroke-width="1.5"/>
<text x="362" y="443" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">7</text>
<text x="398" y="443" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">(3,4)</text>
<rect x="28" y="482" width="664" height="54" rx="12" fill="#eef2f7" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="360" y="516" font-size="21" fill="#53657d" font-weight="600" text-anchor="middle">같은 거리 칸이 모두 나간 뒤에 다음 거리 칸이 나옴</text>
</svg>
