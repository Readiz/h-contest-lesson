<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 497" role="img" aria-labelledby="title desc">
<title id="title">시작 온도별 합의 분포</title>
<desc id="desc">시작 온도를 바꿨을 때 solver seed 9개의 6개 TC 합을 점으로, 중앙값을 세로 눈금으로 보인 그림입니다. 중앙값은 0 (나쁜 이동 거절) 239,031, 중앙 손해의 0.03배 235,605, 중앙 손해의 0.1배 235,248, 중앙 손해의 0.3배 235,291, 중앙 손해의 1배 237,510, 중앙 손해의 3배 242,215입니다. 0.03배에서 0.3배까지는 235,000대로 겹치고 1배 이상에서 나빠집니다.</desc>
