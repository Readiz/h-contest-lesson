<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 651" role="img" aria-labelledby="title desc">
<title id="title">배정 한 줄에서 점수까지</title>
<desc id="desc">작업 6개를 기계 3개에 배정한 예입니다. 상태는 작업마다 기계 번호를 적은 배열 assignment이고, 기계별 부하는 배정된 작업 시간의 합으로 기계 0 12, 기계 1 7, 기계 2 6입니다. 점수는 부하의 최댓값 12이며 낮을수록 좋습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="649" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">배정 한 줄에서 점수까지</text>
<text x="28" y="84" font-size="19" fill="#53657d">상태는 assignment[] 하나뿐이고, 부하와 최댓값은 거기서 다시</text>
<text x="28" y="109" font-size="19" fill="#53657d">계산되는 보조 값입니다 (예시 숫자)</text>
<text x="28" y="139" font-size="19" fill="#172b45" font-weight="700">상태 assignment[j] (제출하는 값)</text>
<rect x="28" y="153" width="98" height="62" fill="#dbe6f7"/>
<text x="77" y="177" font-size="17" fill="#53657d" text-anchor="middle">작업 0</text>
<text x="77" y="203" font-size="19" fill="#172b45" text-anchor="middle" font-weight="700">기계 0</text>
<rect x="130" y="153" width="98" height="62" fill="#dbe6f7"/>
<text x="179" y="177" font-size="17" fill="#53657d" text-anchor="middle">작업 1</text>
<text x="179" y="203" font-size="19" fill="#172b45" text-anchor="middle" font-weight="700">기계 1</text>
<rect x="232" y="153" width="98" height="62" fill="#dbe6f7"/>
<text x="281" y="177" font-size="17" fill="#53657d" text-anchor="middle">작업 2</text>
<text x="281" y="203" font-size="19" fill="#172b45" text-anchor="middle" font-weight="700">기계 0</text>
<rect x="334" y="153" width="98" height="62" fill="#dbe6f7"/>
<text x="383" y="177" font-size="17" fill="#53657d" text-anchor="middle">작업 3</text>
<text x="383" y="203" font-size="19" fill="#172b45" text-anchor="middle" font-weight="700">기계 2</text>
<rect x="436" y="153" width="98" height="62" fill="#dbe6f7"/>
<text x="485" y="177" font-size="17" fill="#53657d" text-anchor="middle">작업 4</text>
<text x="485" y="203" font-size="19" fill="#172b45" text-anchor="middle" font-weight="700">기계 1</text>
<rect x="538" y="153" width="98" height="62" fill="#dbe6f7"/>
<text x="587" y="177" font-size="17" fill="#53657d" text-anchor="middle">작업 5</text>
<text x="587" y="203" font-size="19" fill="#172b45" text-anchor="middle" font-weight="700">기계 0</text>
<text x="28" y="255" font-size="19" fill="#172b45" font-weight="700">보조 값 load[k] (작업 시간을 기계별로 쌓은 부하)</text>
<rect x="150" y="505" width="110" height="102" fill="#e1a56f"/>
<text x="205" y="562" font-size="17" fill="#172b45" text-anchor="middle">작업 0: 4</text>
<rect x="330" y="531" width="110" height="76" fill="#9db6e0"/>
<text x="385" y="575" font-size="17" fill="#172b45" text-anchor="middle">작업 1: 3</text>
<rect x="150" y="375" width="110" height="128" fill="#e1a56f"/>
<text x="205" y="445" font-size="17" fill="#172b45" text-anchor="middle">작업 2: 5</text>
<rect x="510" y="453" width="110" height="154" fill="#9db6e0"/>
<text x="565" y="536" font-size="17" fill="#172b45" text-anchor="middle">작업 3: 6</text>
<rect x="330" y="427" width="110" height="102" fill="#9db6e0"/>
<text x="385" y="484" font-size="17" fill="#172b45" text-anchor="middle">작업 4: 4</text>
<rect x="150" y="297" width="110" height="76" fill="#e1a56f"/>
<text x="205" y="341" font-size="17" fill="#172b45" text-anchor="middle">작업 5: 3</text>
<line x1="40" y1="607" x2="690" y2="607" stroke="#53657d" stroke-width="1.5"/>
<text x="205" y="631" font-size="18" fill="#ae5515" text-anchor="middle" font-weight="700">기계 0: 12</text>
<text x="385" y="631" font-size="18" fill="#172b45" text-anchor="middle">기계 1: 7</text>
<text x="565" y="631" font-size="18" fill="#172b45" text-anchor="middle">기계 2: 6</text>
<line x1="40" y1="295" x2="690" y2="295" stroke="#ae5515" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="40" y="287" font-size="18" fill="#ae5515" font-weight="700" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">점수 = 가장 높은 부하 = 12 (작을수록 좋음)</text>
</svg>
