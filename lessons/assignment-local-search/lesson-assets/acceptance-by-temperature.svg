<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 702" role="img" aria-labelledby="title desc">
<title id="title">온도 구간별 나쁜 이동 수락률</title><desc id="desc">SCHEDULX 6개 TC에서 시작 온도를 중앙 손해의 0.03, 0.1, 0.3, 1, 3배로 둔 SA의 나쁜 이동 수락률입니다. 세로 눈금은 제곱근 척도이며 solver seed 9개의 중앙값입니다. 시작 온도가 높을수록 수락률이 높고 모든 설정에서 구간 5에는 낮아집니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
