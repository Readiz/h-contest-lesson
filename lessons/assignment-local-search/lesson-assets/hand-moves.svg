<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 938" role="img" aria-labelledby="title desc">
<title id="title">손계산 예시: 한 번 나빠진 뒤 좋아지는 이동열</title><desc id="desc">작업 5개와 기계 2개의 예시입니다. 시작 상태는 두 기계의 부하가 14와 14로 모든 이웃이 더 나쁩니다. 작업 2를 기계 0으로 옮겨 최대 부하 15로 1 늘린 뒤 작업 0과 4를 교환하면 12, 작업 1을 기계 0으로 옮기면 9가 됩니다.</desc>
