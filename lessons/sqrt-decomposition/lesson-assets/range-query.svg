<text x="608" y="324" font-size="20" fill="#172b45" font-weight="600" text-anchor="middle">9 + 2 = 11</text>
<text x="36" y="392" font-size="20" fill="#53657d" font-weight="500" text-anchor="start">블록 1의 네 원소는 4+6+3+8 = 21 한 번으로 처리</text>
<rect x="28" y="424" width="664" height="86" rx="12" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="360" y="458" font-size="24" fill="#147d69" font-weight="750" text-anchor="middle">8 + 21 + 11 = 40</text>
<text x="360" y="492" font-size="20" fill="#147d69" font-weight="600" text-anchor="middle">직접 본 원소는 양 끝 4개뿐</text>
</svg>
