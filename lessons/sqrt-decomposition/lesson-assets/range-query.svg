<line x1="667" y1="262" x2="667" y2="248" stroke="#ae5515" stroke-width="3" stroke-linecap="round"/>
<text x="205.0" y="296" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">직접</text>
<text x="205.0" y="324" font-size="20" fill="#172b45" font-weight="600" text-anchor="middle">7 + 1 = 8</text>
<text x="422" y="296" font-size="20" fill="#147d69" font-weight="700" text-anchor="middle">블록 합 사용</text>
<text x="422" y="324" font-size="22" fill="#172b45" font-weight="750" text-anchor="middle">21</text>
