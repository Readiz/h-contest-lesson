<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 554" role="img" aria-labelledby="title desc">
<title id="title">구간 [2, 9] 질의: 양 끝만 직접 읽기</title><desc id="desc">같은 배열에서 [2,9]를 물으면 위치 2와 3의 7과 1은 직접 더하고, 블록 1(4부터 7)은 저장된 합 21을 쓰고, 위치 8과 9의 9와 2는 직접 더해 7+1+21+9+2=40입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="552" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">구간 [2, 9] 질의: 양 끝만 직접 읽기</text>
<text x="28" y="86" font-size="21" fill="#53657d" font-weight="400" text-anchor="start">B = 4 · 질의 [2, 9] · 원소 4개 + 블록 합 1개</text>
