<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 498" role="img" aria-labelledby="title desc">
<title id="title">Sqrt Decomposition: 길이 4 블록과 블록 합</title><desc id="desc">배열 5 2 7 1 4 6 3 8 9 2를 B=4로 나눈 블록 0(위치 0부터 3), 블록 1(4부터 7), 블록 2(8부터 9)입니다. 각 블록은 합 15, 21, 11을 따로 저장하고 원본 배열은 그대로 둡니다.</desc>
