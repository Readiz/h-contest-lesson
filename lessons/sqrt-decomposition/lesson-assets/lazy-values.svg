<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 625" role="img" aria-labelledby="title desc"><title id="title">블록 lazy: 저장값과 실제 값</title><desc id="desc">구간2부터7에3을 더하면 a의2와3만3이 됩니다. 블록1의 lazy가3이므로4부터7의 실제 값도3입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="625" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="27" fill="#18324f">블록 lazy: 저장값과 실제 값</text><text x="24" y="91" font-size="23" fill="#18324f">B=4 / 초기 배열 0 / add(2,7,+3)</text><text x="24" y="153" font-size="24" fill="#18324f">저장 a</text><rect x="24" y="178" width="62" height="52" rx="9" fill="#fff" stroke="#91a4b9"/><text x="36" y="212.0" font-size="24" fill="#18324f">0</text><rect x="93" y="178" width="62" height="52" rx="9" fill="#fff" stroke="#91a4b9"/><text x="105" y="212.0" font-size="24" fill="#18324f">0</text><rect x="162" y="178" width="62" height="52" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="174" y="212.0" font-size="24" fill="#18324f">3</text><rect x="231" y="178" width="62" height="52" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="243" y="212.0" font-size="24" fill="#18324f">3</text><rect x="300" y="178" width="62" height="52" rx="9" fill="#fff" stroke="#91a4b9"/><text x="312" y="212.0" font-size="24" fill="#18324f">0</text><rect x="369" y="178" width="62" height="52" rx="9" fill="#fff" stroke="#91a4b9"/><text x="381" y="212.0" font-size="24" fill="#18324f">0</text><rect x="438" y="178" width="62" height="52" rx="9" fill="#fff" stroke="#91a4b9"/><text x="450" y="212.0" font-size="24" fill="#18324f">0</text><rect x="507" y="178" width="62" height="52" rx="9" fill="#fff" stroke="#91a4b9"/><text x="519" y="212.0" font-size="24" fill="#18324f">0</text><text x="36" y="265" font-size="22" fill="#18324f">블록 0: lazy=0</text><text x="314" y="265" font-size="22" fill="#18324f">블록 1: lazy=3</text><text x="24" y="338" font-size="24" fill="#18324f">실제 값</text><rect x="24" y="363" width="62" height="52" rx="9" fill="#fff" stroke="#91a4b9"/><text x="36" y="397.0" font-size="24" fill="#18324f">0</text><rect x="93" y="363" width="62" height="52" rx="9" fill="#fff" stroke="#91a4b9"/><text x="105" y="397.0" font-size="24" fill="#18324f">0</text><rect x="162" y="363" width="62" height="52" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="174" y="397.0" font-size="24" fill="#18324f">3</text><rect x="231" y="363" width="62" height="52" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="243" y="397.0" font-size="24" fill="#18324f">3</text><rect x="300" y="363" width="62" height="52" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="312" y="397.0" font-size="24" fill="#18324f">3</text><rect x="369" y="363" width="62" height="52" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="381" y="397.0" font-size="24" fill="#18324f">3</text><rect x="438" y="363" width="62" height="52" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="450" y="397.0" font-size="24" fill="#18324f">3</text><rect x="507" y="363" width="62" height="52" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="519" y="397.0" font-size="24" fill="#18324f">3</text><text x="36" y="450" font-size="22" fill="#18324f">블록 0: lazy=0</text><text x="314" y="450" font-size="22" fill="#18324f">블록 1: lazy=3</text><text x="24" y="508" font-size="23" fill="#18324f">부분 블록: a[2], a[3]에 직접 +3</text><text x="24" y="551" font-size="23" fill="#18324f">전체 블록: a는 그대로, lazy에만 +3</text><text x="24" y="594" font-size="23" fill="#18324f">get(5) = a[5] + lazy[1] = 0 + 3</text></svg>
