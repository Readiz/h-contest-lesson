<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">블록 lazy: 저장값과 실제 값</title><desc id="desc">구간 2부터 7에 3을 더하면 a의 2와 3만 3이 됩니다. 블록 1의 lazy가 3이므로 4부터 7의 실제 값도 3입니다.</desc>
