<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 706" role="img" aria-labelledby="title desc">
<title id="title">2-opt: 교차하는 두 간선을 바꾸고 가운데를 뒤집기</title><desc id="desc">경로 a-b ... c-d에서 a, b, c, d를 좌표 (0,0), (4,2), (0,2), (4,0)에 두면 간선 a-b와 c-d는 교차하고 합이 약 4.5+4.5=9입니다. a-c, b-d로 바꾸고 가운데 b에서 c 구간을 뒤집으면 교차가 사라져 합이 2+2=4가 됩니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="704" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#b42318"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">2-opt: 교차하는 두 간선을 바꾸고 가운데를 뒤집기</text>
<text x="28" y="86" font-size="21" fill="#53657d" font-weight="400" text-anchor="start">점 a(0,0) b(4,2) c(0,2) d(4,0) · 길이는 직선 거리</text>
<rect x="20" y="104" width="680" height="246" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="140" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">바꾸기 전</text>
<line x1="300" y1="184" x2="60" y2="184" stroke="#9fb0c6" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/>
<line x1="60" y1="304" x2="300" y2="184" stroke="#b42318" stroke-width="5" stroke-linecap="round"/>
<line x1="60" y1="184" x2="300" y2="304" stroke="#b42318" stroke-width="5" stroke-linecap="round"/>
<circle cx="60" cy="304" r="20" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="60" y="311" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">a</text>
<circle cx="300" cy="184" r="20" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="300" y="191" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">b</text>
<circle cx="60" cy="184" r="20" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="60" y="191" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">c</text>
<circle cx="300" cy="304" r="20" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="300" y="311" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">d</text>
<text x="330" y="194" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">a–b, c–d 사용</text>
<text x="330" y="230" font-size="20" fill="#b42318" font-weight="700" text-anchor="start">≈ 4.5 + 4.5 = 9</text>
<text x="330" y="274" font-size="20" fill="#53657d" font-weight="500" text-anchor="start">두 간선이 교차</text>
<rect x="20" y="366" width="680" height="246" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="402" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">바꾼 뒤</text>
<line x1="300" y1="446" x2="60" y2="446" stroke="#9fb0c6" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/>
<line x1="60" y1="566" x2="60" y2="446" stroke="#147d69" stroke-width="5" stroke-linecap="round"/>
<line x1="300" y1="446" x2="300" y2="566" stroke="#147d69" stroke-width="5" stroke-linecap="round"/>
<circle cx="60" cy="566" r="20" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="60" y="573" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">a</text>
<circle cx="300" cy="446" r="20" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="300" y="453" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">b</text>
<circle cx="60" cy="446" r="20" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="60" y="453" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">c</text>
<circle cx="300" cy="566" r="20" fill="#fff" stroke="#2664ce" stroke-width="3"/>
<text x="300" y="573" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">d</text>
<text x="330" y="456" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">a–c, b–d 사용</text>
<text x="330" y="492" font-size="20" fill="#147d69" font-weight="700" text-anchor="start">2 + 2 = 4</text>
<text x="330" y="536" font-size="20" fill="#53657d" font-weight="500" text-anchor="start">b … c 구간은 뒤집힘</text>
<rect x="28" y="632" width="664" height="54" rx="12" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="360" y="666" font-size="21" fill="#147d69" font-weight="750" text-anchor="middle">after &lt; before 이면 reverse(b … c)를 반영</text>
</svg>
