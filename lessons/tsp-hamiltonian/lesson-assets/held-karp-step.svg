<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" role="img" aria-labelledby="title desc">
<title id="title">Held-Karp: mask 한 칸 전이</title><desc id="desc">mask 7은 정점 0,1,2를 방문한 상태이고 last는 2입니다. next 3을 고르면 비트 3이 켜져 mask 15가 되고 last는 3이 됩니다. 값은 dp[15][3]과 dp[7][2]+cost[2][3] 중 작은 쪽입니다.</desc>
<defs>
<marker id="ar-ae5515" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ae5515"/></marker>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="446" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">Held-Karp: mask 한 칸 전이</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">정점 2에서 정점 3으로 가는 한 번의 전이</text>
<rect x="20" y="104" width="680" height="194" rx="10" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="138" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">비트 = 정점 번호</text>
<text x="68" y="176" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">3</text>
