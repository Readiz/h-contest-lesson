<text x="66" y="220" font-size="24" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<text x="124" y="176" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">2</text>
<rect x="96" y="184" width="52" height="52" rx="8" fill="#e9f0ff" stroke="#2664ce" stroke-width="2"/>
<text x="122" y="220" font-size="24" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
