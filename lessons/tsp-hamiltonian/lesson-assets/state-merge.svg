<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">두 방문 순서가 같은 상태로 합쳐짐</title><desc id="desc">0에서 출발하는 두 경로 0,1,3,2와 0,3,1,2는 모두 정점 0,1,2,3을 방문했고 마지막 정점이 2입니다. 비트마스크로는 mask 1111과 last 2인 같은 상태이므로 최소 비용 하나만 남깁니다.</desc>
