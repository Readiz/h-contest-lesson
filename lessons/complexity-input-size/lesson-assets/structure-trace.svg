<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">입력 2배가 연산 2배는 아닙니다</title><desc id="desc">입력이 두 배면 n은2배, n제곱은4배, n세제곱은8배입니다. n log2 n은1024에서2048로 늘 때2.2배입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="590" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">입력 2배가 연산 2배는 아닙니다</text><text x="24" y="90" font-size="24" fill="#18324f">입력 n을 2배로 키웠을 때의 증가량</text><text x="24" y="130" font-size="26" fill="#18324f">n</text><rect x="85" y="102" width="120" height="44" rx="6" fill="#b8d8fb"/><text x="95" y="130" font-size="24" fill="#18324f">2배</text><text x="24" y="220" font-size="26" fill="#18324f">n²</text><rect x="85" y="192" width="240" height="44" rx="6" fill="#b8d8fb"/><text x="95" y="220" font-size="24" fill="#18324f">4배</text><text x="24" y="310" font-size="26" fill="#18324f">n³</text><rect x="85" y="282" width="480" height="44" rx="6" fill="#b8d8fb"/><text x="95" y="310" font-size="24" fill="#18324f">8배</text><rect x="24" y="370" width="550" height="65" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="410.5" font-size="23" fill="#18324f">n log₂n: n=1024 → 2048이면 2.2배</text><text x="24" y="485" font-size="23" fill="#18324f">막대는 실행 시간이 아닌 식의 증가 비율</text><text x="24" y="530" font-size="22" fill="#18324f">상수·연산 종류·전체 TC 크기도 함께 봅니다.</text></svg>
