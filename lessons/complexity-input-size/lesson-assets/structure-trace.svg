<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" aria-labelledby="title desc">
<title id="title">입력 2배가 연산 2배는 아닙니다</title><desc id="desc">입력이 두 배면 n은 2배, n제곱은 4배, n세제곱은 8배입니다. n log2 n은 1024에서 2048로 늘 때 2.2배입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="608" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">입력 2배가 연산 2배는 아닙니다</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">입력 n을 2배로 키웠을 때의 증가량</text>
<rect x="28" y="108" width="664" height="330" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="48" y="169" font-size="22" fill="#172b45" font-weight="700">n</text>
<rect x="170" y="138" width="120" height="46" rx="8" fill="#b8d8fb"/>
<text x="182" y="169" font-size="20" fill="#172b45" font-weight="700">2배</text>
<text x="48" y="241" font-size="22" fill="#172b45" font-weight="700">n log₂n</text>
<rect x="170" y="210" width="132" height="46" rx="8" fill="#fef3c7" stroke="#9fb0c6" stroke-width="1.5"/>
<text x="182" y="241" font-size="20" fill="#172b45" font-weight="700">2.2배</text>
<text x="48" y="313" font-size="22" fill="#172b45" font-weight="700">n²</text>
<rect x="170" y="282" width="240" height="46" rx="8" fill="#b8d8fb"/>
<text x="182" y="313" font-size="20" fill="#172b45" font-weight="700">4배</text>
<text x="48" y="385" font-size="22" fill="#172b45" font-weight="700">n³</text>
<rect x="170" y="354" width="480" height="46" rx="8" fill="#b8d8fb"/>
<text x="182" y="385" font-size="20" fill="#172b45" font-weight="700">8배</text>
<rect x="28" y="458" width="664" height="54" rx="10" fill="#fef3c7" stroke="#9fb0c6" stroke-width="1.5"/>
<text x="46" y="492" font-size="20" fill="#172b45" font-weight="700">n log₂n: n=1024 → 2048이면 2.2배</text>
<circle cx="40" cy="550.0" r="4" fill="#2664ce"/>
<text x="56" y="556" font-size="20" fill="#172b45">막대는 실행 시간이 아닌 식의 증가 비율</text>
<circle cx="40" cy="588.0" r="4" fill="#2664ce"/>
<text x="56" y="594" font-size="20" fill="#172b45">상수·연산 종류·전체 TC 크기도 함께 봅니다.</text>
</svg>
