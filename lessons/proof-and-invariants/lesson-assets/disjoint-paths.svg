<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">경로 수를 더해도 중복되지 않는 이유</title><desc id="desc">3행3열 격자의 도착 경로6개는 위칸에서 내려온3개와 왼쪽칸에서 온3개로 겹치지 않게 나뉩니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="600" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="27" fill="#18324f">경로 수를 더해도 중복되지 않는 이유</text><text x="24" y="90" font-size="22" fill="#18324f">장애물 없는 3×3 격자 / 오른쪽·아래 이동</text><rect x="110" y="125" width="100" height="66" rx="9" fill="#fff" stroke="#91a4b9"/><text x="122" y="166.0" font-size="26" fill="#18324f">1</text><rect x="250" y="125" width="100" height="66" rx="9" fill="#fff" stroke="#91a4b9"/><text x="262" y="166.0" font-size="26" fill="#18324f">1</text><rect x="390" y="125" width="100" height="66" rx="9" fill="#fff" stroke="#91a4b9"/><text x="402" y="166.0" font-size="26" fill="#18324f">1</text><rect x="110" y="230" width="100" height="66" rx="9" fill="#fff" stroke="#91a4b9"/><text x="122" y="271.0" font-size="26" fill="#18324f">1</text><rect x="250" y="230" width="100" height="66" rx="9" fill="#fff" stroke="#91a4b9"/><text x="262" y="271.0" font-size="26" fill="#18324f">2</text><rect x="390" y="230" width="100" height="66" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="402" y="271.0" font-size="26" fill="#18324f">3</text><rect x="110" y="335" width="100" height="66" rx="9" fill="#fff" stroke="#91a4b9"/><text x="122" y="376.0" font-size="26" fill="#18324f">1</text><rect x="250" y="335" width="100" height="66" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="262" y="376.0" font-size="26" fill="#18324f">3</text><rect x="390" y="335" width="100" height="66" rx="9" fill="#fde68a" stroke="#91a4b9"/><text x="402" y="376.0" font-size="26" fill="#18324f">6</text><path d="M440 296 L440 331" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M352 368 L385 368" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="24" y="469" font-size="22" fill="#18324f">마지막 이동 ↓ 인 3개 + → 인 3개 = 6개</text><text x="24" y="517" font-size="22" fill="#18324f">어느 경로도 두 방향으로 동시에 끝나지 않음</text><text x="24" y="565" font-size="21" fill="#18324f">마지막 이동이 반드시 둘 중 하나이므로 누락 없음</text></svg>
