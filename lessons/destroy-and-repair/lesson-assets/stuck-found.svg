<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 507" role="img" aria-labelledby="title desc">
<title id="title">지역 최적에서 개선을 찾은 횟수 (순서 틀)</title>
<desc id="desc">순서 틀의 지역 최적(시드 20개 모두 개선하는 작은 이동이 없음)에서 부수고 다시 짓기를 300번 시도해 새 해가 더 좋았던 횟수의 중앙값입니다. 떼어 내는 점 수(로그 눈금)가 늘 때, 연속 구간은 8개에서 43번까지 늘었다가 줄고, 가까운 점은 13개 이상에서 57번에 이르며, 무작위와 비용 기여는 21개에서야 각각 12번과 14번입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="505" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">지역 최적에서 개선을 찾은 횟수 (순서 틀)</text>
<text x="28" y="84" font-size="19" fill="#53657d">시작 해의 지역 최적에서 300번 시도했을 때 새 해가 더 좋았던 횟수의</text>
<text x="28" y="109" font-size="19" fill="#53657d">중앙값입니다. 클수록 잘 빠져나옵니다</text>
