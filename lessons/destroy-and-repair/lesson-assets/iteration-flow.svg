<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 801" role="img" aria-labelledby="title desc">
<title id="title">부수고 다시 짓기 반복 한 번</title>
<desc id="desc">runDR의 while 한 바퀴입니다. 예산이 남은 동안 p.mark로 되돌릴 기준을 잡고, p.destroy로 c.size만큼 떼어 pool에 담고, p.repair로 pool을 모두 다시 놓고, accepts로 새 해를 받을지 정합니다. 받으면 p.keep으로 확정하고 새 최고 비용이면 p.saveBest를 부르며, 받지 않으면 p.rollback으로 부수기 전으로 되돌립니다. mark, destroy, repair, keep, rollback, saveBest는 문제마다 채우는 함수이고 반복과 받는 기준은 틀입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="799" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">부수고 다시 짓기 반복 한 번</text>
<text x="28" y="84" font-size="19" fill="#53657d">runDR의 while 한 바퀴입니다. 파란 상자는 틀,</text>
<text x="28" y="109" font-size="19" fill="#53657d">주황 상자는 문제가 채우는 함수입니다</text>
<rect x="28" y="150" width="14" height="14" fill="#2664ce"/>
<text x="50" y="162" font-size="18" fill="#172b45">문제와 무관한 고정 부분</text>
<rect x="293.7" y="150" width="14" height="14" fill="#ae5515"/>
<text x="315.7" y="162" font-size="18" fill="#172b45">문제마다 채우는 함수</text>
<rect x="60" y="178" width="380" height="66" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="74" y="203" font-size="19" fill="#172b45" font-weight="700">p.ops &lt; budget</text>
<text x="74" y="226" font-size="16" fill="#53657d">반복마다 ops와 iters에 1을 더한다</text>
<line x1="250" y1="245" x2="250" y2="255" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,253 256,253 250,262" fill="#53657d"/>
<rect x="60" y="262" width="380" height="66" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="2"/>
<text x="74" y="287" font-size="19" fill="#172b45" font-weight="700">p.mark()</text>
<text x="74" y="310" font-size="16" fill="#53657d">되돌릴 기준을 잡는다</text>
<line x1="250" y1="329" x2="250" y2="339" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,337 256,337 250,346" fill="#53657d"/>
<rect x="60" y="346" width="380" height="66" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="2"/>
<text x="74" y="371" font-size="19" fill="#172b45" font-weight="700">p.destroy(rng, c)</text>
<text x="74" y="394" font-size="16" fill="#53657d">c.size만큼 떼어 pool에 담는다</text>
<line x1="250" y1="413" x2="250" y2="423" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,421 256,421 250,430" fill="#53657d"/>
<rect x="60" y="430" width="380" height="66" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="2"/>
<text x="74" y="455" font-size="19" fill="#172b45" font-weight="700">p.repair(rng, c)</text>
<text x="74" y="478" font-size="16" fill="#53657d">pool을 모두 다시 놓는다</text>
<line x1="250" y1="497" x2="250" y2="507" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,505 256,505 250,514" fill="#53657d"/>
<rect x="60" y="514" width="380" height="66" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="74" y="539" font-size="19" fill="#172b45" font-weight="700">accepts(c, now, cur, ...)</text>
<text x="74" y="562" font-size="16" fill="#53657d">좋아지면 받고, 아니면 accept에 따라</text>
<rect x="28" y="624" width="330" height="66" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="2"/>
<text x="42" y="649" font-size="19" fill="#172b45" font-weight="700">받으면: p.keep()</text>
<text x="42" y="672" font-size="16" fill="#53657d">새 해를 확정, 새 최고면 saveBest</text>
<rect x="378" y="624" width="314" height="66" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="2"/>
<text x="392" y="649" font-size="19" fill="#172b45" font-weight="700">아니면: p.rollback()</text>
<text x="392" y="672" font-size="16" fill="#53657d">부수기 전으로 되돌린다</text>
<line x1="150" y1="581" x2="150" y2="617" stroke="#53657d" stroke-width="2.5"/>
<polygon points="144,615 156,615 150,624" fill="#53657d"/>
<line x1="420" y1="581" x2="420" y2="617" stroke="#53657d" stroke-width="2.5"/>
<polygon points="414,615 426,615 420,624" fill="#53657d"/>
<text x="162" y="608" font-size="17" fill="#172b45" font-weight="700">받는다</text>
<text x="432" y="608" font-size="17" fill="#172b45" font-weight="700">받지 않는다</text>
<line x1="193" y1="691" x2="193" y2="727" stroke="#53657d" stroke-width="2.5"/>
<polygon points="187,725 199,725 193,734" fill="#53657d"/>
<line x1="535" y1="691" x2="535" y2="727" stroke="#53657d" stroke-width="2.5"/>
<polygon points="529,725 541,725 535,734" fill="#53657d"/>
<rect x="28" y="734" width="664" height="48" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="42" y="765" font-size="19" fill="#172b45" font-weight="700">p.ops &lt; budget이면 다시 처음부터</text>
</svg>
