<text x="28" y="500" font-size="18" fill="#172b45">작은 이동 전부에서 31 이상: 한 점 옮기기 +1, 교환·뒤집기 +2</text>
<text x="28" y="528" font-size="18" fill="#172b45">4, 5번 점을 함께 떼어 가장 싼 자리에 다시 끼우면 27</text>
