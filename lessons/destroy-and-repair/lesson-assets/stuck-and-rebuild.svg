<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
<title id="title">작은 이동으로 못 나가는 경로와 두 점을 함께 옮긴 경로</title>
<desc id="desc">점 7개의 열린 경로입니다. 왼쪽 경로의 비용은 31이고, 4번과 5번 점은 서로 가깝지만 3번 점과 6번 점 사이에 있습니다. 한 점 교환·한 점 옮기기·구간 뒤집기 어느 것으로도 31보다 낮아지지 않고, 가장 좋은 한 점 옮기기도 1 늘어납니다. 4번과 5번 점을 함께 떼어 내 가장 싼 자리에 다시 끼우면 1번 점과 2번 점 사이로 들어가 비용이 27이 됩니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
