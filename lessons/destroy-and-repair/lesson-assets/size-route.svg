<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 507" role="img" aria-labelledby="title desc">
<title id="title">떼어 내는 크기별 비용 (순서 틀)</title>
<desc id="desc">순서 틀에서 떼어 내는 점 수(로그 눈금)를 바꿨을 때 시드 20개 중 10번째로 작은 비용입니다. 점 1개에서 14,336이고 점 13개에서 가장 낮은 13,662이며, 200개(전체)에서는 14,504로 다시 나빠집니다. 점선은 같은 예산의 작은 이동만(14,203)입니다. 점 2개에서 40개까지의 중앙값이 점선 아래입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="505" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">떼어 내는 크기별 비용 (순서 틀)</text>
<text x="28" y="84" font-size="19" fill="#53657d">예산 4,000,000, 시드 20개 중 10번째로 작은 비용. 작을수록 좋습니다.</text>
<text x="28" y="109" font-size="19" fill="#53657d">가운데 크기가 이깁니다</text>
<line x1="28" y1="132" x2="48" y2="132" stroke="#2664ce" stroke-width="3.5"/>
<circle cx="38" cy="132" r="4.5" fill="#2664ce"/>
<text x="56" y="137" font-size="18" fill="#172b45">혼합 (가까운 점 부수기)</text>
<line x1="301.5" y1="132" x2="321.5" y2="132" stroke="#ae5515" stroke-width="3.5"/>
<circle cx="311.5" cy="132" r="4.5" fill="#ae5515"/>
<text x="329.5" y="137" font-size="18" fill="#172b45">작은 이동만 14,203 (같은 예산)</text>
<text x="28" y="163" font-size="17" fill="#53657d">최종 비용 ↓ (작을수록 좋음)</text>
<line x1="92.8" y1="437" x2="680" y2="437" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="84.8" y="442" font-size="16" fill="#53657d" text-anchor="end">13,500</text>
