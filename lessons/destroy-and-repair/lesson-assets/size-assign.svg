<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 507" role="img" aria-labelledby="title desc">
<title id="title">떼어 내는 크기별 비용 (배정 틀)</title>
<desc id="desc">배정 틀에서 떼어 내는 작업 수(로그 눈금)를 바꿨을 때 시드 20개 중 10번째로 작은 비용입니다. 작업 8개에서 가장 낮은 43,957이고 나머지 크기에서는 작은 이동만과 같은 43,990 근처입니다. 점선은 작은 이동만입니다. 점선보다 낮은 것은 작업 8개와 16개뿐이고 이득은 작습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="505" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">떼어 내는 크기별 비용 (배정 틀)</text>
<text x="28" y="84" font-size="19" fill="#53657d">예산 2,000,000, 시드 20개 중 10번째로 작은 비용. 작을수록 좋습니다.</text>
<text x="28" y="109" font-size="19" fill="#53657d">이득이 작은 입력입니다</text>
