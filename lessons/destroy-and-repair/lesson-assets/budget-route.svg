<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img" aria-labelledby="title desc">
<title id="title">같은 예산에서 세 방식의 비용 (순서 틀)</title>
<desc id="desc">순서 틀에서 연산 예산 1,000,000, 2,000,000, 4,000,000일 때 시드 20개 중 10번째로 작은 최종 비용입니다. 작은 이동만은 14,504, 14,218, 14,203로 거의 내려가지 않고, 부수고 다시 짓기만은 19,022, 15,888, 15,040로 모든 예산에서 가장 높으며, 혼합은 14,449, 13,819, 13,762로 예산 4,000,000에서 가장 낮습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="533" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">같은 예산에서 세 방식의 비용 (순서 틀)</text>
<text x="28" y="84" font-size="19" fill="#53657d">N=200, 시드 20개 중 10번째로 작은 비용. 작을수록 좋습니다. 부수고</text>
<text x="28" y="109" font-size="19" fill="#53657d">다시 짓기만은 시작 해에서 곧바로 시작합니다</text>
<line x1="28" y1="132" x2="48" y2="132" stroke="#9db6e0" stroke-width="3.5"/>
<circle cx="38" cy="132" r="4.5" fill="#9db6e0"/>
<text x="56" y="137" font-size="18" fill="#172b45">작은 이동만</text>
<line x1="189.9" y1="132" x2="209.9" y2="132" stroke="#ae5515" stroke-width="3.5"/>
<circle cx="199.9" cy="132" r="4.5" fill="#ae5515"/>
<text x="217.9" y="137" font-size="18" fill="#172b45">부수고 다시 짓기만</text>
<line x1="28" y1="160" x2="48" y2="160" stroke="#2664ce" stroke-width="3.5"/>
<circle cx="38" cy="160" r="4.5" fill="#2664ce"/>
<text x="56" y="165" font-size="18" fill="#172b45">혼합 (작은 이동 1/4 + 부수고 다시 짓기)</text>
<text x="28" y="191" font-size="17" fill="#53657d">최종 비용 ↓ (작을수록 좋음)</text>
<line x1="92.8" y1="465" x2="680" y2="465" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="84.8" y="470" font-size="16" fill="#53657d" text-anchor="end">12,000</text>
<line x1="92.8" y1="400" x2="680" y2="400" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="84.8" y="405" font-size="16" fill="#53657d" text-anchor="end">14,000</text>
<line x1="92.8" y1="335" x2="680" y2="335" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="84.8" y="340" font-size="16" fill="#53657d" text-anchor="end">16,000</text>
<line x1="92.8" y1="270" x2="680" y2="270" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="84.8" y="275" font-size="16" fill="#53657d" text-anchor="end">18,000</text>
<line x1="92.8" y1="205" x2="680" y2="205" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="84.8" y="210" font-size="16" fill="#53657d" text-anchor="end">20,000</text>
<line x1="130.8" y1="205" x2="130.8" y2="465" stroke="#d8e1ed" stroke-width="1"/>
<text x="130.8" y="489" font-size="16" fill="#53657d" text-anchor="middle">1,000,000</text>
<line x1="301.2" y1="205" x2="301.2" y2="465" stroke="#d8e1ed" stroke-width="1"/>
<text x="301.2" y="489" font-size="16" fill="#53657d" text-anchor="middle">2,000,000</text>
<line x1="642" y1="205" x2="642" y2="465" stroke="#d8e1ed" stroke-width="1"/>
<text x="642" y="489" font-size="16" fill="#53657d" text-anchor="middle">4,000,000</text>
<line x1="92.8" y1="465" x2="680" y2="465" stroke="#53657d" stroke-width="1.5"/>
<line x1="92.8" y1="205" x2="92.8" y2="465" stroke="#53657d" stroke-width="1.5"/>
