<circle cx="130.8" cy="383.6" r="5" fill="#9db6e0" stroke="#f6f8fc" stroke-width="2"/>
<circle cx="301.2" cy="392.9" r="5" fill="#9db6e0" stroke="#f6f8fc" stroke-width="2"/>
<circle cx="642" cy="393.4" r="5" fill="#9db6e0" stroke="#f6f8fc" stroke-width="2"/>
<text x="130.8" y="370.6" font-size="17" fill="#172b45" text-anchor="middle" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">14,504</text>
<text x="301.2" y="379.9" font-size="17" fill="#172b45" text-anchor="middle" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">14,218</text>
<text x="642" y="380.4" font-size="17" fill="#172b45" text-anchor="middle" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">14,203</text>
<polyline points="130.8,236.8 301.2,338.6 642,366.2" fill="none" stroke="#ae5515" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="130.8" cy="236.8" r="5" fill="#ae5515" stroke="#f6f8fc" stroke-width="2"/>
<circle cx="301.2" cy="338.6" r="5" fill="#ae5515" stroke="#f6f8fc" stroke-width="2"/>
<circle cx="642" cy="366.2" r="5" fill="#ae5515" stroke="#f6f8fc" stroke-width="2"/>
<text x="130.8" y="223.8" font-size="17" fill="#172b45" text-anchor="middle" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">19,022</text>
<text x="301.2" y="325.6" font-size="17" fill="#172b45" text-anchor="middle" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">15,888</text>
<text x="642" y="353.2" font-size="17" fill="#172b45" text-anchor="middle" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">15,040</text>
<polyline points="130.8,385.4 301.2,405.9 642,407.7" fill="none" stroke="#2664ce" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="130.8" cy="385.4" r="5" fill="#2664ce" stroke="#f6f8fc" stroke-width="2"/>
<circle cx="301.2" cy="405.9" r="5" fill="#2664ce" stroke="#f6f8fc" stroke-width="2"/>
<circle cx="642" cy="407.7" r="5" fill="#2664ce" stroke="#f6f8fc" stroke-width="2"/>
<text x="130.8" y="411.4" font-size="17" fill="#172b45" text-anchor="middle" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">14,449</text>
<text x="301.2" y="431.9" font-size="17" fill="#172b45" text-anchor="middle" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">13,819</text>
<text x="642" y="433.7" font-size="17" fill="#172b45" text-anchor="middle" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">13,762</text>
<text x="360" y="519" font-size="17" fill="#53657d" text-anchor="middle">연산 예산</text>
</svg>
