<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">부수는 크기: 작은 이동에서 처음부터 다시 짓기까지</title>
<desc id="desc">떼어 내는 점 수를 1에서 n까지 키우는 축입니다. 1이면 한 점을 가장 싼 자리에 다시 끼우는 것이라 작은 이동의 근방 안에 있고, n이면 처음부터 다시 짓는 것과 같습니다. 크기가 커질수록 한 번에 바꿀 수 있는 범위는 넓어지지만 같은 예산에서 돌 수 있는 반복 수는 줄어듭니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="448" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">부수는 크기의 두 극단</text>
<text x="28" y="84" font-size="20" fill="#53657d">크게 할수록 넓게 바꾸지만 반복이 줄어듭니다</text>
<rect x="40" y="112" width="150" height="56" rx="10" fill="#dce8fb" stroke="#2664ce" stroke-width="2"/>
<rect x="190" y="112" width="340" height="56" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/>
<rect x="530" y="112" width="150" height="56" rx="10" fill="#fbe7d6" stroke="#ae5515" stroke-width="2"/>
<text x="115" y="146" font-size="18" fill="#172b45" font-weight="700" text-anchor="middle">작은 이동과 같음</text>
<text x="360" y="146" font-size="18" fill="#172b45" font-weight="700" text-anchor="middle">다시 짓는 부분이 이동보다 크다</text>
<text x="605" y="146" font-size="18" fill="#172b45" font-weight="700" text-anchor="middle">처음부터 짓기</text>
<text x="40" y="202" font-size="20" fill="#172b45" font-weight="700">1</text>
<text x="680" y="202" font-size="20" fill="#172b45" font-weight="700" text-anchor="end">n</text>
<text x="360" y="202" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">떼어 내는 크기 k</text>
<line x1="40" y1="218" x2="680" y2="218" stroke="#172b45" stroke-width="3"/>
<path d="M 680 218 L 668 210 M 680 218 L 668 226" stroke="#172b45" stroke-width="3" fill="none"/>
<rect x="40" y="246" width="640" height="116" rx="12" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
<path d="M 60 346 L 660 270" stroke="#2664ce" stroke-width="4" fill="none"/>
<path d="M 60 270 C 140 330, 300 346, 660 346" stroke="#ae5515" stroke-width="4" fill="none"/>
<text x="660" y="266" font-size="18" fill="#2664ce" font-weight="700" text-anchor="end">범위</text>
<text x="60" y="266" font-size="18" fill="#ae5515" font-weight="700">반복 수</text>
<text x="28" y="392" font-size="18" fill="#172b45">순서 틀 실측(예산 4,000,000): 크기 1이면 반복 2,318번, 크기 200이면 43번</text>
<text x="28" y="422" font-size="18" fill="#172b45">크기 1은 근방 안의 이동이라 지역 최적에서 개선을 못 찾습니다</text>
</svg>
