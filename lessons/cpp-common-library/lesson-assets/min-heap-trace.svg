<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 794" role="img" aria-labelledby="title desc">
<title id="title">MinHeap&lt;3&gt;: (key, id) 세 개를 넣고 꺼내기</title><desc id="desc">빈 MinHeap에 (5,2), (1,7), (1,3)을 넣으면 (1,7)이 (5,2)를 밀고 올라가고 (1,3)은 key가 같아 id가 작은 쪽이 앞서 루트가 됩니다. 이어서 네 번 꺼내면 (1,3), (1,7), (5,2) 순서이고 네 번째는 빈 힙이라 false입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="792" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">MinHeap&lt;3&gt;: (key, id) 세 개를 넣고 꺼내기</text>
<text x="28" y="86" font-size="21" fill="#53657d" font-weight="400" text-anchor="start">data[1..3] 배열 · 같은 key면 id가 작은 쪽이 먼저</text>
<rect x="20" y="104" width="680" height="670" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="140" font-size="18" fill="#53657d" font-weight="700" text-anchor="start">연산</text>
<text x="285.0" y="140" font-size="18" fill="#53657d" font-weight="700" text-anchor="middle">data[1]</text>
<text x="435.0" y="140" font-size="18" fill="#53657d" font-weight="700" text-anchor="middle">data[2]</text>
<text x="585.0" y="140" font-size="18" fill="#53657d" font-weight="700" text-anchor="middle">data[3]</text>
<text x="36" y="186" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">push(5, 2)</text>
<rect x="214" y="156" width="140" height="44" rx="8" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="284.0" y="186" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">(5, 2)</text>
<rect x="364" y="156" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="514" y="156" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="228" font-size="19" fill="#53657d" font-weight="500" text-anchor="start">빈 힙이라 루트에 놓임</text>
<text x="36" y="274" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">push(1, 7)</text>
<rect x="214" y="244" width="140" height="44" rx="8" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.5"/>
<text x="284.0" y="274" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">(1, 7)</text>
<rect x="364" y="244" width="140" height="44" rx="8" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="434.0" y="274" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">(5, 2)</text>
<rect x="514" y="244" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="316" font-size="19" fill="#ae5515" font-weight="700" text-anchor="start">(1,7)이 부모 (5,2)보다 앞 → 올라감</text>
<text x="36" y="362" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">push(1, 3)</text>
<rect x="214" y="332" width="140" height="44" rx="8" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.5"/>
<text x="284.0" y="362" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">(1, 3)</text>
<rect x="364" y="332" width="140" height="44" rx="8" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="434.0" y="362" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">(5, 2)</text>
<rect x="514" y="332" width="140" height="44" rx="8" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="584.0" y="362" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">(1, 7)</text>
<text x="36" y="404" font-size="19" fill="#ae5515" font-weight="700" text-anchor="start">key 같음, id 3 &lt; 7 → 올라감</text>
<text x="36" y="450" font-size="20" fill="#2664ce" font-weight="700" text-anchor="start">pop → (1, 3)</text>
<rect x="214" y="420" width="140" height="44" rx="8" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.5"/>
<text x="284.0" y="450" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">(1, 7)</text>
<rect x="364" y="420" width="140" height="44" rx="8" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="434.0" y="450" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">(5, 2)</text>
<rect x="514" y="420" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="492" font-size="19" fill="#ae5515" font-weight="700" text-anchor="start">마지막 (1,7)을 루트로, 자식 (5,2)는 뒤라 멈춤</text>
<text x="36" y="538" font-size="20" fill="#2664ce" font-weight="700" text-anchor="start">pop → (1, 7)</text>
<rect x="214" y="508" width="140" height="44" rx="8" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.5"/>
<text x="284.0" y="538" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">(5, 2)</text>
<rect x="364" y="508" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="514" y="508" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="580" font-size="19" fill="#ae5515" font-weight="700" text-anchor="start">마지막 (5,2)가 루트가 됨</text>
<text x="36" y="626" font-size="20" fill="#2664ce" font-weight="700" text-anchor="start">pop → (5, 2)</text>
<rect x="214" y="596" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="364" y="596" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="514" y="596" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="668" font-size="19" fill="#53657d" font-weight="500" text-anchor="start">비어 있음</text>
<text x="36" y="714" font-size="20" fill="#2664ce" font-weight="700" text-anchor="start">pop → false</text>
<rect x="214" y="684" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="364" y="684" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="514" y="684" width="140" height="44" rx="8" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="756" font-size="19" fill="#53657d" font-weight="500" text-anchor="start">빈 힙: 출력 인자를 바꾸지 않음</text>
</svg>
