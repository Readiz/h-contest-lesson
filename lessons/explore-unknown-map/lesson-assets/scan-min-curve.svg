<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 547" role="img" aria-labelledby="title desc">
<title id="title">SCAN_MIN에 따른 총 비용</title>
<desc id="desc">SCAN_MIN을 0에서 9까지 바꿨을 때 정책 2의 10개 TC 비용 합입니다. 공식 입력은 11,413,135, 8,934,475, 7,849,280, 7,170,820, 6,209,985, 6,025,790, 5,847,540, 5,969,445, 7,390,140, 7,391,610이고 홀드아웃 지도는 10,528,470, 8,638,470, 7,673,780, 7,113,545, 6,281,895, 6,220,435, 6,163,340, 6,400,590, 7,881,660, 7,891,220입니다. 두 입력 모두 6에서 가장 낮고 7부터 오르며 8 이상에서는 스캔을 거의 안 해 막힘과 회전이 늘어 크게 높아집니다. 통과 기준은 6,500,000입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="545" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">SCAN_MIN에 따른 총 비용</text>
<text x="28" y="84" font-size="19" fill="#53657d">정책 2, TURN_W 15, UNK_PEN 0. 한 번에 SCAN_MIN만 바꿨고 가장 낮은</text>
<text x="28" y="109" font-size="19" fill="#53657d">6에 값을 적었습니다. 통과 기준은 6,500,000입니다</text>
