<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 846" role="img" aria-labelledby="title desc">
<title id="title">한 번의 스캔을 세 층으로 보기: 실제 지도 · 로봇 기준 관측 · 내 지도</title><desc id="desc">같은 한 번의 스캔을 세 층으로 보여 줍니다. 실제 지도는 가로 8 세로 6 칸이고 로봇은 행 3 열 4에서 서쪽을 봅니다. 실제 창은 위쪽 두 줄이 벽 하나씩 100 100 000이고, 로봇 기준으로 시계 방향 한 번 돌리면 scan이 돌려주는 011 000 000이 됩니다. 내 지도는 시작 칸을 64 64로 두고 시작 방향을 위로 정한 좌표계라서, 내 지도의 위쪽은 실제 서쪽이고 앞 칸 63 64가 벽으로 기록됩니다.</desc>
