<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 543" role="img" aria-labelledby="title desc">
<title id="title">행동별 비용 구성</title>
<desc id="desc">정책 2(SCAN_MIN 6)의 총 비용을 행동별로 나눈 그림입니다. 공식 입력은 스캔 561,360, 이동 4,196,090, 막힘 170,770, 회전 919,320, 직접 만든 홀드아웃 지도는 스캔 536,920, 이동 4,001,310, 막힘 276,280, 회전 1,348,830입니다. 이동이 가장 크고 회전, 스캔, 막힘 순이며 이동의 하한은 공식 입력 3,403,100입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="541" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="210.2" y1="165" x2="210.2" y2="477" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="339.4" y1="165" x2="339.4" y2="477" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="468.6" y1="165" x2="468.6" y2="477" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="597.9" y1="165" x2="597.9" y2="477" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">행동별 비용 구성</text>
<text x="28" y="84" font-size="19" fill="#53657d">정책 2, SCAN_MIN 6의 10개 TC 비용 합을 행동별로 나눴습니다. 괄호는</text>
<text x="28" y="109" font-size="19" fill="#53657d">행동 한 번의 비용입니다</text>
<rect x="28" y="125" width="14" height="14" fill="#2664ce"/>
<text x="50" y="137" font-size="18" fill="#172b45">공식 입력</text>
<rect x="165.9" y="125" width="14" height="14" fill="#ae5515"/>
<text x="187.9" y="137" font-size="18" fill="#172b45">홀드아웃 지도</text>
<text x="28" y="201" font-size="19" fill="#172b45" font-weight="700">스캔 (한 번에 20)</text>
<rect x="210.2" y="171" width="36.3" height="24" fill="#2664ce"/>
<text x="254.4" y="190" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">561,360</text>
<rect x="210.2" y="199" width="34.7" height="24" fill="#ae5515"/>
<text x="252.8" y="218" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">536,920</text>
<text x="28" y="279" font-size="19" fill="#172b45" font-weight="700">이동 (한 번에 10)</text>
<rect x="210.2" y="249" width="271.1" height="24" fill="#2664ce"/>
<text x="489.3" y="268" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">4,196,090</text>
<rect x="210.2" y="277" width="258.6" height="24" fill="#ae5515"/>
<text x="476.7" y="296" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">4,001,310</text>
<text x="28" y="357" font-size="19" fill="#172b45" font-weight="700">막힘 (한 번에 10)</text>
<rect x="210.2" y="327" width="11" height="24" fill="#2664ce"/>
<text x="229.2" y="346" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">170,770</text>
<rect x="210.2" y="355" width="17.9" height="24" fill="#ae5515"/>
<text x="236" y="374" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">276,280</text>
<text x="28" y="435" font-size="19" fill="#172b45" font-weight="700">회전 (한 번에 15)</text>
<rect x="210.2" y="405" width="59.4" height="24" fill="#2664ce"/>
<text x="277.6" y="424" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">919,320</text>
<rect x="210.2" y="433" width="87.2" height="24" fill="#ae5515"/>
<text x="305.3" y="452" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1,348,830</text>
<text x="210.2" y="499" font-size="16" fill="#53657d" text-anchor="middle">0</text>
<text x="339.4" y="499" font-size="16" fill="#53657d" text-anchor="middle">2,000,000</text>
<text x="468.6" y="499" font-size="16" fill="#53657d" text-anchor="middle">4,000,000</text>
<text x="597.9" y="499" font-size="16" fill="#53657d" text-anchor="middle">6,000,000</text>
<line x1="210.2" y1="165" x2="210.2" y2="477" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="527" font-size="17" fill="#53657d" text-anchor="middle">행동별 비용 합 ↓ (작을수록 좋음)</text>
</svg>
