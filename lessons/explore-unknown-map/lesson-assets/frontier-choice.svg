<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">손계산 예시: 할 일 칸 고르기와 막힘</title><desc id="desc">손계산 예시의 처음 세 결정입니다. 결정 0은 스캔 뒤 내 지도 63~65행 63~65열에서 왼쪽 64,63과 오른쪽 64,65와 뒤쪽 65,64가 모두 비용 25로 같고 번호가 가장 작은 64,63을 고릅니다. 결정 1은 64,63에서 모르는 칸 64,62로 비용 10에 이동하다가 벽에 막혀 위치가 그대로이고 그 칸이 벽으로 기록됩니다. 결정 2는 앞이 벽이므로 63,63과 65,63이 비용 25로 같아 번호가 작은 63,63을 고릅니다.</desc>
