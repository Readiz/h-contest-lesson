<text x="36" y="350" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">주황 테두리는 고른 칸입니다. 숫자는 그 칸까지의 최소 비용(회전 15, 이동 10)입니다.</text>
<text x="36" y="380" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">결정 0과 2는 비용이 같은 후보가 둘 이상이고 상태 번호가 작은 쪽을 고릅니다.</text>
<text x="36" y="410" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">결정 1은 10에 가 보지만 벽이어서 위치는 그대로이고 비용 10만 씁니다.</text>
