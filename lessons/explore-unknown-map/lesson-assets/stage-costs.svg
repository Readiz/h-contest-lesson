<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 485" role="img" aria-labelledby="title desc">
<title id="title">단계별 점수 합 (비용)</title>
<desc id="desc">단계별 10개 TC 점수 합(비용)입니다. 기준선 DFS 15,411,250, 정책 1, SCAN_MIN 0 11,398,810, 정책 1, SCAN_MIN 1 8,960,750, 정책 1, SCAN_MIN 6 5,871,635, 정책 2, SCAN_MIN 1 8,934,475, 정책 2, SCAN_MIN 6 5,847,540, 통과 기준 6,500,000입니다. 통과 기준 6,500,000보다 낮은 것은 SCAN_MIN 6인 두 정책뿐이고 스캔을 줄이는 것이 가장 큰 개선입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
