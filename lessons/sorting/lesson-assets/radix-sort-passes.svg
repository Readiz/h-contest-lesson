<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 884" role="img" aria-labelledby="title desc">
<title id="title">Radix: 두 번의 안정 정렬</title><desc id="desc">A=65538, B=3, C=65537, D=2를 상위 16비트와 하위 16비트로 나눕니다. 하위 자리 정렬 후 C A D B, 상위 자리 정렬 후 D B C A입니다. 같은 버킷 안에서는 입력 순서를 보존합니다.</desc>
