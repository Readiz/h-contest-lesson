<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc"><title id="title">Lazy: 합과 대기 중인 증가량</title><desc id="desc">루트 push 뒤 합은22가 되고 자식 합은3과7인 채 lazy3이 대기합니다. 자식 방문 시 합9와13으로 갱신합니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#172a46;font-size:21px}.small{font-size:18px}.title{font-size:28px;font-weight:700}.strong{font-weight:700}rect,line,path,circle{vector-effect:non-scaling-stroke}</style><rect width="720" height="500" rx="18" fill="#f5f8fc"/><text x="28" y="44" class="title">Lazy: 합과 대기 중인 증가량</text><text x="28" y="90" class="">원래 배열 [1, 2, 3, 4]에 전체 +3</text><rect x="190" y="115" width="340" height="55" rx="8" fill="#fde68a" stroke="#607999"/><text x="202" y="149.5" class="">루트 [0..3]: sum 10, lazy 3</text><text x="210" y="205" class="">push: sum += 4 × 3</text><line x1="360" y1="225" x2="190" y2="265" stroke="#607999" stroke-width="3"/><line x1="360" y1="225" x2="530" y2="265" stroke="#607999" stroke-width="3"/><rect x="28" y="270" width="300" height="62" rx="8" fill="#dbeafe" stroke="#607999"/><text x="40" y="308.0" class="">[0..1]: sum 3, lazy 3</text><rect x="382" y="270" width="310" height="62" rx="8" fill="#dbeafe" stroke="#607999"/><text x="394" y="308.0" class="">[2..3]: sum 7, lazy 3</text><text x="28" y="380" class="strong">루트: sum 22, lazy 0</text><text x="28" y="423" class="">자식 합은 아직 3과 7, 증가량은 lazy에 대기</text><text x="28" y="464" class="">자식 방문 시 push → 합 9와 13</text></svg>
