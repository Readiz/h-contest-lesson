<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 868" role="img" aria-labelledby="title desc">
<title id="title">Lazy: 합 반영과 전달을 분리하기</title><desc id="desc">배열 1, 2, 3, 4에서 루트의 lazy가 3인 상태를 봅니다. 루트 push 전에는 합 10, 자식 합은 3과 7입니다. 루트 push 뒤 루트 합은 22, lazy는 0이고 자식 합은 3과 7 그대로이며 각 lazy가 3입니다. 왼쪽 자식을 방문해 push하면 합은 3 더하기 2 곱하기 3으로 9가 됩니다.</desc>
<defs><marker id="ar-147d69" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#147d69"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="866" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">Lazy: 합 반영과 전달을 분리하기</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">이 구현의 lazy = 현재 합에도 아직 반영 안 된 값</text>
<rect x="28" y="108" width="664" height="272" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="140" font-size="22" fill="#172b45" font-weight="700">01  루트 push 전</text>
<text x="676" y="140" font-size="18" fill="#ae5515" font-weight="700" text-anchor="end">lazy</text>
<line x1="360" y1="232" x2="190" y2="286" stroke="#53657d" stroke-width="2" stroke-linecap="round"/>
<line x1="360" y1="232" x2="530" y2="286" stroke="#53657d" stroke-width="2" stroke-linecap="round"/>
<rect x="248" y="158" width="224" height="84" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="360" y="186" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">[0..3] · 길이 4</text>
<text x="262" y="222" font-size="24" fill="#172b45" font-weight="700">합 10</text>
<rect x="400" y="200" width="60" height="34" rx="7" fill="#fff0d8" stroke="#e1b77d" stroke-width="1.5"/>
<text x="430" y="224" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">+3</text>
<rect x="78" y="286" width="224" height="84" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="190" y="314" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">[0..1] · 길이 2</text>
<text x="92" y="350" font-size="24" fill="#172b45" font-weight="700">합 3</text>
<rect x="230" y="328" width="60" height="34" rx="7" fill="#edf1f6" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="260" y="352" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">0</text>
<rect x="418" y="286" width="224" height="84" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="530" y="314" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">[2..3] · 길이 2</text>
<text x="432" y="350" font-size="24" fill="#172b45" font-weight="700">합 7</text>
<rect x="570" y="328" width="60" height="34" rx="7" fill="#edf1f6" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="600" y="352" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">0</text>
<line x1="60" y1="384" x2="60" y2="446" stroke="#147d69" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-147d69)"/>
<rect x="86" y="394" width="380" height="40" rx="8" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="276" y="421" font-size="20" fill="#147d69" font-weight="700" text-anchor="middle">루트 합: 10 + 4 × 3 = 22</text>
<rect x="28" y="452" width="664" height="272" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="484" font-size="22" fill="#172b45" font-weight="700">02  루트 push 후</text>
<text x="676" y="484" font-size="18" fill="#ae5515" font-weight="700" text-anchor="end">lazy</text>
