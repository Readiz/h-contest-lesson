<line x1="360" y1="576" x2="530" y2="630" stroke="#53657d" stroke-width="2" stroke-linecap="round"/>
<rect x="248" y="502" width="224" height="84" rx="12" fill="#e5f4ef" stroke="#8ebfaa" stroke-width="1.5"/>
<text x="360" y="530" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">[0..3] · 길이 4</text>
<text x="262" y="566" font-size="24" fill="#147d69" font-weight="700">합 22</text>
<rect x="400" y="544" width="60" height="34" rx="7" fill="#edf1f6" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="430" y="568" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">0</text>
<rect x="78" y="630" width="224" height="84" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="190" y="658" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">[0..1] · 길이 2</text>
<text x="92" y="694" font-size="24" fill="#172b45" font-weight="700">합 3</text>
<rect x="230" y="672" width="60" height="34" rx="7" fill="#fff0d8" stroke="#e1b77d" stroke-width="1.5"/>
<text x="260" y="696" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">+3</text>
<rect x="418" y="630" width="224" height="84" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="530" y="658" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">[2..3] · 길이 2</text>
<text x="432" y="694" font-size="24" fill="#172b45" font-weight="700">합 7</text>
<rect x="570" y="672" width="60" height="34" rx="7" fill="#fff0d8" stroke="#e1b77d" stroke-width="1.5"/>
<text x="600" y="696" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">+3</text>
<rect x="28" y="744" width="664" height="96" rx="12" fill="#e9f0ff" stroke="#c1d2ec" stroke-width="1.5"/>
<text x="46" y="782" font-size="20" fill="#2664ce" font-weight="700">자식 합 3·7은 아직 그대로, lazy에 +3</text>
<text x="46" y="818" font-size="20" fill="#2664ce">왼쪽 방문 시 push: 3 + 2 × 3 = 9</text>
</svg>
