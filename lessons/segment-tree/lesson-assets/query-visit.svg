<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 796" role="img" aria-labelledby="title desc">
<title id="title">Segment Tree: 구간 [2, 5] 질의가 방문하는 노드</title><desc id="desc">배열 1부터 8의 구간 합 트리에서 [2,5]를 질의하면 루트 [0,7]과 [0,3], [4,7]은 일부만 겹쳐 내려가고, [2,3]의 합 7과 [4,5]의 합 11은 완전히 포함되어 반환되며, [0,1]과 [6,7]은 겹치지 않아 0을 반환합니다. 결과는 7+11=18입니다.</desc>
