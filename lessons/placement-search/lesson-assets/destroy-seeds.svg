<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 585" role="img" aria-labelledby="title desc">
<title id="title">destroy 방식과 크기별 합의 분포</title>
<desc id="desc">후보 검사 100,000회로 고정해 destroy 방식과 크기를 바꿨을 때 solver seed 9개의 합을 점으로, 중앙값을 눈금으로 보인 그림입니다. 중앙값은 한 영역, 여백 1칸 3,001,084, 한 영역, 여백 4칸 3,001,020, 한 영역, 여백 16칸 3,001,274, 무작위 1개 3,001,105, 무작위 4개 3,001,035, 무작위 16개 3,000,986, 낮은 점수 2개 2,996,922, 낮은 점수 8개 2,996,930입니다. 낮은 점수의 후보를 빼는 방식은 다른 방식보다 눈에 띄게 낮고 나머지는 분포가 많이 겹칩니다.</desc>
