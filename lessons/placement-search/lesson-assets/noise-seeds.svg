<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 453" role="img" aria-labelledby="title desc">
<title id="title">다시 채울 때의 무작위 배율별 합의 분포</title>
<desc id="desc">다시 채울 때 점수에 곱하는 무작위 배율을 바꿨을 때 solver seed 9개의 합과 중앙값입니다. 중앙값은 없음 (점수 순서 그대로) 2,993,803, 1배 ~ 1.3배 2,999,169, 1배 ~ 2배 3,000,611, 1배 ~ 3배 3,001,090, 1배 ~ 5배 3,001,242이며 배율이 없으면 탐욕과 같은 값이고, 넓힐수록 오르다가 3배와 5배는 분포가 겹칩니다.</desc>
