<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 529" role="img" aria-labelledby="title desc">
<title id="title">후보는 겹치고, 그래서 상한에 못 미친다</title>
<desc id="desc">위쪽의 예시 격자에는 후보 A, B, C가 있고 A와 B는 일부 칸이 겹쳐 둘 중 하나만 고를 수 있습니다. 아래에는 10개 TC 합으로 겹침을 무시한 상한 3,463,375, 통과 기준 3,001,673, 점수 큰 순 탐욕 2,993,803, 후보 번호 순 기준선 2,574,208을 비교합니다. 점수는 클수록 좋고 상한과 통과 기준의 차이가 겹침에서 나옵니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="527" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">후보는 겹치고, 그래서 상한에 못 미친다</text>
<text x="28" y="84" font-size="19" fill="#53657d">점수는 놓은 우주선 크기의 합이므로 겹치는 후보 중 하나만 고릅니다</text>
<text x="28" y="109" font-size="19" fill="#53657d">(위쪽은 예시 격자)</text>
