<text x="563.5" y="426" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">3,001,673</text>
<text x="28" y="466" font-size="19" fill="#172b45">점수 큰 순 탐욕</text>
<rect x="292" y="446" width="262.8" height="26" fill="#2664ce"/>
<text x="562.8" y="466" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">2,993,803</text>
<text x="28" y="506" font-size="19" fill="#172b45">후보 번호 순 기준선</text>
<rect x="292" y="486" width="226" height="26" fill="#9db6e0"/>
<text x="526" y="506" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">2,574,208</text>
