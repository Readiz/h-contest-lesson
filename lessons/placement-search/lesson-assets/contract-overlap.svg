<text x="206" y="272" font-size="19" fill="#172b45" font-weight="700">C</text>
<rect x="96" y="179" width="32" height="66" fill="#8a3b0b"/>
<text x="322" y="175" font-size="18" fill="#172b45" font-weight="700">A와 B는 겹치는 후보</text>
<text x="322" y="203" font-size="18" fill="#53657d">(진한 칸이 겹침)</text>
<text x="322" y="239" font-size="18" fill="#172b45">A, C 또는 B, C처럼</text>
<text x="322" y="265" font-size="18" fill="#172b45">겹치지 않게 골라야 합니다</text>
<text x="28" y="349" font-size="19" fill="#172b45" font-weight="700">10개 TC 합 (클수록 좋음)</text>
<text x="28" y="386" font-size="19" fill="#172b45">겹침을 무시한 상한</text>
