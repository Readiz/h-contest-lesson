<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">손계산 예시: 국소 이동이 멈춘 배치와 두 개를 빼고 다시 채운 배치</title>
<desc id="desc">4행 6열 지도에 우주선 4척이 있습니다. 점수가 큰 후보부터 놓으면 3×3(27)과 2×2(8)로 35점이고, 남은 후보 5개는 교체해도 7점 줄거나 제안할 수 없어 국소 이동이 멈춥니다. 두 후보를 함께 빼고 2×5 두 개(20+20)를 놓으면 40점입니다.</desc>
