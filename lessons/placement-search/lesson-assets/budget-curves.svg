<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="title desc">
<title id="title">추가 후보 검사 수에 따른 통과 기준과의 차</title>
<desc id="desc">점수 큰 순 탐욕은 통과 기준 3001673에서 7870점 모자랍니다. 후보 검사를 1만에서 100만으로 늘리면 국소 이동의 중앙값은 2650점 모자란 곳에서 멈추고, destroy/repair는 0점으로 줄어듭니다. 세로선은 seed 9개의 최소와 최대입니다.</desc>
