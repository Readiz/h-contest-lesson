<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">0-1 BFS: 같은 거리면 앞에 넣습니다</title><desc id="desc">거리 4인 u에서 비용 0의 v는 deque 앞에, 비용 1의 w는 뒤에 넣어 거리 4와 5의 순서를 유지합니다.</desc>
<defs><marker id="ar-9fb0c6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#9fb0c6"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="558" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">0-1 BFS: 같은 거리면 앞에 넣습니다</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">거리 4인 u를 꺼낸 직후: 큐 [a(4), b(5)]</text>
<rect x="28" y="108" width="664" height="240" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="147.5" y1="222.5" x2="388.6" y2="174.3" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-9fb0c6)"/>
<line x1="147.5" y1="233.5" x2="388.6" y2="281.7" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-9fb0c6)"/>
<text x="250" y="180" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">비용 0</text>
<text x="250" y="296" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">비용 1</text>
<circle cx="120" cy="228" r="26" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
<text x="120" y="235" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">u</text>
<circle cx="420" cy="168" r="26" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="420" y="175" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">v</text>
<circle cx="420" cy="288" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="420" y="295" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">w</text>
<text x="464" y="175" font-size="20" fill="#147d69" font-weight="700">거리 4</text>
<text x="464" y="295" font-size="20" fill="#172b45" font-weight="700">거리 5</text>
<rect x="28" y="368" width="664" height="52" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="46" y="401" font-size="20" fill="#172b45" font-weight="700">v를 앞에: [v(4), a(4), b(5)]</text>
<rect x="28" y="432" width="664" height="52" rx="10" fill="#f2f6fb" stroke="#9fb0c6" stroke-width="1.5"/>
<text x="46" y="465" font-size="20" fill="#172b45" font-weight="700">w를 뒤에: [v(4), a(4), b(5), w(5)]</text>
<circle cx="40" cy="524.0" r="4" fill="#2664ce"/>
<text x="56" y="530" font-size="20" fill="#172b45">더 짧은 거리를 찾았을 때만 삽입합니다.</text>
</svg>
