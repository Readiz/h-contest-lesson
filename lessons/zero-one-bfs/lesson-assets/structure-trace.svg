<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">0-1 BFS: 같은 거리면 앞에 넣습니다</title><desc id="desc">거리4인 u에서 비용0의 v는 deque 앞에, 비용1의 w는 뒤에 넣어 거리4와5의 순서를 유지합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="590" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">0-1 BFS: 같은 거리면 앞에 넣습니다</text><text x="24" y="90" font-size="24" fill="#18324f">거리 4인 u를 꺼낸 직후: 큐 [a(4), b(5)]</text><circle cx="95" cy="185" r="27" fill="#fde68a" stroke="#607b98"/><text x="95" y="193" text-anchor="middle" font-size="24">u</text><circle cx="355" cy="145" r="27" fill="#d1fae5" stroke="#607b98"/><text x="355" y="153" text-anchor="middle" font-size="24">v</text><circle cx="355" cy="255" r="27" fill="#dbeafe" stroke="#607b98"/><text x="355" y="263" text-anchor="middle" font-size="24">w</text><path d="M123 181 L327 150" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M121 198 L327 247" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="205" y="140" font-size="22" fill="#18324f">비용 0</text><text x="205" y="253" font-size="22" fill="#18324f">비용 1</text><text x="403" y="153" font-size="22" fill="#18324f">거리 4</text><text x="403" y="263" font-size="22" fill="#18324f">거리 5</text><rect x="24" y="340" width="550" height="57" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="376.5" font-size="23" fill="#18324f">v를 앞에: [v(4), a(4), b(5)]</text><rect x="24" y="418" width="550" height="57" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="454.5" font-size="22" fill="#18324f">w를 뒤에: [v(4), a(4), b(5), w(5)]</text><text x="24" y="535" font-size="23" fill="#18324f">더 짧은 거리를 찾았을 때만 삽입합니다.</text></svg>
