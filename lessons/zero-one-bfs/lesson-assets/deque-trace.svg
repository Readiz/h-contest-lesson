<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 786" role="img" aria-labelledby="title desc">
<title id="title">0-1 BFS: deque 앞·뒤 삽입 따라가기</title><desc id="desc">간선 0→1(1), 0→2(0), 2→1(0), 1→3(1), 2→3(1), 3→2(0)에서 시작점 0의 deque 변화입니다. 0을 꺼내면 2(0)는 앞, 1(1)은 뒤에 들어가고, 2를 꺼내면 1(0)이 앞에, 3(1)이 뒤에 들어갑니다. 이후 낡은 후보 1(1)은 건너뛰어 최종 거리는 0 0 0 1 -1입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="784" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">0-1 BFS: deque 앞·뒤 삽입 따라가기</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">칩 v(d) = 정점 v를 거리 d로 넣은 후보</text>
<text x="28" y="114" font-size="20" fill="#53657d" font-weight="400" text-anchor="start">주황 = 앞에 넣음(비용 0) · 파랑 = 뒤에 넣음(비용 1)</text>
<rect x="20" y="130" width="680" height="566" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="164" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">① 시작: 0을 거리 0으로 넣음</text>
<text x="38" y="214" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">앞</text>
<rect x="70" y="178" width="80" height="40" rx="8" fill="#fff" stroke="#9fb0c6" stroke-width="2.2"/>
<text x="110" y="205" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">0(0)</text>
<text x="682" y="205" font-size="20" fill="#53657d" font-weight="600" text-anchor="end">dist [0, ∞, ∞, ∞, ∞]</text>
<text x="166" y="211" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">뒤</text>
<text x="38" y="256" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">② 0을 꺼냄: 2는 앞, 1은 뒤</text>
<text x="38" y="306" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">앞</text>
<rect x="70" y="270" width="80" height="40" rx="8" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.2"/>
<text x="110" y="297" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">2(0)</text>
<rect x="162" y="270" width="80" height="40" rx="8" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.2"/>
<text x="202" y="297" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">1(1)</text>
<text x="682" y="297" font-size="20" fill="#53657d" font-weight="600" text-anchor="end">dist [0, 1, 0, ∞, ∞]</text>
<text x="258" y="303" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">뒤</text>
<text x="38" y="348" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">③ 2를 꺼냄: 1은 1→0으로 앞, 3은 뒤</text>
<text x="38" y="398" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">앞</text>
<rect x="70" y="362" width="80" height="40" rx="8" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.2"/>
<text x="110" y="389" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">1(0)</text>
<rect x="162" y="362" width="80" height="40" rx="8" fill="#fff" stroke="#9fb0c6" stroke-width="2.2"/>
<text x="202" y="389" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">1(1)</text>
<rect x="254" y="362" width="80" height="40" rx="8" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.2"/>
<text x="294" y="389" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">3(1)</text>
<text x="682" y="389" font-size="20" fill="#53657d" font-weight="600" text-anchor="end">dist [0, 0, 0, 1, ∞]</text>
<text x="350" y="395" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">뒤</text>
<text x="38" y="440" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">④ 1(0)을 꺼냄: 3은 0+1=1이라 그대로</text>
<text x="38" y="490" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">앞</text>
<rect x="70" y="454" width="80" height="40" rx="8" fill="#fff" stroke="#9fb0c6" stroke-width="2.2"/>
<text x="110" y="481" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">1(1)</text>
<rect x="162" y="454" width="80" height="40" rx="8" fill="#fff" stroke="#9fb0c6" stroke-width="2.2"/>
<text x="202" y="481" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">3(1)</text>
<text x="682" y="481" font-size="20" fill="#53657d" font-weight="600" text-anchor="end">dist [0, 0, 0, 1, ∞]</text>
<text x="258" y="487" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">뒤</text>
<text x="38" y="532" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">⑤ 1(1)은 dist[1]=0과 달라 건너뜀</text>
<text x="38" y="582" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">앞</text>
<rect x="70" y="546" width="80" height="40" rx="8" fill="#fff" stroke="#9fb0c6" stroke-width="2.2"/>
<text x="110" y="573" font-size="21" fill="#172b45" font-weight="700" text-anchor="middle">3(1)</text>
<text x="682" y="573" font-size="20" fill="#53657d" font-weight="600" text-anchor="end">dist [0, 0, 0, 1, ∞]</text>
<text x="166" y="579" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">뒤</text>
<text x="38" y="624" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">⑥ 3을 꺼냄: 3→2도 갱신 없음, 종료</text>
<text x="38" y="674" font-size="18" fill="#53657d" font-weight="600" text-anchor="start">앞</text>
<text x="682" y="665" font-size="20" fill="#53657d" font-weight="600" text-anchor="end">dist [0, 0, 0, 1, ∞]</text>
<text x="70" y="665" font-size="20" fill="#53657d" font-weight="400" text-anchor="start">비어 있음</text>
<rect x="28" y="712" width="664" height="54" rx="12" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="360" y="746" font-size="21" fill="#147d69" font-weight="700" text-anchor="middle">최종 거리 0 0 0 1 -1 (4번 정점은 도달 불가)</text>
</svg>
