<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" role="img" aria-labelledby="title desc">
<title id="title">기준선과 한계의 비 (기본 크기)</title>
<desc id="desc">기본 크기에서 시드 10개마다 기준선과 한계의 비입니다. 순서: 기준선 ÷ 하한는 10.83배에서 11.73배까지였고 배정: 기준선 ÷ 하한는 1.21배에서 1.27배까지였고 격자 수집: 상한 ÷ 기준선는 4.28배에서 13.60배까지였고 순서와 배정은 시드마다 비슷하고 격자 수집은 시드마다 크게 흔들립니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="363" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="275.7" y1="167" x2="275.7" y2="299" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="398" y1="167" x2="398" y2="299" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="520.3" y1="167" x2="520.3" y2="299" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="642.6" y1="167" x2="642.6" y2="299" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">기준선과 한계의 비 (기본 크기)</text>
<text x="28" y="84" font-size="19" fill="#53657d">시드 10개. 점은 시드 하나, 눈금은 중앙값(가운데 두 값의 평균)입니다.</text>
<text x="28" y="109" font-size="19" fill="#53657d">최적은 모르므로 이 비는 여지의 최대치입니다</text>
<circle cx="35" cy="132" r="6" fill="#2664ce"/>
<text x="50" y="137" font-size="18" fill="#172b45">시드 하나</text>
<line x1="165.9" y1="132" x2="185.9" y2="132" stroke="#172b45" stroke-width="3.5"/>
<circle cx="175.9" cy="132" r="4.5" fill="#172b45"/>
<text x="193.9" y="137" font-size="18" fill="#172b45">중앙값</text>
<text x="275.7" y="321" font-size="16" fill="#53657d" text-anchor="middle">0</text>
<text x="398" y="321" font-size="16" fill="#53657d" text-anchor="middle">5</text>
