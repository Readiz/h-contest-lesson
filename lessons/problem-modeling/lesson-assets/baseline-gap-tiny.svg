<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 409" role="img" aria-labelledby="title desc">
<title id="title">기준선은 최적에서 얼마나 떨어져 있나</title>
<desc id="desc">같은 작은 입력에서 시드 10개마다 기준선이 최적과 몇 퍼센트 다른지 점으로 찍은 그림입니다. 순서 N=7는 13.7%에서 215.6%이고 배정 N=6, M=3, K=3는 42.6%에서 65.0%이고 격자 4×4, T=6는 0.0%에서 100.0%이고 격자 20×20, T=5는 45.0%에서 100.0%이고 기준선은 대부분의 시드에서 최적과 멀어 개선할 여지가 큽니다.</desc>
