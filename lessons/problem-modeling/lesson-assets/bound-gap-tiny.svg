<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 409" role="img" aria-labelledby="title desc">
<title id="title">한계는 최적에서 얼마나 떨어져 있나</title>
<desc id="desc">작은 입력에서 시드 10개마다 한계가 전수 탐색한 최적과 몇 퍼센트 다른지 점으로 찍은 그림입니다. 순서 N=7는 0.0%에서 3.6%이고 배정 N=6, M=3, K=3는 2.4%에서 7.0%이고 격자 4×4, T=6는 0.0%에서 42.9%이고 격자 20×20, T=5는 21.9%에서 93.8%이고 순서의 하한은 최적에 가깝고 격자 수집의 상한은 20×20에서 크게 느슨합니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="407" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">한계는 최적에서 얼마나 떨어져 있나</text>
<text x="28" y="84" font-size="19" fill="#53657d">작은 입력 4종, 시드 10개. 점은 시드 하나, 눈금은 중앙값입니다.</text>
<text x="28" y="109" font-size="19" fill="#53657d">0%이면 한계가 최적과 같습니다</text>
