<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">한 개 제거로는 안 열리는 공간</title><desc id="desc">2행4열의 가운데 두 열을 점수3인 A와 B가 막으면2행3열 점수10인 C는 못 들어갑니다. 둘을 제거하면6점에서10점으로 개선됩니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="610" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="27" fill="#18324f">한 개 제거로는 안 열리는 공간</text><text x="24" y="90" font-size="22" fill="#18324f">같은 2×4 공간 / 회전 없음 / 창문 없음</text><text x="24" y="139" font-size="21" fill="#18324f">기존: A(3점), B(3점)</text><rect x="24" y="165" width="58" height="58" rx="9" fill="#fff" stroke="#91a4b9"/><text x="36" y="202.0" font-size="24" fill="#18324f">.</text><rect x="86" y="165" width="58" height="58" rx="9" fill="#fde68a" stroke="#91a4b9"/><text x="98" y="202.0" font-size="24" fill="#18324f">A</text><rect x="148" y="165" width="58" height="58" rx="9" fill="#fde68a" stroke="#91a4b9"/><text x="160" y="202.0" font-size="24" fill="#18324f">B</text><rect x="210" y="165" width="58" height="58" rx="9" fill="#fff" stroke="#91a4b9"/><text x="222" y="202.0" font-size="24" fill="#18324f">.</text><rect x="24" y="227" width="58" height="58" rx="9" fill="#fff" stroke="#91a4b9"/><text x="36" y="264.0" font-size="24" fill="#18324f">.</text><rect x="86" y="227" width="58" height="58" rx="9" fill="#fde68a" stroke="#91a4b9"/><text x="98" y="264.0" font-size="24" fill="#18324f">A</text><rect x="148" y="227" width="58" height="58" rx="9" fill="#fde68a" stroke="#91a4b9"/><text x="160" y="264.0" font-size="24" fill="#18324f">B</text><rect x="210" y="227" width="58" height="58" rx="9" fill="#fff" stroke="#91a4b9"/><text x="222" y="264.0" font-size="24" fill="#18324f">.</text><text x="320" y="139" font-size="21" fill="#18324f">repair: C(10점)</text><rect x="320" y="165" width="58" height="58" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="332" y="202.0" font-size="24" fill="#18324f">C</text><rect x="382" y="165" width="58" height="58" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="394" y="202.0" font-size="24" fill="#18324f">C</text><rect x="444" y="165" width="58" height="58" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="456" y="202.0" font-size="24" fill="#18324f">C</text><rect x="506" y="165" width="58" height="58" rx="9" fill="#fff" stroke="#91a4b9"/><text x="518" y="202.0" font-size="24" fill="#18324f">.</text><rect x="320" y="227" width="58" height="58" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="332" y="264.0" font-size="24" fill="#18324f">C</text><rect x="382" y="227" width="58" height="58" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="394" y="264.0" font-size="24" fill="#18324f">C</text><rect x="444" y="227" width="58" height="58" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="456" y="264.0" font-size="24" fill="#18324f">C</text><rect x="506" y="227" width="58" height="58" rx="9" fill="#fff" stroke="#91a4b9"/><text x="518" y="264.0" font-size="24" fill="#18324f">.</text><text x="24" y="335" font-size="22" fill="#18324f">A 하나만 빼면 B가 남아 C(2×3)를 막습니다.</text><text x="24" y="385" font-size="22" fill="#18324f">A와 B를 함께 빼고 C를 넣으면 6 → 10점.</text><rect x="24" y="430" width="552" height="57" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="466.5" font-size="24" fill="#18324f">제거·시험·복구는 로컬 상태에서만</text><text x="24" y="529" font-size="22" fill="#18324f">최종 배치를 선택한 뒤 place_ad를 호출합니다.</text><text x="24" y="574" font-size="21" fill="#18324f">공개 API로 놓은 광고는 로컬 삭제로 복구 불가</text></svg>
