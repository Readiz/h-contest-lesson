<rect x="204" y="232" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="280" y="232" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="131" y="163" width="70" height="138" rx="8" fill="#fff0d8" stroke="#d9a668" stroke-width="1.5"/>
<text x="166" y="236" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">A</text>
<rect x="207" y="163" width="70" height="138" rx="8" fill="#e9e5fb" stroke="#a299cd" stroke-width="1.5"/>
<text x="242" y="236" font-size="20" fill="#64518e" font-weight="700" text-anchor="middle">B</text>
<text x="400" y="204" font-size="20" fill="#172b45" font-weight="700">점수 3 + 3</text>
<text x="400" y="246" font-size="24" fill="#172b45" font-weight="700">= 6</text>
<text x="400" y="284" font-size="20" fill="#53657d">빈칸이 나뉨</text>
<line x1="210" y1="320" x2="210" y2="352" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
