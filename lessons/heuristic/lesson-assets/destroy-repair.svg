<rect x="55" y="415" width="146" height="138" rx="8" fill="#e5f4ef" stroke="#a9d2bf" stroke-width="1.5"/>
<text x="128" y="488" font-size="20" fill="#147d69" font-weight="700" text-anchor="middle">빈 폭 2</text>
<rect x="207" y="415" width="70" height="138" rx="8" fill="#e9e5fb" stroke="#a299cd" stroke-width="1.5"/>
<text x="242" y="488" font-size="20" fill="#64518e" font-weight="700" text-anchor="middle">B</text>
