<rect x="280" y="160" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="52" y="232" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
