<path d="M224 514 l 24 24 m 0 -24 l -24 24" fill="none" stroke="#ae5515" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="400" y="456" font-size="20" fill="#ae5515" font-weight="700">C는 폭 3</text>
<text x="400" y="498" font-size="24" fill="#ae5515" font-weight="700">B와 겹침</text>
<text x="400" y="536" font-size="20" fill="#ae5515">배치 불가</text>
<line x1="210" y1="572" x2="210" y2="604" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
<rect x="28" y="612" width="664" height="208" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="644" font-size="22" fill="#172b45" font-weight="700">03  A·B 제거 후 재배치</text>
<rect x="52" y="664" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
