<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 892" role="img" aria-labelledby="title desc">
<title id="title">함께 비워야 열리는 공간</title><desc id="desc">2행 4열 보드의 가운데 두 열을 각각 점수 3인 2행 1열 광고 A와 B가 차지합니다. A만 제거하면 최대 빈 폭은 2여서 2행 3열 광고 C가 들어가지 않습니다. 둘을 제거하고 C를 배치하면 점수가 6에서 10으로 오릅니다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2664ce"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#147d69"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ae5515"/></marker>
</defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="598" height="890" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce" stroke="#2664ce" stroke-width="1.5"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750" text-anchor="start">함께 비워야 열리는 공간</text>
<text x="28" y="91" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">2행 × 4열 · A와 B는 각 3점 · C는 10점</text>
<rect x="28" y="114" width="544" height="213" rx="12" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="149" font-size="24" fill="#172b45" font-weight="750" text-anchor="start">01  현재 배치</text>
<rect x="44" y="169" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="108" y="169" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="172" y="169" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="236" y="169" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="44" y="233" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="108" y="233" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="172" y="233" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="236" y="233" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="111" y="172" width="58" height="122" rx="8" fill="#fff0d8" stroke="#d9a668" stroke-width="1.5"/>
<text x="140.0" y="241" font-size="29" fill="#ae5515" font-weight="750" text-anchor="middle">A</text>
<rect x="175" y="172" width="58" height="122" rx="8" fill="#e9e5fb" stroke="#a299cd" stroke-width="1.5"/>
<text x="204.0" y="241" font-size="29" fill="#64518e" font-weight="750" text-anchor="middle">B</text>
<text x="329" y="200" font-size="23" fill="#172b45" font-weight="700" text-anchor="start">점수 3 + 3</text>
<text x="329" y="240" font-size="30" fill="#172b45" font-weight="750" text-anchor="start">= 6</text>
<text x="329" y="282" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">빈칸이 나뉨</text>
<path d="M 172 336 V 363" fill="none" stroke="#2664ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="350" width="544" height="213" rx="12" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="385" font-size="24" fill="#172b45" font-weight="750" text-anchor="start">02  A만 제거</text>
<rect x="44" y="405" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="108" y="405" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="172" y="405" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="236" y="405" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="44" y="469" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="108" y="469" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="172" y="469" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="236" y="469" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="175" y="408" width="58" height="122" rx="8" fill="#e9e5fb" stroke="#a299cd" stroke-width="1.5"/>
<text x="204.0" y="477" font-size="29" fill="#64518e" font-weight="750" text-anchor="middle">B</text>
<rect x="47" y="408" width="122" height="122" rx="8" fill="#e6f4ed" stroke="#a9d2bf" stroke-width="1.5"/>
<text x="108" y="477" font-size="22" fill="#147d69" font-weight="700" text-anchor="middle">빈 폭 2</text>
<rect x="50" y="413" width="180" height="112" rx="8" fill="none" stroke="#ae5515" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M 190 493 l 24 24 m 0 -24 l -24 24" fill="none" stroke="#ae5515" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="329" y="436" font-size="23" fill="#ae5515" font-weight="750" text-anchor="start">C는 폭 3</text>
<text x="329" y="476" font-size="25" fill="#ae5515" font-weight="750" text-anchor="start">B와 겹침</text>
<text x="329" y="518" font-size="22" fill="#ae5515" font-weight="400" text-anchor="start">배치 불가</text>
<path d="M 172 572 V 599" fill="none" stroke="#2664ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="586" width="544" height="213" rx="12" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="621" font-size="24" fill="#172b45" font-weight="750" text-anchor="start">03  A·B 제거 후 재배치</text>
<rect x="44" y="641" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="108" y="641" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="172" y="641" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="236" y="641" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="44" y="705" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="108" y="705" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="172" y="705" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="236" y="705" width="64" height="64" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="47" y="644" width="186" height="122" rx="8" fill="#dcf1e7" stroke="#69ae92" stroke-width="1.5"/>
<text x="140.0" y="702" font-size="30" fill="#147d69" font-weight="750" text-anchor="middle">C</text>
<text x="140.0" y="738" font-size="24" fill="#147d69" font-weight="650" text-anchor="middle">2 × 3</text>
<text x="329" y="672" font-size="27" fill="#147d69" font-weight="750" text-anchor="start">점수 10</text>
<text x="329" y="712" font-size="27" fill="#147d69" font-weight="750" text-anchor="start">6 → 10</text>
<text x="329" y="754" font-size="22" fill="#147d69" font-weight="400" text-anchor="start">4점 개선</text>
<text x="28" y="839" font-size="23" fill="#172b45" font-weight="650" text-anchor="start">로컬 상태에서 제거·시험·복구합니다.</text>
<text x="28" y="875" font-size="23" fill="#53657d" font-weight="400" text-anchor="start">최종 배치를 고른 뒤 place_ad를 호출합니다.</text>
</svg>
