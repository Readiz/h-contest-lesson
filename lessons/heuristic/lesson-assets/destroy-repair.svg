<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 926" role="img" aria-labelledby="title desc">
<title id="title">함께 비워야 열리는 공간</title><desc id="desc">2행 4열 보드의 가운데 두 열을 각각 점수 3인 2행 1열 광고 A와 B가 차지합니다. A만 제거하면 최대 빈 폭은 2여서 2행 3열 광고 C가 들어가지 않습니다. 둘을 제거하고 C를 배치하면 점수가 6에서 10으로 오릅니다.</desc>
<defs><marker id="ar-2664ce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2664ce"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="924" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">함께 비워야 열리는 공간</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">2행 × 4열 · A와 B는 각 3점 · C는 10점</text>
<rect x="28" y="108" width="664" height="208" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="140" font-size="22" fill="#172b45" font-weight="700">01  현재 배치</text>
<rect x="52" y="160" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
