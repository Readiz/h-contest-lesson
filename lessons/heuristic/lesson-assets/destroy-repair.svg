<rect x="52" y="736" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="128" y="736" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="204" y="736" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="280" y="736" width="76" height="72" rx="0" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="55" y="667" width="222" height="138" rx="8" fill="#dcf1e7" stroke="#69ae92" stroke-width="1.5"/>
<text x="166" y="730" font-size="20" fill="#147d69" font-weight="700" text-anchor="middle">C</text>
<text x="166" y="766" font-size="20" fill="#147d69" font-weight="600" text-anchor="middle">2 × 3</text>
<text x="400" y="712" font-size="24" fill="#147d69" font-weight="700">점수 10</text>
<text x="400" y="754" font-size="24" fill="#147d69" font-weight="700">6 → 10</text>
<text x="400" y="792" font-size="20" fill="#147d69">4점 개선</text>
<text x="28" y="860" font-size="20" fill="#172b45" font-weight="700">로컬 상태에서 제거·시험·복구합니다.</text>
<text x="28" y="898" font-size="20" fill="#53657d">최종 배치를 고른 뒤 place_ad를 호출합니다.</text>
</svg>
