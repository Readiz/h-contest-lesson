<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 756" role="img" aria-labelledby="title desc">
<title id="title">SA: 현재해와 최선해는 다르다</title><desc id="desc">최소화 문제에서 채택된 현재해 비용은 10, 13, 11, 8로 움직입니다. 지금까지의 최저 비용인 최선해는 10, 10, 10, 8입니다. 13에서 11로 개선되어도 최선해 10은 유지합니다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2664ce" /></marker>
