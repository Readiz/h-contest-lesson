<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 625" role="img" aria-labelledby="title desc"><title id="title">SA: 움직이는 해와 제출할 해</title><desc id="desc">채택된 비용이10 13 11 8일 때 현재해는 그대로 움직이지만 최선해 비용은10 10 10 8입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="625" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="27" fill="#18324f">SA: 움직이는 해와 제출할 해</text><text x="24" y="90" font-size="23" fill="#18324f">최소화 / 아래는 채택된 이동만 표시</text><text x="24" y="145" font-size="22" fill="#18324f">시작</text><rect x="235" y="112" width="160" height="56" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="247" y="148.0" font-size="24" fill="#18324f">현재 10</text><rect x="415" y="112" width="160" height="56" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="427" y="148.0" font-size="24" fill="#18324f">최선 10</text><path d="M315 171 L315 205" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="24" y="245" font-size="22" fill="#18324f">나쁜 이동 채택</text><rect x="235" y="212" width="160" height="56" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="247" y="248.0" font-size="24" fill="#18324f">현재 13</text><rect x="415" y="212" width="160" height="56" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="427" y="248.0" font-size="24" fill="#18324f">최선 10</text><path d="M315 271 L315 305" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="24" y="345" font-size="22" fill="#18324f">좋은 이동 채택</text><rect x="235" y="312" width="160" height="56" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="247" y="348.0" font-size="24" fill="#18324f">현재 11</text><rect x="415" y="312" width="160" height="56" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="427" y="348.0" font-size="24" fill="#18324f">최선 10</text><path d="M315 371 L315 405" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="24" y="445" font-size="22" fill="#18324f">최저 비용 갱신</text><rect x="235" y="412" width="160" height="56" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="247" y="448.0" font-size="24" fill="#18324f">현재 8</text><rect x="415" y="412" width="160" height="56" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="427" y="448.0" font-size="24" fill="#18324f">최선 8</text><text x="24" y="552" font-size="22" fill="#18324f">13 → 11은 개선이지만 최선 10보다 나쁩니다.</text><text x="24" y="591" font-size="22" fill="#18324f">거절한 이동은 current와 best 모두 유지합니다.</text></svg>
