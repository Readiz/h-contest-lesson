<text x="28" y="532" font-size="23" fill="#172b45" font-weight="650" text-anchor="start">10 → 13: 손해를 받아들여도 best는 10</text>
<text x="28" y="569" font-size="23" fill="#172b45" font-weight="400" text-anchor="start">13 → 11: 개선되어도 아직 best보다 나쁨</text>
<text x="28" y="606" font-size="23" fill="#147d69" font-weight="700" text-anchor="start">제출할 때는 best의 비용과 상태를 사용</text>
