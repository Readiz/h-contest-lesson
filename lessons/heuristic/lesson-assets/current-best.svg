<line x1="50" y1="144" x2="85" y2="144" stroke="#2664ce" stroke-width="4"/>
<circle cx="67" cy="144" r="5" fill="#2664ce" stroke="#2664ce" stroke-width="2"/>
<text x="96" y="151" font-size="22" fill="#2664ce" font-weight="700" text-anchor="start">현재해</text>
