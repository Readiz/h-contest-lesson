<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="title desc"><title id="title">열린 경로: 꼬리의 경계는 하나</title><desc id="desc">경로0 A B C D의 꼬리 B C D를 뒤집으면0 A D C B가 됩니다. 비용16에서9로 감소하며 A B만 A D로 바뀝니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="620" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="27" fill="#18324f">열린 경로: 꼬리의 경계는 하나</text><text x="24" y="90" font-size="23" fill="#18324f">x좌표: 0=0, A=1, B=9, C=8, D=2</text><text x="24" y="145" font-size="24" fill="#18324f">뒤집기 전 / 비용 16</text><circle cx="55" cy="210" r="27" fill="#dbeafe" stroke="#607b98"/><text x="55" y="218" text-anchor="middle" font-size="24">0</text><path d="M84 210 L144 210" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="105" y="190" font-size="22" fill="#18324f">1</text><circle cx="175" cy="210" r="27" fill="#dbeafe" stroke="#607b98"/><text x="175" y="218" text-anchor="middle" font-size="24">A</text><path d="M204 210 L264 210" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="225" y="190" font-size="22" fill="#18324f">8</text><circle cx="295" cy="210" r="27" fill="#d1fae5" stroke="#607b98"/><text x="295" y="218" text-anchor="middle" font-size="24">B</text><path d="M324 210 L384 210" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="345" y="190" font-size="22" fill="#18324f">1</text><circle cx="415" cy="210" r="27" fill="#d1fae5" stroke="#607b98"/><text x="415" y="218" text-anchor="middle" font-size="24">C</text><path d="M444 210 L504 210" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="465" y="190" font-size="22" fill="#18324f">6</text><circle cx="535" cy="210" r="27" fill="#d1fae5" stroke="#607b98"/><text x="535" y="218" text-anchor="middle" font-size="24">D</text><text x="24" y="335" font-size="24" fill="#18324f">꼬리 뒤집기 후 / 비용 9</text><circle cx="55" cy="400" r="27" fill="#dbeafe" stroke="#607b98"/><text x="55" y="408" text-anchor="middle" font-size="24">0</text><path d="M84 400 L144 400" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="105" y="380" font-size="22" fill="#18324f">1</text><circle cx="175" cy="400" r="27" fill="#dbeafe" stroke="#607b98"/><text x="175" y="408" text-anchor="middle" font-size="24">A</text><path d="M204 400 L264 400" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="225" y="380" font-size="22" fill="#18324f">1</text><circle cx="295" cy="400" r="27" fill="#d1fae5" stroke="#607b98"/><text x="295" y="408" text-anchor="middle" font-size="24">D</text><path d="M324 400 L384 400" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="345" y="380" font-size="22" fill="#18324f">6</text><circle cx="415" cy="400" r="27" fill="#d1fae5" stroke="#607b98"/><text x="415" y="408" text-anchor="middle" font-size="24">C</text><path d="M444 400 L504 400" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="465" y="380" font-size="22" fill="#18324f">1</text><circle cx="535" cy="400" r="27" fill="#d1fae5" stroke="#607b98"/><text x="535" y="408" text-anchor="middle" font-size="24">B</text><rect x="24" y="490" width="552" height="55" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="525.5" font-size="22" fill="#18324f">변한 비용: A–D − A–B = 1 − 8 = −7</text><text x="24" y="578" font-size="22" fill="#18324f">끝점 뒤에 창고 복귀 간선을 붙이지 않습니다.</text></svg>
