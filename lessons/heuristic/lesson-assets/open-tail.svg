<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 728" role="img" aria-labelledby="title desc">
<title id="title">열린 경로: 바뀌는 경계는 하나</title><desc id="desc">같은 x축 위에 0, A, D, C, B가 각각 0, 1, 2, 8, 9에 있습니다. 방문 순서 0-A-B-C-D를 0-A-D-C-B로 바꾸면 내부 거리 7은 유지되고 A에서 꼬리로 가는 거리만 8에서 1로 줄어 총비용이 16에서 9가 됩니다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2664ce"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#147d69"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ae5515"/></marker>
</defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="598" height="726" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce" stroke="#2664ce" stroke-width="1.5"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750" text-anchor="start">열린 경로: 바뀌는 경계는 하나</text>
<text x="28" y="91" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">점의 가로 위치 = 실제 x좌표 · 곡선 = 방문 순서</text>
<rect x="20" y="112" width="560" height="236" rx="12" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="147" font-size="23" fill="#172b45" font-weight="700" text-anchor="start">01  뒤집기 전</text>
<text x="560" y="147" font-size="24" fill="#172b45" font-weight="750" text-anchor="end">비용 16</text>
<text x="38" y="180" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">0 → A → B → C → D</text>
<line x1="46" y1="298" x2="550" y2="298" stroke="#d8e1ed" stroke-width="2"/>
<line x1="64" y1="315" x2="64" y2="326" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="64" cy="298" r="17" fill="#e9f0ff" stroke="#2664ce" stroke-width="2"/>
<text x="64" y="305" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<text x="64" y="343" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">0</text>
<line x1="116" y1="315" x2="116" y2="326" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="116" cy="298" r="17" fill="#e9f0ff" stroke="#2664ce" stroke-width="2"/>
<text x="116" y="305" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">A</text>
<text x="116" y="343" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">1</text>
<line x1="168" y1="315" x2="168" y2="326" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="168" cy="298" r="17" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="168" y="305" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">D</text>
<text x="168" y="343" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">2</text>
<line x1="480" y1="315" x2="480" y2="326" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="480" cy="298" r="17" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="480" y="305" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">C</text>
<text x="480" y="343" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">8</text>
<line x1="532" y1="315" x2="532" y2="326" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="532" cy="298" r="17" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="532" y="305" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">B</text>
<text x="532" y="343" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">9</text>
<path d="M 65 279 Q 90 238 115 279" fill="none" stroke="#2664ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="89" y="252" font-size="21" fill="#2664ce" font-weight="650" text-anchor="middle">1</text>
<path d="M 118 278 Q 324 130 530 278" fill="none" stroke="#ae5515" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="324" y="196" font-size="23" fill="#ae5515" font-weight="700" text-anchor="middle">A–B = 8</text>
<path d="M 530 278 Q 506 237 482 278" fill="none" stroke="#147d69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 478 278 Q 324 185 170 278" fill="none" stroke="#147d69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="506" y="252" font-size="21" fill="#147d69" font-weight="650" text-anchor="middle">1</text>
<text x="324" y="253" font-size="21" fill="#147d69" font-weight="650" text-anchor="middle">6</text>
<rect x="20" y="366" width="560" height="236" rx="12" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="401" font-size="23" fill="#172b45" font-weight="700" text-anchor="start">02  꼬리 뒤집기 후</text>
<text x="560" y="401" font-size="24" fill="#147d69" font-weight="750" text-anchor="end">비용 9</text>
<text x="38" y="434" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">0 → A → D → C → B</text>
<line x1="46" y1="552" x2="550" y2="552" stroke="#d8e1ed" stroke-width="2"/>
<line x1="64" y1="569" x2="64" y2="580" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="64" cy="552" r="17" fill="#e9f0ff" stroke="#2664ce" stroke-width="2"/>
<text x="64" y="559" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<text x="64" y="597" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">0</text>
<line x1="116" y1="569" x2="116" y2="580" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="116" cy="552" r="17" fill="#e9f0ff" stroke="#2664ce" stroke-width="2"/>
<text x="116" y="559" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">A</text>
<text x="116" y="597" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">1</text>
<line x1="168" y1="569" x2="168" y2="580" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="168" cy="552" r="17" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="168" y="559" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">D</text>
<text x="168" y="597" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">2</text>
<line x1="480" y1="569" x2="480" y2="580" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="480" cy="552" r="17" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="480" y="559" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">C</text>
<text x="480" y="597" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">8</text>
<line x1="532" y1="569" x2="532" y2="580" stroke="#d8e1ed" stroke-width="2"/>
<circle cx="532" cy="552" r="17" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="532" y="559" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">B</text>
<text x="532" y="597" font-size="20" fill="#53657d" font-weight="400" text-anchor="middle">9</text>
<path d="M 65 533 Q 90 492 115 533" fill="none" stroke="#2664ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="89" y="506" font-size="21" fill="#2664ce" font-weight="650" text-anchor="middle">1</text>
<path d="M 118 532 Q 142 491 166 532" fill="none" stroke="#ae5515" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="142" y="504" font-size="21" fill="#ae5515" font-weight="700" text-anchor="middle">1</text>
<path d="M 170 532 Q 324 409 478 532" fill="none" stroke="#147d69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="324" y="459" font-size="21" fill="#147d69" font-weight="650" text-anchor="middle">6</text>
<path d="M 482 532 Q 506 491 530 532" fill="none" stroke="#147d69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="506" y="506" font-size="21" fill="#147d69" font-weight="650" text-anchor="middle">1</text>
<rect x="28" y="619" width="544" height="79" rx="12" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="45" y="650" font-size="24" fill="#147d69" font-weight="750" text-anchor="start">경계 비용만 비교: 1 − 8 = −7</text>
<text x="45" y="683" font-size="22" fill="#147d69" font-weight="400" text-anchor="start">내부 거리 6 + 1은 유지 · 창고 복귀 없음</text>
</svg>
