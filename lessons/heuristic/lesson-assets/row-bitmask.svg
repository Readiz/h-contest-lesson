<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 602" role="img" aria-labelledby="title desc">
<title id="title">행 bitmask로 배치 가능 검사</title><desc id="desc">폭 8인 행에서 1번과 5번 열이 막혀 있어 occ는 34입니다. 폭 3인 광고를 x=0에 놓으면 mask 7과 겹치는 값이 2, x=1이면 mask 14와 겹치는 값이 2라 겹치고, x=2이면 mask 28과 겹치는 값이 0이라 놓을 수 있습니다.</desc>
