<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 808" role="img" aria-labelledby="title desc">
<title id="title">Beam Search: 넓힌 뒤 추리기</title><desc id="desc">설명용 beam 폭은 2입니다. 시작 상태에서 key 91, 88, 72인 후보를 만들고 91과 88만 남깁니다. 이 두 상태에서 key 107, 103, 94, 81을 만들면 부모에 관계없이 전체 후보 중 107과 103만 남깁니다. 72인 후보는 확장하지 않습니다.</desc>
