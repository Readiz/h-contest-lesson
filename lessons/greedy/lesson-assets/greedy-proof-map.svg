<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 678" role="img" aria-labelledby="title desc">
<title id="title">그리디는 기준보다 정당성이 먼저다</title><desc id="desc">좋아 보이는 선택을 찾은 뒤, 그 선택을 지금 확정해도 되는지 증명한다.</desc>
<defs><marker id="ar-2664ce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2664ce"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="676" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">그리디는 기준보다 정당성이 먼저다</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">좋아 보이는 선택을 찾은 뒤,</text>
<text x="28" y="114" font-size="22" fill="#53657d" font-weight="400">그 선택을 지금 확정해도 되는지 증명한다.</text>
<rect x="28" y="134" width="664" height="76" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
<text x="52" y="179" font-size="20" fill="#0e7490" font-weight="700">선택 단위</text>
<text x="250" y="179" font-size="20" fill="#172b45">무엇을 하나씩 확정할 것인가?</text>
<line x1="360" y1="214" x2="360" y2="238" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
<rect x="28" y="238" width="664" height="76" rx="14" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
<text x="52" y="283" font-size="20" fill="#a16207" font-weight="700">그리디 기준</text>
<text x="250" y="283" font-size="20" fill="#172b45">가장 빠른 것? 가장 싼 것?</text>
<line x1="360" y1="318" x2="360" y2="342" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
<rect x="28" y="342" width="664" height="76" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
<text x="52" y="387" font-size="20" fill="#c2410c" font-weight="700">반례 확인</text>
<text x="250" y="387" font-size="20" fill="#172b45">작은 입력에서 깨지는가?</text>
<line x1="360" y1="422" x2="360" y2="446" stroke="#2664ce" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-2664ce)"/>
<rect x="28" y="446" width="664" height="76" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="52" y="491" font-size="20" fill="#1d4ed8" font-weight="700">정당성 패턴</text>
<text x="250" y="491" font-size="20" fill="#172b45">앞서기 / 증거 / 교환</text>
<rect x="28" y="562" width="664" height="88" rx="18" fill="#0f172a"/>
<text x="360" y="596" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">정당성이 보이면 정렬, 힙, 선택 집합 같은</text>
<text x="360" y="628" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">구현 패턴을 붙인다</text>
</svg>
