<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" role="img" aria-labelledby="title desc">
<title id="title">동전 그리디 반례: {1, 3, 4}로 6원</title><desc id="desc">동전 단위 1, 3, 4로 6원을 만들 때 가장 큰 동전부터 고르면 4+1+1로 3개가 되지만, 3+3이면 2개로 만들 수 있어 큰 동전 우선 선택이 틀립니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="546" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#b42318"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">동전 그리디 반례: {1, 3, 4}로 6원</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">가장 큰 동전부터 고르면 항상 최소일까?</text>
<rect x="28" y="108" width="664" height="140" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="140" font-size="20" fill="#172b45" font-weight="700">그리디: 큰 동전부터</text>
<circle cx="90" cy="200" r="32" fill="#fee2e2" stroke="#b42318" stroke-width="3.5"/>
<text x="90" y="207" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<circle cx="190" cy="200" r="32" fill="#fee2e2" stroke="#b42318" stroke-width="3.5"/>
<text x="190" y="207" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<circle cx="290" cy="200" r="32" fill="#fee2e2" stroke="#b42318" stroke-width="3.5"/>
<text x="290" y="207" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<text x="676" y="208" font-size="22" fill="#b42318" font-weight="700" text-anchor="end">4+1+1 = 3개</text>
<rect x="28" y="264" width="664" height="140" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="296" font-size="20" fill="#172b45" font-weight="700">최적: 3을 두 번</text>
<circle cx="90" cy="356" r="32" fill="#e5f4ef" stroke="#147d69" stroke-width="3.5"/>
<text x="90" y="363" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<circle cx="190" cy="356" r="32" fill="#e5f4ef" stroke="#147d69" stroke-width="3.5"/>
<text x="190" y="363" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<text x="676" y="364" font-size="22" fill="#147d69" font-weight="700" text-anchor="end">3+3 = 2개</text>
<rect x="28" y="424" width="664" height="96" rx="12" fill="#fee2e2" stroke="#f3c1bd" stroke-width="1.5"/>
<text x="360" y="464" font-size="20" fill="#b42318" font-weight="700" text-anchor="middle">4를 고르면 남은 2는 1+1뿐</text>
<text x="360" y="498" font-size="20" fill="#b42318" font-weight="600" text-anchor="middle">3+3이라는 더 좋은 조합을 막음 → 교환 불가</text>
</svg>
