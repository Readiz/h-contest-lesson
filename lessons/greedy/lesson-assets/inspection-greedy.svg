<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 694" role="img" aria-labelledby="title desc">
<title id="title">교환 논증: 마감이 빠른 A를 t에 먼저</title><desc id="desc">시각 t=3에 처리할 수 있는 요청 A(마감 5)와 B(마감 7)가 있습니다. 최적 배정이 3에 B를, 5에 A를 처리한다면 두 요청의 시각을 바꿔 3에 A, 5에 B를 처리해도 둘 다 마감 안이라 처리 개수는 줄지 않습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="692" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">교환 논증: 마감이 빠른 A를 t에 먼저</text>
<text x="28" y="86" font-size="21" fill="#53657d" font-weight="400" text-anchor="start">칸 = 처리 시각 1~8 · t = 3 · A 마감 5 ≤ B 마감 7</text>
<rect x="20" y="104" width="680" height="210" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="140" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">어떤 최적 배정: 3에 B, 5에 A</text>
<rect x="73" y="164" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="108.0" y="246" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">1</text>
<rect x="149" y="164" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="184.0" y="246" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">2</text>
<rect x="225" y="164" width="70" height="56" rx="9" fill="#fdf0e3" stroke="#ae5515" stroke-width="3"/>
<text x="260.0" y="201" font-size="26" fill="#172b45" font-weight="750" text-anchor="middle">B</text>
<text x="260.0" y="246" font-size="19" fill="#ae5515" font-weight="750" text-anchor="middle">3</text>
<rect x="301" y="164" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="336.0" y="246" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">4</text>
<rect x="377" y="164" width="70" height="56" rx="9" fill="#e9f0ff" stroke="#2664ce" stroke-width="3"/>
<text x="412.0" y="201" font-size="26" fill="#172b45" font-weight="750" text-anchor="middle">A</text>
<text x="412.0" y="246" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">5</text>
<rect x="453" y="164" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="488.0" y="246" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">6</text>
<rect x="529" y="164" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="564.0" y="246" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">7</text>
<rect x="605" y="164" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="640.0" y="246" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">8</text>
<text x="260.0" y="272" font-size="19" fill="#ae5515" font-weight="700" text-anchor="middle">t</text>
<line x1="447" y1="156" x2="447" y2="280" stroke="#2664ce" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="442" y="300" font-size="19" fill="#2664ce" font-weight="700" text-anchor="end">A 마감</text>
<line x1="599" y1="156" x2="599" y2="280" stroke="#ae5515" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="594" y="300" font-size="19" fill="#ae5515" font-weight="700" text-anchor="end">B 마감</text>
<rect x="20" y="334" width="680" height="210" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="36" y="370" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">바꾼 배정: 3에 A, 5에 B</text>
<rect x="73" y="394" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="108.0" y="476" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">1</text>
<rect x="149" y="394" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="184.0" y="476" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">2</text>
<rect x="225" y="394" width="70" height="56" rx="9" fill="#e9f0ff" stroke="#2664ce" stroke-width="3"/>
<text x="260.0" y="431" font-size="26" fill="#172b45" font-weight="750" text-anchor="middle">A</text>
<text x="260.0" y="476" font-size="19" fill="#ae5515" font-weight="750" text-anchor="middle">3</text>
<rect x="301" y="394" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="336.0" y="476" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">4</text>
<rect x="377" y="394" width="70" height="56" rx="9" fill="#fdf0e3" stroke="#ae5515" stroke-width="3"/>
<text x="412.0" y="431" font-size="26" fill="#172b45" font-weight="750" text-anchor="middle">B</text>
<text x="412.0" y="476" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">5</text>
<rect x="453" y="394" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="488.0" y="476" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">6</text>
<rect x="529" y="394" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="564.0" y="476" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">7</text>
<rect x="605" y="394" width="70" height="56" rx="9" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="640.0" y="476" font-size="19" fill="#53657d" font-weight="500" text-anchor="middle">8</text>
<text x="260.0" y="502" font-size="19" fill="#ae5515" font-weight="700" text-anchor="middle">t</text>
<line x1="447" y1="386" x2="447" y2="510" stroke="#2664ce" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="442" y="530" font-size="19" fill="#2664ce" font-weight="700" text-anchor="end">A 마감</text>
<line x1="599" y1="386" x2="599" y2="510" stroke="#ae5515" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="594" y="530" font-size="19" fill="#ae5515" font-weight="700" text-anchor="end">B 마감</text>
<rect x="28" y="564" width="664" height="110" rx="12" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="360" y="598" font-size="21" fill="#147d69" font-weight="700" text-anchor="middle">A는 원래 3에 처리할 수 있음</text>
<text x="360" y="630" font-size="21" fill="#147d69" font-weight="700" text-anchor="middle">B는 마감 7 ≥ A의 마감 5 → 5에도 처리할 수 있음</text>
<text x="360" y="660" font-size="20" fill="#147d69" font-weight="600" text-anchor="middle">처리 개수 그대로 → 지금 A를 처리해도 손해 없음</text>
</svg>
