<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 594" role="img" aria-labelledby="title desc">
<title id="title">강의실 배정: 동시에 겹치는 수가 하한</title><desc id="desc">강의 1[1,4), 2[2,5), 3[3,6), 4[6,8)에서 시각 3부터 4 사이에 강의 1, 2, 3이 동시에 진행되므로 방이 최소 3개 필요합니다. 강의 4는 강의 1이 끝난 방 1을 다시 씁니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="592" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">강의실 배정: 동시에 겹치는 수가 하한</text>
<text x="28" y="86" font-size="21" fill="#53657d" font-weight="400" text-anchor="start">시작 순서로 보며 끝난 방이 있으면 재사용</text>
<rect x="20" y="104" width="680" height="380" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="100" y="452" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">0</text>
<line x1="100" y1="150" x2="100" y2="428" stroke="#eef2f7" stroke-width="1.5" stroke-linecap="round"/>
<text x="172" y="452" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">1</text>
<line x1="172" y1="150" x2="172" y2="428" stroke="#eef2f7" stroke-width="1.5" stroke-linecap="round"/>
<text x="244" y="452" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">2</text>
<line x1="244" y1="150" x2="244" y2="428" stroke="#eef2f7" stroke-width="1.5" stroke-linecap="round"/>
<text x="316" y="452" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">3</text>
<line x1="316" y1="150" x2="316" y2="428" stroke="#eef2f7" stroke-width="1.5" stroke-linecap="round"/>
<text x="388" y="452" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">4</text>
<line x1="388" y1="150" x2="388" y2="428" stroke="#eef2f7" stroke-width="1.5" stroke-linecap="round"/>
<text x="460" y="452" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">5</text>
<line x1="460" y1="150" x2="460" y2="428" stroke="#eef2f7" stroke-width="1.5" stroke-linecap="round"/>
<text x="532" y="452" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">6</text>
<line x1="532" y1="150" x2="532" y2="428" stroke="#eef2f7" stroke-width="1.5" stroke-linecap="round"/>
<text x="604" y="452" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">7</text>
<line x1="604" y1="150" x2="604" y2="428" stroke="#eef2f7" stroke-width="1.5" stroke-linecap="round"/>
<text x="676" y="452" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">8</text>
<line x1="676" y1="150" x2="676" y2="428" stroke="#eef2f7" stroke-width="1.5" stroke-linecap="round"/>
<rect x="316" y="138" width="72" height="290" rx="8" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="352.0" y="172" font-size="21" fill="#147d69" font-weight="750" text-anchor="middle">3개</text>
<text x="352.0" y="196" font-size="20" fill="#147d69" font-weight="700" text-anchor="middle">동시</text>
<text x="36" y="250" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">방 1</text>
<text x="36" y="314" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">방 2</text>
<text x="36" y="378" font-size="20" fill="#172b45" font-weight="700" text-anchor="start">방 3</text>
<rect x="174" y="224" width="212" height="40" rx="9" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="280.0" y="251" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">강의 1</text>
<rect x="246" y="288" width="212" height="40" rx="9" fill="#e5f4ef" stroke="#147d69" stroke-width="2.5"/>
<text x="352.0" y="315" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">강의 2</text>
<rect x="318" y="352" width="212" height="40" rx="9" fill="#fdf0e3" stroke="#ae5515" stroke-width="2.5"/>
<text x="424.0" y="379" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">강의 3</text>
<rect x="534" y="224" width="140" height="40" rx="9" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="604.0" y="251" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">강의 4</text>
<text x="36" y="130" font-size="20" fill="#53657d" font-weight="700" text-anchor="start">방 번호별 배치</text>
<rect x="28" y="500" width="664" height="74" rx="12" fill="#e5f4ef" stroke="#c4e5dc" stroke-width="1.5"/>
<text x="360" y="532" font-size="21" fill="#147d69" font-weight="750" text-anchor="middle">시각 3~4에 강의 1, 2, 3이 동시에 진행 → 최소 3개 방</text>
<text x="360" y="562" font-size="20" fill="#147d69" font-weight="600" text-anchor="middle">강의 4는 끝난 방 1을 재사용 → 3개로 충분</text>
</svg>
