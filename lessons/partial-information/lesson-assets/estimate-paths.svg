<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" role="img" aria-labelledby="title desc">
<title id="title">모르는 칸의 값 E에 따라 바뀌는 4걸음 계획</title>
<desc id="desc">5 곱하기 5 격자의 시작 직후 지도입니다. 아는 칸만 도는 경로 K는 값이 E와 무관하게 5이고, 오른쪽으로 곧게 가는 경로 U는 3 더하기 2E입니다. E가 1보다 작으면 K, 크면 U가 더 좋은 계획입니다.</desc>
