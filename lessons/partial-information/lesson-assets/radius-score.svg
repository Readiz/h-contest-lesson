<title id="title">보이는 거리와 점수</title>
<desc id="desc">보이는 거리를 0, 1, 2, 3, 4, 5, 전체로 늘릴 때 점수(10번째로 작은 값)입니다. 0 122, 1 224, 2 259, 3 258, 4 272, 5 273, 전체 280으로 거리 0에서 1, 2로 갈 때 크게 오르고 그 뒤는 완만합니다.</desc>
