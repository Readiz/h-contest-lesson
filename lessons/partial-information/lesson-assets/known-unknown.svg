<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" aria-labelledby="title desc">
<title id="title">세 걸음 뒤 거울의 세 가지 칸</title>
<desc id="desc">5 곱하기 5 격자에서 왼쪽 위에서 오른쪽으로 두 걸음, 아래로 한 걸음 걸은 뒤의 거울입니다. 현재 칸에서 거리 2 이내의 칸은 지금 보이고, 그보다 먼저 보았지만 지금은 안 보이는 칸은 값과 마지막으로 본 걸음 번호를 기억하며, 한 번도 못 본 칸은 값을 모르는 칸으로 표시합니다.</desc>
