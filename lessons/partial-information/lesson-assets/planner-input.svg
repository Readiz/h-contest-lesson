<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="title desc">
<title id="title">planBeam에 진짜 지도 또는 추정 지도를 넣는 두 경우</title>
<desc id="desc">planBeam은 값 지도와 밟은 칸을 받아 경로를 돌려준다. 왼쪽 입력은 채점기의 진짜 값 지도로, planFull이 T걸음을 한 번에 계획하면 전체 정보 기준선이다. 오른쪽 입력은 buildMap이 거울에서 만든 추정 지도로, 아는 칸은 본 값이고 모르는 칸은 추정값이며 replan이 계획하면 부분 정보의 계획이다. planBeam은 지도가 진짜인지 추정인지 알지 못한다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#53657d"/></marker></defs>
<rect x="1" y="1" width="718" height="422" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">계획기는 지도의 출처를 모른다</text>
<text x="28" y="84" font-size="20" fill="#53657d">같은 planBeam에 어떤 지도를 넣느냐로 두 설정이 갈립니다</text>
<rect x="28" y="112" width="324" height="124" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="42" y="140" font-size="19" fill="#172b45" font-weight="700">진짜 값 지도</text>
<text x="42" y="168" font-size="18" fill="#172b45">채점기의 v[] × 100</text>
<text x="42" y="194" font-size="18" fill="#172b45">planFull이 한 번에 계획</text>
<text x="42" y="220" font-size="18" fill="#172b45">→ 전체 정보 기준선</text>
<rect x="368" y="112" width="324" height="124" rx="10" fill="#ae5515" fill-opacity="0.12" stroke="#ae5515" stroke-width="2"/>
<text x="382" y="140" font-size="19" fill="#172b45" font-weight="700">추정 지도</text>
<text x="382" y="168" font-size="18" fill="#172b45">buildMap이 거울에서 만든다</text>
<text x="382" y="194" font-size="18" fill="#172b45">아는 칸 = 본 값, 모르는 칸 = 추정</text>
<text x="382" y="220" font-size="18" fill="#172b45">→ 부분 정보의 계획 (replan)</text>
<line x1="190" y1="238" x2="190" y2="270" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="530" y1="238" x2="530" y2="270" stroke="#53657d" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="28" y="272" width="664" height="124" rx="10" fill="#2664ce" fill-opacity="0.12" stroke="#2664ce" stroke-width="2"/>
<text x="42" y="300" font-size="19" fill="#172b45" font-weight="700">planBeam</text>
<text x="42" y="328" font-size="18" fill="#172b45">입력: 값 지도 val100[]와 밟은 칸 stepped[]</text>
<text x="42" y="354" font-size="18" fill="#172b45">지도가 진짜인지 추정인지 모른다</text>
<text x="42" y="380" font-size="18" fill="#172b45">출력: 경로 path[]와 평가한 후보 수 evals</text>
</svg>
