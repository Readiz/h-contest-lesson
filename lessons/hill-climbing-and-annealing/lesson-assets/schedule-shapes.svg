<text x="100" y="322.7" font-size="16" fill="#53657d" text-anchor="end">25</text>
<line x1="110" y1="223.3" x2="680" y2="223.3" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="100" y="229.3" font-size="16" fill="#53657d" text-anchor="end">50</text>
<line x1="110" y1="130.0" x2="680" y2="130.0" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="100" y="136.0" font-size="16" fill="#53657d" text-anchor="end">75</text>
