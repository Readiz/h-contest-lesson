<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">온도 일정은 예산의 비율로 정한다</text>
<text x="28" y="84" font-size="20" fill="#53657d">시작 온도 68.9, 끝 온도 3.6 (순서 틀의 정한 온도)</text>
