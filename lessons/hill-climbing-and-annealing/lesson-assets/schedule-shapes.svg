<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">온도 일정은 예산의 비율로 정한다</title>
<desc id="desc">평가 예산을 0에서 100%까지 쓰는 동안 온도가 68.9에서 3.6까지 내려가는 두 일정입니다. 지수 일정은 같은 비율로 줄어 예산의 절반에서 15.8이고, 선형 일정은 직선으로 줄어 절반에서 36.3입니다. 지수 일정은 낮은 온도에서 더 오래 머뭅니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
