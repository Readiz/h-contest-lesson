<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">같은 평가 횟수를 쓰는 세 방법</title>
<desc id="desc">순서 틀의 평가 예산 1,000,000을 쓰는 방법 셋입니다. 언덕 오르기 한 번은 평균 117,861번째 평가에서 지역 최적에 닿아 멈추고 남은 예산을 쓰지 못합니다. 재시작은 지역 최적마다 새 시작 해에서 다시 올라 시드 20개의 중앙값 9번 시작합니다. 담금질은 표본 2,000번 뒤 예산 전체를 한 번의 탐색에 씁니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="428" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">같은 평가 횟수를 쓰는 세 방법</text>
<text x="28" y="84" font-size="20" fill="#53657d">순서 틀, 평가 예산 1,000,000 (막대의 길이가 평가 횟수)</text>
<rect x="40" y="128" width="640" height="34" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.5"/>
<rect x="40" y="128" width="75.4" height="34" rx="6" fill="#2664ce"/>
<text x="40" y="120" font-size="20" fill="#172b45" font-weight="700">언덕 오르기 한 번</text>
<text x="127.4" y="152" font-size="18" fill="#53657d">남은 예산은 쓸 수 없다</text>
<text x="40" y="184" font-size="18" fill="#2664ce">117,861번째 평가에서 지역 최적</text>
<text x="40" y="232" font-size="20" fill="#172b45" font-weight="700">재시작 (9번)</text>
<rect x="40.0" y="244" width="71.1" height="34" fill="#2664ce" stroke="#f6f8fc" stroke-width="3"/>
<rect x="111.1" y="244" width="71.1" height="34" fill="#5f8fdc" stroke="#f6f8fc" stroke-width="3"/>
<rect x="182.2" y="244" width="71.1" height="34" fill="#2664ce" stroke="#f6f8fc" stroke-width="3"/>
<rect x="253.3" y="244" width="71.1" height="34" fill="#5f8fdc" stroke="#f6f8fc" stroke-width="3"/>
<rect x="324.4" y="244" width="71.1" height="34" fill="#2664ce" stroke="#f6f8fc" stroke-width="3"/>
<rect x="395.6" y="244" width="71.1" height="34" fill="#5f8fdc" stroke="#f6f8fc" stroke-width="3"/>
<rect x="466.7" y="244" width="71.1" height="34" fill="#2664ce" stroke="#f6f8fc" stroke-width="3"/>
<rect x="537.8" y="244" width="71.1" height="34" fill="#5f8fdc" stroke="#f6f8fc" stroke-width="3"/>
<rect x="608.9" y="244" width="71.1" height="34" fill="#2664ce" stroke="#f6f8fc" stroke-width="3"/>
<text x="40" y="300" font-size="18" fill="#53657d">지역 최적마다 새 시작 해에서 다시 오른다(길이는 같게 그림)</text>
<text x="40" y="348" font-size="20" fill="#172b45" font-weight="700">담금질 (한 번)</text>
<rect x="40" y="360" width="5.3" height="34" fill="#ae5515"/>
<rect x="45.3" y="360" width="634.7" height="34" fill="#2664ce"/>
<text x="40" y="416" font-size="18" fill="#53657d">온도 표본 2,000번(주황), 나머지 전부가 한 번의 탐색(파랑)</text>
</svg>
