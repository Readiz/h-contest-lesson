<line x1="608.2" y1="212" x2="608.2" y2="228" stroke="#ffffff" stroke-width="3"/>
<text x="526.3" y="226" font-size="16" fill="#53657d" text-anchor="end">366 · 1,138 · 2,078</text>
<text x="28" y="266" font-size="18" fill="#172b45">정한 온도</text>
