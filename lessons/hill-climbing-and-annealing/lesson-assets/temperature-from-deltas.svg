<rect x="422.8" y="172" width="180.3" height="16" rx="4" fill="#2664ce" opacity="0.85"/>
<line x1="539.4" y1="172" x2="539.4" y2="188" stroke="#ffffff" stroke-width="3"/>
<text x="414.8" y="186" font-size="16" fill="#53657d" text-anchor="end">66 · 396 · 1,052</text>
