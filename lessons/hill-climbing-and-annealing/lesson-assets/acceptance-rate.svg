<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 507" role="img" aria-labelledby="title desc">
<title id="title">구간별로 받은 나쁜 이동의 비율</title>
<desc id="desc">예산을 10등분한 구간마다 나쁜 이동을 제안했을 때 받은 비율입니다. 순서 틀은 첫 구간 1.7%에서 마지막 구간 0.0%로, 배정 틀은 9.4%에서 0.2%로 온도가 내려가며 단조롭게 줄어듭니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="505" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">구간별로 받은 나쁜 이동의 비율</text>
<text x="28" y="84" font-size="19" fill="#53657d">예산을 10등분해 구간마다 (받은 수 / 제안한 수)를 셌습니다. 온도가</text>
<text x="28" y="109" font-size="19" fill="#53657d">내려가며 줄어야 합니다</text>
