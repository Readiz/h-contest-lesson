<text x="502" y="965" class="label" style="fill:#087f73" text-anchor="end">참</text>
<path d="M77 1017L459 1017" fill="none" stroke="#c4cfdb" stroke-width="1.5"/>
<path d="M77 1017L332 1017" fill="none" stroke="#2563eb" stroke-width="6"/>
<path d="M205 1017L459 1017" fill="none" stroke="#087f73" stroke-width="3"/>
<circle cx="77" cy="1017" r="6" fill="#2563eb"/>
<text x="77" y="1050" class="small" style="fill:#2563eb" text-anchor="middle">A(0,0)</text>
<circle cx="205" cy="1017" r="6" fill="#087f73"/>
<text x="205" y="1050" class="small" style="fill:#087f73" text-anchor="middle">C(2,0)</text>
<circle cx="332" cy="1017" r="6" fill="#2563eb"/>
<text x="332" y="1050" class="small" style="fill:#2563eb" text-anchor="middle">B(4,0)</text>
<circle cx="459" cy="1017" r="6" fill="#087f73"/>
