<circle cx="188" cy="1218" r="6" fill="#2563eb"/>
<text x="188" y="1253" class="small" style="fill:#2563eb" text-anchor="middle">B(1,0)</text>
<circle cx="350" cy="1218" r="6" fill="#087f73"/>
<text x="350" y="1253" class="small" style="fill:#087f73" text-anchor="middle">C(3,0)</text>
<circle cx="462" cy="1218" r="6" fill="#087f73"/>
<text x="462" y="1253" class="small" style="fill:#087f73" text-anchor="middle">D(4,0)</text>
</svg>
