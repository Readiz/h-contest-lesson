<rect x="310" y="318" width="56" height="56" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1"/>
<text x="114.0" y="142" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="middle">0</text>
<text x="170.0" y="142" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="middle">1</text>
<text x="226.0" y="142" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="middle">2</text>
<text x="282.0" y="142" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="middle">3</text>
<text x="338.0" y="142" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="middle">4</text>
<text x="76" y="184.0" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="end">0</text>
<text x="76" y="240.0" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="end">1</text>
<text x="76" y="296.0" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="end">2</text>
<text x="76" y="352.0" font-size="18" fill="#4a5d78" font-weight="400" text-anchor="end">3</text>
<line x1="142" y1="146" x2="142" y2="378" stroke="#c4510c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="142" y="400" font-size="18" fill="#c4510c" font-weight="700" text-anchor="middle">c0</text>
<line x1="198" y1="146" x2="198" y2="378" stroke="#c4510c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="198" y="400" font-size="18" fill="#c4510c" font-weight="700" text-anchor="middle">c1</text>
<line x1="254" y1="146" x2="254" y2="378" stroke="#c4510c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="254" y="400" font-size="18" fill="#c4510c" font-weight="700" text-anchor="middle">c2</text>
<line x1="310" y1="146" x2="310" y2="378" stroke="#c4510c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="310" y="400" font-size="18" fill="#c4510c" font-weight="700" text-anchor="middle">c3</text>
<line x1="82" y1="206" x2="370" y2="206" stroke="#c4510c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="38" y="212" font-size="18" fill="#c4510c" font-weight="700" text-anchor="start">r0</text>
<line x1="82" y1="262" x2="370" y2="262" stroke="#c4510c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="38" y="268" font-size="18" fill="#c4510c" font-weight="700" text-anchor="start">r1</text>
<line x1="82" y1="318" x2="370" y2="318" stroke="#c4510c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="38" y="324" font-size="18" fill="#c4510c" font-weight="700" text-anchor="start">r2</text>
<circle cx="114.0" cy="178.0" r="17.9" fill="#2664ce"/>
<text x="114.0" y="184.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">A</text>
<circle cx="338.0" cy="178.0" r="17.9" fill="#2664ce"/>
<text x="338.0" y="184.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">B</text>
<circle cx="114.0" cy="346.0" r="17.9" fill="#2664ce"/>
<text x="114.0" y="352.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">C</text>
<circle cx="338.0" cy="346.0" r="17.9" fill="#2664ce"/>
<text x="338.0" y="352.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">D</text>
<circle cx="226.0" cy="234.0" r="17.9" fill="#2664ce"/>
<text x="226.0" y="240.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">E</text>
<text x="38" y="440" font-size="19" fill="#172b45" font-weight="400" text-anchor="start">경계마다 (한쪽 개수 × 반대쪽 개수)를</text>
<text x="38" y="470" font-size="19" fill="#172b45" font-weight="400" text-anchor="start">더하면 모든 쌍의 거리 합입니다.</text>
<text x="38" y="510" font-size="19" fill="#4a5d78" font-weight="400" text-anchor="start">쌍 10개를 하나씩 더한 값도 42</text>
<text x="400" y="110" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">열 경계: 왼쪽 × 오른쪽</text>
<text x="400" y="148" font-size="20" fill="#c4510c" font-weight="700" text-anchor="start">c0</text>
<text x="450" y="148" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">2 × 3 = 6</text>
<text x="400" y="180" font-size="20" fill="#c4510c" font-weight="700" text-anchor="start">c1</text>
<text x="450" y="180" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">2 × 3 = 6</text>
<text x="400" y="212" font-size="20" fill="#c4510c" font-weight="700" text-anchor="start">c2</text>
<text x="450" y="212" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">3 × 2 = 6</text>
<text x="400" y="244" font-size="20" fill="#c4510c" font-weight="700" text-anchor="start">c3</text>
<text x="450" y="244" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">3 × 2 = 6</text>
<text x="660" y="272" font-size="20" fill="#172b45" font-weight="700" text-anchor="end">합 24</text>
<text x="400" y="324" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">행 경계: 위 × 아래</text>
<text x="400" y="362" font-size="20" fill="#c4510c" font-weight="700" text-anchor="start">r0</text>
<text x="450" y="362" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">2 × 3 = 6</text>
<text x="400" y="394" font-size="20" fill="#c4510c" font-weight="700" text-anchor="start">r1</text>
<text x="450" y="394" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">3 × 2 = 6</text>
<text x="400" y="426" font-size="20" fill="#c4510c" font-weight="700" text-anchor="start">r2</text>
<text x="450" y="426" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">3 × 2 = 6</text>
<text x="660" y="454" font-size="20" fill="#172b45" font-weight="700" text-anchor="end">합 18</text>
<rect x="392" y="474" width="292" height="44" rx="10" fill="#eaf1fd" stroke="#2664ce" stroke-width="1.5"/>
<text x="538" y="504" font-size="24" fill="#172b45" font-weight="750" text-anchor="middle">24 + 18 = 42</text>
</svg>
