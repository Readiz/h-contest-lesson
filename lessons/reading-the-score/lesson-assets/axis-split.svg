<rect x="310" y="262" width="56" height="56" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1"/>
<rect x="86" y="318" width="56" height="56" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1"/>
