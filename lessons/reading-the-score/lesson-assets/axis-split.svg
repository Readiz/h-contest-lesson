<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">손계산 예시: 엔트로피 42를 열 경계와 행 경계로 나누기</title>
<desc id="desc">4행 5열 격자에 입자 A(0,0), B(0,4), C(3,0), D(3,4), E(1,2)가 있습니다. 열 경계 4개의 왼쪽 수 곱하기 오른쪽 수가 각각 6, 6, 6, 6으로 합 24이고, 행 경계 3개가 각각 6, 6, 6으로 합 18입니다. 둘을 더한 42가 모든 쌍의 맨해튼 거리 합과 같습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="558" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">엔트로피 42를 경계별로 나누기</text>
<rect x="20" y="76" width="680" height="460" rx="12" fill="#ffffff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="38" y="110" font-size="22" fill="#172b45" font-weight="700" text-anchor="start">입자 5개, 4행 5열</text>
