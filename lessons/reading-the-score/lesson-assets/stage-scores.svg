<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 485" role="img" aria-labelledby="title desc">
<title id="title">단계별 점수 합</title>
<desc id="desc">단계별 10개 TC 점수 합입니다. 0단계 기준선 73,687, 1단계 중앙으로 밀기 609,779, 2단계 차분 탐욕 1,756,585, 3단계 큰 이득부터 1,776,636, 4단계 빈 칸 경로 1,908,789, 5단계 목표 짝짓기 1,918,179, 통과 기준 1,917,000입니다. 4단계는 통과 기준에 8,211점 모자라고 5단계는 1,179점 넘습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="483" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">단계별 점수 합</text>
<text x="28" y="84" font-size="19" fill="#53657d">공개 채점기 10개 TC의 점수 합입니다. 점수는 같은 입력에서 항상 같고,</text>
<text x="28" y="109" font-size="19" fill="#53657d">회색 막대는 통과 기준입니다</text>
<text x="28" y="165" font-size="19" fill="#172b45">0단계 기준선</text>
<rect x="225.3" y="145" width="13.7" height="26" fill="#2664ce"/>
<text x="247.1" y="165" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">73,687</text>
<text x="28" y="205" font-size="19" fill="#172b45">1단계 중앙으로 밀기</text>
<rect x="225.3" y="185" width="113.6" height="26" fill="#2664ce"/>
<text x="346.9" y="205" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">609,779</text>
<text x="28" y="245" font-size="19" fill="#172b45">2단계 차분 탐욕</text>
<rect x="225.3" y="225" width="327.2" height="26" fill="#2664ce"/>
<text x="560.5" y="245" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1,756,585</text>
<text x="28" y="285" font-size="19" fill="#172b45">3단계 큰 이득부터</text>
<rect x="225.3" y="265" width="330.9" height="26" fill="#2664ce"/>
<text x="564.2" y="285" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1,776,636</text>
<text x="28" y="325" font-size="19" fill="#172b45">4단계 빈 칸 경로</text>
<rect x="225.3" y="305" width="355.5" height="26" fill="#2664ce"/>
<text x="588.9" y="325" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1,908,789</text>
<text x="28" y="365" font-size="19" fill="#172b45" font-weight="700">5단계 목표 짝짓기</text>
<rect x="225.3" y="345" width="357.3" height="26" fill="#ae5515"/>
<text x="590.6" y="365" font-size="17" fill="#172b45" font-weight="700" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1,918,179</text>
<text x="28" y="405" font-size="19" fill="#172b45">통과 기준</text>
<rect x="225.3" y="385" width="357" height="26" fill="#c3cddb"/>
<text x="590.4" y="405" font-size="17" fill="#172b45" stroke="#f6f8fc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1,917,000</text>
<line x1="225.3" y1="139" x2="225.3" y2="419" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="225.3" y="441" font-size="16" fill="#53657d" text-anchor="middle">0</text>
<line x1="318.5" y1="139" x2="318.5" y2="419" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="411.6" y1="139" x2="411.6" y2="419" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="411.6" y="441" font-size="16" fill="#53657d" text-anchor="middle">1,000,000</text>
<line x1="504.7" y1="139" x2="504.7" y2="419" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="597.9" y1="139" x2="597.9" y2="419" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="597.9" y="441" font-size="16" fill="#53657d" text-anchor="middle">2,000,000</text>
<line x1="225.3" y1="139" x2="225.3" y2="419" stroke="#53657d" stroke-width="1.5"/>
<text x="360" y="469" font-size="17" fill="#53657d" text-anchor="middle">점수 합 ↑ (클수록 좋음)</text>
</svg>
