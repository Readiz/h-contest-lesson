<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
<title id="title">음수 사이클의 영향은 앞으로 퍼집니다</title><desc id="desc">0에서 도달하는 1과 2의 사이클 비용은 -2입니다. 그 뒤 정점 3도 거리가 무한히 작아지지만 0의 거리는 0입니다.</desc>
<defs><marker id="ar-9fb0c6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#9fb0c6"/></marker><marker id="ar-ae5515" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ae5515"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="578" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">음수 사이클의 영향은 앞으로 퍼집니다</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">출발점 0에서 닿는 음수 사이클</text>
<rect x="28" y="108" width="664" height="250" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="138" y1="170" x2="288" y2="170" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-9fb0c6)"/>
<text x="215" y="154" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">+2</text>
<line x1="306" y1="198" x2="306" y2="268" stroke="#ae5515" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-ae5515)"/>
<line x1="334" y1="272" x2="334" y2="202" stroke="#ae5515" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-ae5515)"/>
<text x="268" y="242" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">−3</text>
<text x="374" y="242" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">+1</text>
<line x1="348" y1="300" x2="558" y2="300" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-9fb0c6)"/>
<text x="455" y="282" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">+4</text>
<circle cx="110" cy="170" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="110" y="177" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<circle cx="320" cy="170" r="26" fill="#fee2e2" stroke="#b42318" stroke-width="2"/>
<text x="320" y="177" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<circle cx="320" cy="300" r="26" fill="#fee2e2" stroke="#b42318" stroke-width="2"/>
<text x="320" y="307" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<circle cx="590" cy="300" r="26" fill="#fee2e2" stroke="#b42318" stroke-width="2"/>
<text x="590" y="307" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<rect x="28" y="378" width="664" height="54" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="1.5"/>
<text x="46" y="412" font-size="20" fill="#172b45" font-weight="700">1 → 2 → 1: 한 바퀴마다 비용 −2</text>
<circle cx="40" cy="470.0" r="4" fill="#147d69"/>
<text x="56" y="476" font-size="20" fill="#172b45">1, 2뿐 아니라 그 뒤의 3도 하한이 없습니다.</text>
<circle cx="40" cy="508.0" r="4" fill="#147d69"/>
<text x="56" y="514" font-size="20" fill="#172b45">0으로 돌아오는 경로는 없어 dist[0]=0</text>
<circle cx="40" cy="546.0" r="4" fill="#147d69"/>
<text x="56" y="552" font-size="20" fill="#172b45">출발점에서 못 닿는 사이클은 별도로 구분</text>
</svg>
