<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">음수 사이클의 영향은 앞으로 퍼집니다</title><desc id="desc">0에서 도달하는1과2의 사이클 비용은-2입니다. 그 뒤 정점3도 거리가 무한히 작아지지만0의 거리는0입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="590" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">음수 사이클의 영향은 앞으로 퍼집니다</text><text x="24" y="90" font-size="24" fill="#18324f">출발점 0에서 닿는 음수 사이클</text><circle cx="70" cy="165" r="27" fill="#dbeafe" stroke="#607b98"/><text x="70" y="173" text-anchor="middle" font-size="24">0</text><circle cx="265" cy="165" r="27" fill="#fee2e2" stroke="#607b98"/><text x="265" y="173" text-anchor="middle" font-size="24">1</text><circle cx="265" cy="310" r="27" fill="#fee2e2" stroke="#607b98"/><text x="265" y="318" text-anchor="middle" font-size="24">2</text><circle cx="505" cy="310" r="27" fill="#fee2e2" stroke="#607b98"/><text x="505" y="318" text-anchor="middle" font-size="24">3</text><path d="M99 165 L234 165" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="157" y="144" font-size="22" fill="#18324f">+2</text><path d="M243 188 L243 280" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M287 284 L287 193" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="253" font-size="22" fill="#18324f">−3</text><text x="304" y="253" font-size="22" fill="#18324f">+1</text><path d="M295 310 L474 310" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="290" font-size="22" fill="#18324f">+4</text><rect x="24" y="368" width="550" height="57" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="404.5" font-size="23" fill="#18324f">1 → 2 → 1: 한 바퀴마다 비용 −2</text><text x="24" y="464" font-size="22" fill="#18324f">1, 2뿐 아니라 그 뒤의 3도 하한이 없습니다.</text><text x="24" y="509" font-size="22" fill="#18324f">0으로 돌아오는 경로는 없어 dist[0]=0</text><text x="24" y="554" font-size="22" fill="#18324f">출발점에서 못 닿는 사이클은 별도로 구분</text></svg>
