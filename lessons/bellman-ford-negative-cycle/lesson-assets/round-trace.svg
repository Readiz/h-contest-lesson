<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 684" role="img" aria-labelledby="title desc">
<title id="title">Bellman-Ford: V번째 라운드에도 줄어듦</title><desc id="desc">0에서 닿는 그래프 0→1(+2), 1→2(−3), 2→1(+1), 2→3(+4)에서 간선을 이 순서로 완화합니다. dist는 시작 [0,INF,INF,INF], 1회 [0,0,-1,3], 2회 [0,-2,-3,1], 3회 [0,-4,-5,-1]이고 V=4번째 회차에도 [0,-6,-7,-3]으로 줄어들어 음수 사이클이 있음을 보여 줍니다.</desc>
<defs>
<marker id="ar-53657d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#53657d"/></marker>
<marker id="ar-ae5515" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ae5515"/></marker>
<marker id="ar-b42318" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#b42318"/></marker>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="682" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#b42318"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">Bellman-Ford: V번째 라운드에도 줄어듦</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">간선 순서: 0→1, 1→2, 2→1, 2→3</text>
<rect x="20" y="104" width="680" height="170" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<circle cx="90" cy="190" r="24" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="90" y="198" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<circle cx="250" cy="190" r="24" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="250" y="198" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<circle cx="410" cy="190" r="24" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="410" y="198" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<circle cx="570" cy="190" r="24" fill="#e9f0ff" stroke="#2664ce" stroke-width="2.5"/>
<text x="570" y="198" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<line x1="118" y1="190" x2="218" y2="190" stroke="#53657d" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-53657d)"/>
<text x="170.0" y="176" font-size="22" fill="#53657d" font-weight="700" text-anchor="middle">+2</text>
<line x1="278" y1="182" x2="378" y2="182" stroke="#ae5515" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-ae5515)"/>
<text x="330.0" y="168" font-size="22" fill="#ae5515" font-weight="700" text-anchor="middle">−3</text>
<line x1="382" y1="198" x2="282" y2="198" stroke="#b42318" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-b42318)"/>
<text x="330.0" y="228" font-size="22" fill="#b42318" font-weight="700" text-anchor="middle">+1</text>
<line x1="438" y1="190" x2="538" y2="190" stroke="#53657d" stroke-width="3" stroke-linecap="round" marker-end="url(#ar-53657d)"/>
<text x="490.0" y="176" font-size="22" fill="#53657d" font-weight="700" text-anchor="middle">+4</text>
<text x="330" y="140" font-size="21" fill="#b42318" font-weight="700" text-anchor="middle">1 → 2 → 1 한 바퀴 = −3 + 1 = −2</text>
<rect x="20" y="296" width="680" height="298" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="40" y="332" font-size="20" fill="#53657d" font-weight="700" text-anchor="start">라운드</text>
<text x="250" y="332" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">dist[0]</text>
<text x="370" y="332" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">dist[1]</text>
<text x="490" y="332" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">dist[2]</text>
<text x="610" y="332" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">dist[3]</text>
<text x="40" y="373" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">시작</text>
<text x="250" y="373" font-size="21" fill="#172b45" font-weight="500" text-anchor="middle">0</text>
<text x="370" y="373" font-size="21" fill="#172b45" font-weight="500" text-anchor="middle">INF</text>
<text x="490" y="373" font-size="21" fill="#172b45" font-weight="500" text-anchor="middle">INF</text>
<text x="610" y="373" font-size="21" fill="#172b45" font-weight="500" text-anchor="middle">INF</text>
<text x="40" y="419" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">1회</text>
<text x="250" y="419" font-size="21" fill="#172b45" font-weight="500" text-anchor="middle">0</text>
<text x="370" y="419" font-size="21" fill="#ae5515" font-weight="750" text-anchor="middle">0</text>
<text x="490" y="419" font-size="21" fill="#ae5515" font-weight="750" text-anchor="middle">−1</text>
<text x="610" y="419" font-size="21" fill="#ae5515" font-weight="750" text-anchor="middle">3</text>
<text x="40" y="465" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">2회</text>
<text x="250" y="465" font-size="21" fill="#172b45" font-weight="500" text-anchor="middle">0</text>
<text x="370" y="465" font-size="21" fill="#ae5515" font-weight="750" text-anchor="middle">−2</text>
<text x="490" y="465" font-size="21" fill="#ae5515" font-weight="750" text-anchor="middle">−3</text>
<text x="610" y="465" font-size="21" fill="#ae5515" font-weight="750" text-anchor="middle">1</text>
<text x="40" y="511" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">3회</text>
<text x="250" y="511" font-size="21" fill="#172b45" font-weight="500" text-anchor="middle">0</text>
<text x="370" y="511" font-size="21" fill="#ae5515" font-weight="750" text-anchor="middle">−4</text>
<text x="490" y="511" font-size="21" fill="#ae5515" font-weight="750" text-anchor="middle">−5</text>
<text x="610" y="511" font-size="21" fill="#ae5515" font-weight="750" text-anchor="middle">−1</text>
<rect x="28" y="528" width="664" height="42" rx="8" fill="#fdeaea" stroke="#f3c1bd" stroke-width="1.5"/>
<text x="40" y="557" font-size="21" fill="#b42318" font-weight="700" text-anchor="start">4회 = V</text>
<text x="250" y="557" font-size="21" fill="#172b45" font-weight="500" text-anchor="middle">0</text>
<text x="370" y="557" font-size="21" fill="#b42318" font-weight="750" text-anchor="middle">−6</text>
<text x="490" y="557" font-size="21" fill="#b42318" font-weight="750" text-anchor="middle">−7</text>
<text x="610" y="557" font-size="21" fill="#b42318" font-weight="750" text-anchor="middle">−3</text>
<rect x="28" y="608" width="664" height="54" rx="12" fill="#fdeaea" stroke="#f3c1bd" stroke-width="1.5"/>
<text x="360" y="642" font-size="21" fill="#b42318" font-weight="750" text-anchor="middle">V = 4번째에도 줄어듦 → 도달 가능한 음수 사이클</text>
</svg>
