<text x="28" y="84" font-size="19" fill="#53657d">정책 2 코드에서 한 줄씩 고친 변형의 10개 TC 점수 합입니다. 정상은 두</text>
<text x="28" y="109" font-size="19" fill="#53657d">값이 같습니다. 거절 요청은 세 경우 모두 0입니다</text>
