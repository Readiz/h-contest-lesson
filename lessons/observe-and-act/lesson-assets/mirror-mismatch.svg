<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 543" role="img" aria-labelledby="title desc">
<title id="title">실수하면 두 점수가 어긋난다</title>
<desc id="desc">정책 2 코드에서 한 줄씩 고친 세 실수의 채점기 점수 합과 거울 점수 합입니다. 정상은 둘 다 131,259입니다. seen 초기화 누락은 채점기 113,322, 거울 98,848이고 seen 갱신 누락은 채점기 20,030, 거울 161,665이고 nextDay 누락은 채점기 0, 거울 131,259이고 모두 두 값이 어긋나 점수 대조로 잡히며 거절 요청은 세 경우 모두 0입니다.</desc>
