<title id="title">세 층의 상태: 채점기 · 관측 기록 · 추정</title><desc id="desc">5×5 예시 지도에서 시작 칸 (2,1)에서 (2,2), (1,2) 순서로 두 번 이동한 상태입니다. 채점기는 방문 칸과 위치와 오늘 이동 횟수를 알고 있지만 제출 코드가 읽을 수 없습니다. 내 관측 기록은 내가 호출한 이동으로 쌓은 방문 표시와 위치와 남은 횟수입니다. 추정은 아직 가지 않은 목표 (0,3)까지의 경로 이득 71과 이동 2번입니다.</desc>
