<text x="125.5" y="437" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700">2일</text>
<text x="125.5" y="459" font-size="16" fill="#172b45" text-anchor="middle">10번</text>
<rect x="160" y="413" width="63" height="54" fill="#9db6e0"/>
<text x="191.5" y="437" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700">3일</text>
<text x="191.5" y="459" font-size="16" fill="#172b45" text-anchor="middle">10번</text>
<rect x="226" y="413" width="63" height="54" fill="#9db6e0"/>
<text x="257.5" y="437" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700">4일</text>
<text x="257.5" y="459" font-size="16" fill="#172b45" text-anchor="middle">10번</text>
<rect x="292" y="413" width="63" height="54" fill="#9db6e0"/>
<text x="323.5" y="437" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700">5일</text>
<text x="323.5" y="459" font-size="16" fill="#172b45" text-anchor="middle">10번</text>
<rect x="358" y="413" width="63" height="54" fill="#9db6e0"/>
<text x="389.5" y="437" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700">6일</text>
<text x="389.5" y="459" font-size="16" fill="#172b45" text-anchor="middle">10번</text>
<rect x="424" y="413" width="63" height="54" fill="#9db6e0"/>
<text x="455.5" y="437" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700">7일</text>
<text x="455.5" y="459" font-size="16" fill="#172b45" text-anchor="middle">10번</text>
<rect x="490" y="413" width="63" height="54" fill="#9db6e0"/>
<text x="521.5" y="437" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700">8일</text>
<text x="521.5" y="459" font-size="16" fill="#172b45" text-anchor="middle">10번</text>
<rect x="556" y="413" width="63" height="54" fill="#9db6e0"/>
<text x="587.5" y="437" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700">9일</text>
<text x="587.5" y="459" font-size="16" fill="#172b45" text-anchor="middle">10번</text>
<rect x="622" y="413" width="63" height="54" fill="#9db6e0"/>
<text x="653.5" y="437" font-size="17" fill="#172b45" text-anchor="middle" font-weight="700">10일</text>
<text x="653.5" y="459" font-size="16" fill="#172b45" text-anchor="middle">10번</text>
<text x="28" y="497" font-size="17" fill="#53657d">날짜 경계는 점수와 무관해 계획은 날짜를 모르고 act가 넘깁니다</text>
</svg>
