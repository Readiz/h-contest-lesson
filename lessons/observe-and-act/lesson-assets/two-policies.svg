<title id="title">같은 시작, 다른 첫 선택</title><desc id="desc">7×5 일부 지도에서 시작 칸 (2,3)과 이동 6번이 같을 때, 정책 1은 가까운 값 2를 따라 (2,2), (1,1), (0,0)을 거쳐 5번 이동해 7점을 얻습니다. 정책 2는 평가식 값 26.0이 가장 큰 (2,6)을 골라 3번 이동해 100점을 얻습니다.</desc>
