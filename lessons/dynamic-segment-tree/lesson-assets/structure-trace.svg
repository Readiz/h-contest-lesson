<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">동적 세그먼트 트리: 필요한 경로만</title><desc id="desc">[0,8)에서[5,6)에3을 더하면[0,8),[4,8),[4,6),[5,6) 네 노드만 생성됩니다. 다른 자식은0입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="590" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">동적 세그먼트 트리: 필요한 경로만</text><text x="24" y="89" font-size="24" fill="#18324f">초기값 0 / 루트 [0,8)에 add(5,6,+3)</text><rect x="208" y="119" width="184" height="49" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="220" y="151.5" font-size="24" fill="#18324f">[0,8): 합 3</text><path d="M245 169 L139 222" fill="none" stroke="#607b98" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M355 169 L458 222" fill="none" stroke="#607b98" stroke-width="2.5"/><rect x="40" y="226" width="190" height="49" rx="9" fill="#fff" stroke="#91a4b9"/><text x="52" y="258.5" font-size="22" fill="#18324f">[0,4): 미생성</text><rect x="374" y="226" width="190" height="49" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="386" y="258.5" font-size="22" fill="#18324f">[4,8): 합 3</text><path d="M428 276 L340 327" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M503 276 L524 327" fill="none" stroke="#607b98" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="247" y="331" width="170" height="49" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="259" y="363.5" font-size="22" fill="#18324f">[4,6): 합 3</text><rect x="435" y="331" width="149" height="49" rx="9" fill="#fff" stroke="#91a4b9"/><text x="447" y="363.5" font-size="19" fill="#18324f">[6,8): 없음</text><path d="M306 382 L234 429" fill="none" stroke="#607b98" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M359 382 L433 429" fill="none" stroke="#607b98" stroke-width="2.5"/><rect x="135" y="433" width="177" height="49" rx="9" fill="#fff" stroke="#91a4b9"/><text x="147" y="465.5" font-size="21" fill="#18324f">[4,5): 없음</text><rect x="355" y="433" width="210" height="49" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="367" y="465.5" font-size="22" fill="#18324f">[5,6): 합 3</text><text x="24" y="550" font-size="23" fill="#18324f">생성 노드 4개 / 빠진 자식의 합은 0</text></svg>
