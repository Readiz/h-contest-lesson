<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 527" role="img" aria-labelledby="title desc">
<title id="title">폭을 늘릴 때의 비용 (순서 문제)</title>
<desc id="desc">순서 문제에서 폭(로그 눈금)을 늘릴 때 시드 20개 중 10번째로 작은 비용입니다. 추정 없음은 폭 1의 15,917에서 폭 256의 16,526으로, 낙관적 합은 16,154에서 15,976으로 오르내리다 조금 줄고, 탐욕 완성은 폭 1에서 8까지 14,390에서 14,036로 줄어 모든 폭에서 가장 낮습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="525" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">폭을 늘릴 때의 비용 (순서 문제)</text>
<text x="28" y="84" font-size="19" fill="#53657d">N=200, 시드 20개 중 10번째로 작은 비용. 작을수록 좋습니다. 탐욕</text>
<text x="28" y="109" font-size="19" fill="#53657d">완성은 폭 8까지</text>
