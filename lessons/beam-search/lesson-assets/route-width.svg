<circle cx="181.9" cy="132" r="4.5" fill="#2664ce"/>
<text x="199.9" y="137" font-size="18" fill="#172b45">낙관적 합</text>
<line x1="315.8" y1="132" x2="335.8" y2="132" stroke="#ae5515" stroke-width="3.5"/>
