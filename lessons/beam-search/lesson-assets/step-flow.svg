<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 767" role="img" aria-labelledby="title desc">
<title id="title">빔 서치 한 단계의 흐름</title>
<desc id="desc">Beam::run의 for 한 바퀴입니다. 빔의 상태마다 p.evalChild로 후보를 평가하고, mergeSame과 capGroups로 같은 상태와 묶음 상한을 거르고, pickBest가 평가값 상위 width개를 남기며(refineK가 크면 p.refine을 거칩니다), 남은 후보만 p.apply로 상태를 만들고 logParent와 logAct에 (부모 번호, 행동)을 적습니다. a와 b를 바꿔 다음 단계로 가고, 단계가 끝나면 p.score가 큰 상태에서 거꾸로 경로를 복원합니다. 주황 상자(evalChild, refine, apply, score)가 문제마다 채우는 함수입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
<rect x="1" y="1" width="718" height="765" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="29" width="6" height="29" rx="3" fill="#2664ce"/>
<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">빔 서치 한 단계의 흐름</text>
<text x="28" y="84" font-size="19" fill="#53657d">Beam::run의 for 한 바퀴입니다. 파란 상자는 틀,</text>
<text x="28" y="109" font-size="19" fill="#53657d">주황 상자는 문제가 채우는 함수입니다</text>
<rect x="28" y="150" width="14" height="14" fill="#2664ce"/>
<text x="50" y="162" font-size="18" fill="#172b45">문제와 무관한 고정 부분</text>
<rect x="293.7" y="150" width="14" height="14" fill="#ae5515"/>
<text x="315.7" y="162" font-size="18" fill="#172b45">문제마다 채우는 함수</text>
<rect x="60" y="178" width="380" height="66" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="74" y="203" font-size="19" fill="#172b45" font-weight="700">빔 a[0..n)</text>
<text x="74" y="226" font-size="16" fill="#53657d">상태 n개. 처음에는 p.root 하나</text>
<line x1="250" y1="245" x2="250" y2="255" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,253 256,253 250,262" fill="#53657d"/>
<rect x="60" y="262" width="380" height="66" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="2"/>
<text x="74" y="287" font-size="19" fill="#172b45" font-weight="700">1 평가: p.evalChild</text>
<text x="74" y="310" font-size="16" fill="#53657d">상태 복사 없이 Cand를 채운다</text>
<line x1="250" y1="329" x2="250" y2="339" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,337 256,337 250,346" fill="#53657d"/>
<rect x="60" y="346" width="380" height="66" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="74" y="371" font-size="19" fill="#172b45" font-weight="700">2 합치기: mergeSame</text>
<text x="74" y="394" font-size="16" fill="#53657d">같은 키는 큰 평가값 하나만</text>
<line x1="250" y1="413" x2="250" y2="423" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,421 256,421 250,430" fill="#53657d"/>
<rect x="60" y="430" width="380" height="66" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="74" y="455" font-size="19" fill="#172b45" font-weight="700">3 추리기: pickBest</text>
<text x="74" y="478" font-size="16" fill="#53657d">평가값 상위 width개를 남긴다</text>
<line x1="250" y1="497" x2="250" y2="507" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,505 256,505 250,514" fill="#53657d"/>
<rect x="60" y="514" width="380" height="66" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="2"/>
<text x="74" y="539" font-size="19" fill="#172b45" font-weight="700">4 상태 만들기: p.apply</text>
<text x="74" y="562" font-size="16" fill="#53657d">남은 후보만 b[j]에 만든다</text>
<line x1="250" y1="581" x2="250" y2="591" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,589 256,589 250,598" fill="#53657d"/>
<rect x="60" y="598" width="380" height="66" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="74" y="623" font-size="19" fill="#172b45" font-weight="700">a와 b를 바꾼다</text>
<text x="74" y="646" font-size="16" fill="#53657d">d를 올려 위의 빔으로 돌아간다</text>
<line x1="250" y1="665" x2="250" y2="675" stroke="#53657d" stroke-width="2.5"/>
<polygon points="244,673 256,673 250,682" fill="#53657d"/>
<rect x="60" y="682" width="380" height="66" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="74" y="707" font-size="19" fill="#172b45" font-weight="700">d = steps가 되면: 경로 복원</text>
<text x="74" y="730" font-size="16" fill="#53657d">p.score가 큰 상태에서 거꾸로</text>
<rect x="470" y="346" width="222" height="66" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="484" y="371" font-size="19" fill="#172b45" font-weight="700">capGroups</text>
<text x="484" y="394" font-size="16" fill="#53657d">묶음마다 quota개만 남김</text>
<line x1="441" y1="379" x2="462" y2="379" stroke="#53657d" stroke-width="2.5"/>
<polygon points="461,373 461,385 470,379" fill="#53657d"/>
<rect x="470" y="430" width="222" height="66" rx="10" fill="#fdf0e3" stroke="#ae5515" stroke-width="2"/>
<text x="484" y="455" font-size="19" fill="#172b45" font-weight="700">p.refine (선택)</text>
<text x="484" y="478" font-size="16" fill="#53657d">refineK &gt; width일 때만</text>
<line x1="441" y1="463" x2="462" y2="463" stroke="#53657d" stroke-width="2.5"/>
<polygon points="461,457 461,469 470,463" fill="#53657d"/>
<rect x="470" y="514" width="222" height="66" rx="10" fill="#e3ecfa" stroke="#2664ce" stroke-width="2"/>
<text x="484" y="539" font-size="19" fill="#172b45" font-weight="700">logParent, logAct</text>
<text x="484" y="562" font-size="16" fill="#53657d">부모 번호와 행동만</text>
<line x1="441" y1="547" x2="462" y2="547" stroke="#53657d" stroke-width="2.5"/>
<polygon points="461,541 461,553 470,547" fill="#53657d"/>
<line x1="59" y1="631" x2="38" y2="631" stroke="#53657d" stroke-width="2.5"/>
<line x1="38" y1="631" x2="38" y2="211" stroke="#53657d" stroke-width="2.5"/>
<line x1="38" y1="211" x2="50" y2="211" stroke="#53657d" stroke-width="2.5"/>
<polygon points="50,205 50,217 59,211" fill="#53657d"/>
</svg>
