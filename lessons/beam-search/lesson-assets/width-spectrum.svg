<title id="title">폭에 따른 평가 횟수와 남는 후보</title>
<desc id="desc">분기 3, 깊이 3의 같은 트리에서 폭 1은 깊이마다 후보 3개를 평가해 1개만 남겨 평가가 9번입니다. 폭 2는 평가가 3, 6, 6번으로 15번이고 단계마다 두 후보만 남깁니다. 폭 무제한은 평가가 3, 9, 27번으로 39번이고 모든 후보를 남깁니다.</desc>
