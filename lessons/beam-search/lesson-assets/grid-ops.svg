<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 502" role="img" aria-labelledby="title desc">
<title id="title">같은 연산 수에서의 점수 (격자 수집)</title>
<desc id="desc">격자 수집에서 연산 수(평가 횟수와 추정이 살핀 칸의 합, 로그 눈금)를 가로로, 시드 20개 중 10번째로 작은 점수를 세로로 둔 그림입니다. 점은 폭 1, 2, 4, 8, 16, 64, 256, 1,024 순서입니다. 같은 연산 수에서는 추정 없음 곡선이 추정 있는 곡선보다 위에 있습니다. 예를 들어 가까운 값의 합 폭 1(연산 5,329, 점수 240)보다 추정 없음 폭 16(연산 3,538, 점수 281)이 더 적은 연산으로 더 높습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
