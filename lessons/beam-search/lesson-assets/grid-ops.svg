<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">같은 연산 수에서의 점수 (격자 수집)</text>
<text x="28" y="84" font-size="19" fill="#53657d">같은 실험을 평가 + 살핀 칸 수로 다시 그렸습니다. 점 하나가 폭 하나</text>
