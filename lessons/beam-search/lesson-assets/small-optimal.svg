<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 507" role="img" aria-labelledby="title desc">
<title id="title">작은 입력에서 최적에 닿은 시드 수</title>
<desc id="desc">점 10개의 순서 입력(시드 20개)에서 폭(로그 눈금)별로 최적에 닿은 시드의 수입니다. 폭 16에서 추정 없음은 10개, 낙관적 합(합침)은 18개, 낙관적 합(합치지 않음)은 15개입니다. 폭 256부터 모두 20개이고, 같은 폭에서 낙관적 합이 추정 없음보다 자주 최적에 닿습니다.</desc>
