<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750">작은 입력에서 최적에 닿은 시드 수</text>
<text x="28" y="84" font-size="19" fill="#53657d">점 10개 순서 입력, 시드 20개. 최적은 부분집합 DP로 따로 구했습니다.</text>
<text x="28" y="109" font-size="19" fill="#53657d">폭 1,536은 합칠 때 버리는 후보가 없습니다</text>
