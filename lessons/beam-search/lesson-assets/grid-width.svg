<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 502" role="img" aria-labelledby="title desc">
<title id="title">폭을 늘릴 때의 점수 (격자 수집)</title>
<desc id="desc">격자 수집에서 폭(로그 눈금)을 늘릴 때 시드 20개 중 10번째로 작은 점수입니다. 폭 1에서 추정 없음 109, 가까운 값의 합 240, 거리 벌점 220이고, 폭 1,024에서 각각 288, 295, 292입니다. 추정이 있으면 좁은 폭에서 크게 앞서고, 폭이 커지면 세 곡선이 가까워지며, 곡선은 중간에 오르내립니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}</style>
