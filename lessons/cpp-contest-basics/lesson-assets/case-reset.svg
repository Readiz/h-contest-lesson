<text x="46" y="164" font-size="20" fill="#172b45" font-weight="700">TC 1 종료</text>
<rect x="190" y="132" width="104" height="52" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="242" y="165" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<rect x="308" y="132" width="104" height="52" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="360" y="165" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<rect x="426" y="132" width="104" height="52" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="478" y="165" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<rect x="544" y="132" width="104" height="52" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="596" y="165" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<text x="190" y="218" font-size="20" fill="#147d69" font-weight="400">n=4 / 모든 활성 칸 사용</text>
