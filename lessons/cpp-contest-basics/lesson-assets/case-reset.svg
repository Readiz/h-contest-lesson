<text x="596" y="311" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">1</text>
<text x="190" y="364" font-size="20" fill="#53657d" font-weight="700">n=2 / 뒤의 두 칸은 읽지 않음</text>
<rect x="28" y="400" width="664" height="132" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
