<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 616" role="img" aria-labelledby="title desc">
<title id="title">TC가 작아졌다 다시 커질 때</title><desc id="desc">TC 크기 4에서 2로 줄면 뒤 두 칸은 남지만 읽지 않습니다. 다음 크기 4 TC 시작에 네 칸을 모두 초기화합니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="614" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">TC가 작아졌다 다시 커질 때</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">used 배열: 활성 구간만 초기화하는 예시</text>
