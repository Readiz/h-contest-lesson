<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">TC가 작아졌다 다시 커질 때</title><desc id="desc">TC 크기4에서2로 줄면 뒤 두 칸은 남지만 읽지 않습니다. 다음 크기4 TC 시작에 네 칸을 모두 초기화합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="600" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="27" fill="#18324f">TC가 작아졌다 다시 커질 때</text><text x="24" y="92" font-size="23" fill="#18324f">used 배열: 활성 구간만 초기화하는 예시</text><text x="24" y="145" font-size="23" fill="#18324f">TC 1 종료</text><rect x="180" y="113" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="192" y="148.5" font-size="24" fill="#18324f">1</text><rect x="275" y="113" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="287" y="148.5" font-size="24" fill="#18324f">1</text><rect x="370" y="113" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="382" y="148.5" font-size="24" fill="#18324f">1</text><rect x="465" y="113" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="477" y="148.5" font-size="24" fill="#18324f">1</text><text x="180" y="199" font-size="22" fill="#18324f">n=4 / 모든 활성 칸 사용</text><text x="24" y="275" font-size="23" fill="#18324f">TC 2 시작</text><rect x="180" y="243" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="192" y="278.5" font-size="24" fill="#18324f">0</text><rect x="275" y="243" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="287" y="278.5" font-size="24" fill="#18324f">0</text><rect x="370" y="243" width="80" height="55" rx="9" fill="#e2e8f0" stroke="#91a4b9"/><text x="382" y="278.5" font-size="24" fill="#18324f">1</text><rect x="465" y="243" width="80" height="55" rx="9" fill="#e2e8f0" stroke="#91a4b9"/><text x="477" y="278.5" font-size="24" fill="#18324f">1</text><text x="180" y="329" font-size="22" fill="#18324f">n=2 / 뒤의 두 칸은 읽지 않음</text><text x="24" y="405" font-size="23" fill="#18324f">TC 3 시작</text><rect x="180" y="373" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="192" y="408.5" font-size="24" fill="#18324f">0</text><rect x="275" y="373" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="287" y="408.5" font-size="24" fill="#18324f">0</text><rect x="370" y="373" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="382" y="408.5" font-size="24" fill="#18324f">0</text><rect x="465" y="373" width="80" height="55" rx="9" fill="#d1fae5" stroke="#91a4b9"/><text x="477" y="408.5" font-size="24" fill="#18324f">0</text><text x="180" y="459" font-size="22" fill="#18324f">n=4 / 모든 활성 칸 사용</text><text x="24" y="555" font-size="22" fill="#18324f">각 TC 시작에 resetCase(n), 행동 중에는 유지</text></svg>
