<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" role="img" aria-labelledby="title desc">
<title id="title">Floyd-Warshall: 경유지 하나를 허용</title><desc id="desc">0에서 2로 직접 10, 1을 거치면 3+4=7입니다. k=1 단계에서 중간 정점 1을 허용하며 갱신합니다.</desc>
<defs><marker id="ar-9fb0c6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#9fb0c6"/></marker><marker id="ar-ae5515" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ae5515"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="568" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">Floyd-Warshall: 경유지 하나를 허용</text>
<rect x="28" y="76" width="664" height="250" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<line x1="135.6" y1="238.7" x2="330.7" y2="152.9" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-9fb0c6)"/>
<line x1="385.6" y1="151.3" x2="580.7" y2="237.1" stroke="#9fb0c6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar-9fb0c6)"/>
<line x1="138" y1="250" x2="578" y2="250" stroke="#ae5515" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#ar-ae5515)"/>
<text x="212" y="178" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">3</text>
<text x="508" y="178" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<text x="360" y="288" font-size="20" fill="#ae5515" font-weight="700" text-anchor="middle">10</text>
<circle cx="110" cy="250" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="110" y="257" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">0</text>
<circle cx="360" cy="140" r="26" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="360" y="147" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<circle cx="610" cy="250" r="26" fill="#dbeafe" stroke="#9fb0c6" stroke-width="2"/>
<text x="610" y="257" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<rect x="28" y="346" width="664" height="52" rx="10" fill="#f2f6fb" stroke="#9fb0c6" stroke-width="1.5"/>
<text x="46" y="379" font-size="20" fill="#172b45" font-weight="700">k=0까지: dist[0][2] = 10</text>
<rect x="28" y="410" width="664" height="52" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="46" y="443" font-size="20" fill="#172b45" font-weight="700">k=1 허용: min(10, 3+4) = 7</text>
<circle cx="40" cy="500.0" r="4" fill="#147d69"/>
<text x="56" y="506" font-size="20" fill="#172b45">중간 정점으로 1을 쓸 수 있게 된 단계</text>
<circle cx="40" cy="538.0" r="4" fill="#147d69"/>
<text x="56" y="544" font-size="20" fill="#172b45">이 전제를 유지하려면 k가 가장 바깥 루프</text>
</svg>
