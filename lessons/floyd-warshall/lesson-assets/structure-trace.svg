<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">Floyd-Warshall: 경유지 하나를 허용</title><desc id="desc">0에서2로 직접10, 1을 거치면3+4=7입니다. k=1 단계에서 중간 정점1을 허용하며 갱신합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="590" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">Floyd-Warshall: 경유지 하나를 허용</text><circle cx="70" cy="195" r="27" fill="#dbeafe" stroke="#607b98"/><text x="70" y="203" text-anchor="middle" font-size="24">0</text><circle cx="300" cy="115" r="27" fill="#d1fae5" stroke="#607b98"/><text x="300" y="123" text-anchor="middle" font-size="24">1</text><circle cx="530" cy="195" r="27" fill="#dbeafe" stroke="#607b98"/><text x="530" y="203" text-anchor="middle" font-size="24">2</text><path d="M96 183 L269 126" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330 126 L502 183" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="168" y="139" font-size="24" fill="#18324f">3</text><text x="418" y="139" font-size="24" fill="#18324f">4</text><path d="M101 216 L499 216" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="287" y="255" font-size="24" fill="#18324f">10</text><rect x="24" y="316" width="550" height="57" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="352.5" font-size="24" fill="#18324f">k=0까지: dist[0][2] = 10</text><rect x="24" y="394" width="550" height="57" rx="9" fill="#e5effa" stroke="#91a4b9"/><text x="36" y="430.5" font-size="24" fill="#18324f">k=1 허용: min(10, 3+4) = 7</text><text x="24" y="508" font-size="23" fill="#18324f">중간 정점으로 1을 쓸 수 있게 된 단계</text><text x="24" y="552" font-size="22" fill="#18324f">이 전제를 유지하려면 k가 가장 바깥 루프</text></svg>
