<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">Skew Heap: 오른쪽 병합 후 교환</title><desc id="desc">루트2의 왼쪽7 오른쪽6인 힙과 단일5를 합칩니다. 결과는2의 왼쪽5 오른쪽7, 5의 왼쪽6입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607b98"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#18324f}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect width="600" height="610" rx="16" fill="#f5f8fc"/><text x="24" y="43" font-size="28" fill="#18324f">Skew Heap: 오른쪽 병합 후 교환</text><text x="24" y="89" font-size="24" fill="#18324f">merge(키 2의 힙, 키 5의 힙)</text><circle cx="175" cy="150" r="27" fill="#dbeafe" stroke="#607b98"/><text x="175" y="158" text-anchor="middle" font-size="24">2</text><circle cx="440" cy="150" r="27" fill="#dbeafe" stroke="#607b98"/><text x="440" y="158" text-anchor="middle" font-size="24">5</text><path d="M158 176 L105 220" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M192 176 L245 220" fill="none" stroke="#607b98" stroke-width="2.5"/><circle cx="95" cy="248" r="27" fill="#dbeafe" stroke="#607b98"/><text x="95" y="256" text-anchor="middle" font-size="24">7</text><circle cx="255" cy="248" r="27" fill="#dbeafe" stroke="#607b98"/><text x="255" y="256" text-anchor="middle" font-size="24">6</text><text x="315" y="245" font-size="22" fill="#18324f">오른쪽 6과</text><text x="315" y="280" font-size="22" fill="#18324f">5를 재귀 병합</text><path d="M300 305 L300 342" fill="none" stroke="#607b98" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="300" cy="385" r="27" fill="#d1fae5" stroke="#607b98"/><text x="300" y="393" text-anchor="middle" font-size="24">2</text><path d="M280 411 L200 449" fill="none" stroke="#607b98" stroke-width="2.5"/><path d="M320 411 L430 449" fill="none" stroke="#607b98" stroke-width="2.5"/><circle cx="185" cy="475" r="27" fill="#dbeafe" stroke="#607b98"/><text x="185" y="483" text-anchor="middle" font-size="24">5</text><circle cx="445" cy="475" r="27" fill="#dbeafe" stroke="#607b98"/><text x="445" y="483" text-anchor="middle" font-size="24">7</text><path d="M166 499 L124 529" fill="none" stroke="#607b98" stroke-width="2.5"/><circle cx="108" cy="550" r="27" fill="#dbeafe" stroke="#607b98"/><text x="108" y="558" text-anchor="middle" font-size="24">6</text><text x="235" y="550" font-size="22" fill="#18324f">병합 뒤 좌우 자식 교환</text></svg>
