<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" role="img" aria-labelledby="title desc">
<title id="title">0/1 배낭: 읽는 값이 다릅니다</title><desc id="desc">무게 2 가치 3인 물건 하나, 용량 4, 초기 dp는 모두 0입니다. 역방향 4 3 2는 아직 갱신하지 않은 작은 용량을 읽어 답 3을 얻습니다. 정방향 2 3 4는 이번 물건으로 갱신한 dp[2]=3을 다시 읽어 dp[4]=6을 만들어 같은 물건을 두 번 씁니다.</desc>
