<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">0/1 배낭: 읽는 값이 다릅니다</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">물건 하나: 무게 2 · 가치 3</text>
<text x="28" y="114" font-size="22" fill="#53657d" font-weight="400">용량 4 · 처음에는 모든 dp가 0</text>
