<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc"><title id="title">0/1 배낭: 큰 용량부터 갱신</title><desc id="desc">무게2 가치3 물건 하나를 정방향 갱신하면 두 번 써서6이 되지만 역방향은 이전 값만 읽어3입니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#172a46;font-size:21px}.small{font-size:18px}.title{font-size:28px;font-weight:700}.strong{font-weight:700}rect,line,path,circle{vector-effect:non-scaling-stroke}</style><rect width="720" height="500" rx="18" fill="#f5f8fc"/><text x="28" y="44" class="title">0/1 배낭: 큰 용량부터 갱신</text><text x="28" y="90" class="">한 물건: 무게 2, 가치 3 / 용량 4</text><text x="28" y="135" class="">잘못된 정방향: 같은 물건을 다시 사용</text><rect x="28" y="160" width="280" height="55" rx="8" fill="#fee2e2" stroke="#607999"/><text x="40" y="194.5" class="">dp[2] = dp[0]+3 = 3</text><rect x="360" y="160" width="332" height="55" rx="8" fill="#fee2e2" stroke="#607999"/><text x="372" y="194.5" class="">dp[4] = 새 dp[2]+3 = 6</text><line x1="310" y1="188" x2="356" y2="188" stroke="#607999" stroke-width="3"/><text x="28" y="270" class="">올바른 역방향: 이전 물건까지의 값 참조</text><rect x="28" y="295" width="330" height="55" rx="8" fill="#d1fae5" stroke="#607999"/><text x="40" y="329.5" class="">dp[4] = 이전 dp[2]+3 = 3</text><rect x="398" y="295" width="294" height="55" rx="8" fill="#d1fae5" stroke="#607999"/><text x="410" y="329.5" class="">dp[2] = dp[0]+3 = 3</text><text x="28" y="407" class="strong">용량 순서: 4 → 3 → 2</text><text x="28" y="456" class="">아직 갱신하지 않은 작은 용량을 읽습니다.</text></svg>
