<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">투 포인터: 확장과 축소의 역할</title><desc id="desc">양수 배열 2, 1, 3, 2에서 합 5 이상 구간을 찾습니다. 합이 부족하면 오른쪽을 늘리고 충분하면 왼쪽을 줄입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="518" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">투 포인터: 확장과 축소의 역할</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">양수 배열 [2, 1, 3, 2], 목표 합 ≥ 5</text>
