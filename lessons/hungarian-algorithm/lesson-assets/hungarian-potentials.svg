<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1168" role="img" aria-labelledby="title desc">
<title id="title">Hungarian: potential과 tight edge</title><desc id="desc">비용 행렬에서 row와 column potential을 조정해 reduced cost가 0인 tight edge를 만들고 augmenting path로 matching을 늘리는 흐름을 보여준다.</desc>
