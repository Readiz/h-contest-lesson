<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">Hungarian: potential과 tight edge</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">potential 조정으로 tight edge를 만들고 matching을 키운다</text>
<rect x="28" y="108" width="664" height="352" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="44" y="140" font-size="22" fill="#172b45" font-weight="700">1. reduced cost 행렬</text>
<text x="46" y="168" font-size="20" fill="#53657d">cost - u[row] - v[col] = 0 이면 tight edge다.</text>
<text x="46" y="198" font-size="20" fill="#53657d">양수 slack은 아직 tight하지 않은 후보 간선이다.</text>
