<text x="44" y="512" font-size="22" fill="#172b45" font-weight="700">2. tight graph에서 augmenting path 탐색</text>
<text x="46" y="546" font-size="20" fill="#53657d">이미 매칭된 tight edge를 따라가다가,</text>
<text x="46" y="576" font-size="20" fill="#53657d">slack 조정으로 새 tight edge를 연다.</text>
