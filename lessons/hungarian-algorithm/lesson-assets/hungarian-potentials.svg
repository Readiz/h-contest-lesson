<text x="58" y="856" font-size="20" fill="#15803d" font-weight="700">초록: 기존 matching</text>
<text x="58" y="886" font-size="20" fill="#1d4ed8" font-weight="700">파랑: 새 augment 후보</text>
<rect x="342" y="830" width="334" height="70" rx="6" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1"/>
<text x="354" y="856" font-size="20" fill="#172b45">B-X가 새 tight edge가 되면</text>
<text x="354" y="886" font-size="20" fill="#172b45">A-Y, B-X, C-Z로 뒤집을 수 있다.</text>
<rect x="28" y="932" width="664" height="208" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="46" y="968" font-size="22" fill="#172b45" font-weight="700">slack 2만큼 potential 조정</text>
<text x="46" y="1008" font-size="20" fill="#172b45">tree에 닿은 row A,B와 아직 닿지 않은 column X,Z 사이의</text>
<text x="46" y="1040" font-size="20" fill="#172b45">최소 slack이 2라서 B-X가 reduced cost 0이 된다.</text>
<text x="46" y="1072" font-size="20" fill="#172b45">이 조정 뒤에는 tight edge가 하나 이상 늘어나고,</text>
<text x="46" y="1104" font-size="20" fill="#172b45">빈 column에 도달하면 matching을 뒤집어 크기를 1 키운다.</text>
