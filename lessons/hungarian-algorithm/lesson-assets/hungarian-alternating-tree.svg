<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 722" role="img" aria-labelledby="title desc">
<title id="title">Alternating tree: B에서 펼치고 선 긋기</title><desc id="desc">0 간선 그래프에서 A-Y와 C-Z가 matching이고 B가 남았습니다. B에서 비매칭 0 간선 B-Y를 타고 Y에 가서 matching 간선 Y-A로 A에 오면 A에서 새 column으로 가는 0이 없어 멈춥니다. 표시된 row는 A와 B, 표시된 column은 Y이고, 선은 표시되지 않은 C row와 표시된 Y column에 긋습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="720" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#147d69"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">Alternating tree: B에서 펼치고 선 긋기</text>
<text x="28" y="86" font-size="21" fill="#53657d" font-weight="400" text-anchor="start">0인 칸만 간선으로 그린 row–column 그래프</text>
<rect x="20" y="104" width="680" height="420" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="130" y="142" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">row</text>
<text x="500" y="142" font-size="20" fill="#53657d" font-weight="700" text-anchor="middle">column</text>
<line x1="158" y1="390" x2="472" y2="190" stroke="#c4cfdd" stroke-width="3" stroke-linecap="round"/>
<line x1="158" y1="390" x2="472" y2="290" stroke="#c4cfdd" stroke-width="3" stroke-linecap="round"/>
<line x1="158" y1="190" x2="472" y2="290" stroke="#147d69" stroke-width="6" stroke-linecap="round"/>
<line x1="158" y1="390" x2="472" y2="390" stroke="#147d69" stroke-width="6" stroke-linecap="round"/>
<line x1="158" y1="290" x2="472" y2="290" stroke="#ae5515" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7"/>
<circle cx="130" cy="190" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="3.5"/>
<text x="130" y="198" font-size="23" fill="#172b45" font-weight="700" text-anchor="middle">A</text>
<circle cx="130" cy="290" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="3.5"/>
<text x="130" y="298" font-size="23" fill="#172b45" font-weight="700" text-anchor="middle">B</text>
<circle cx="130" cy="390" r="26" fill="#fff" stroke="#9fb0c6" stroke-width="2"/>
<text x="130" y="398" font-size="23" fill="#172b45" font-weight="700" text-anchor="middle">C</text>
<circle cx="500" cy="190" r="26" fill="#fff" stroke="#9fb0c6" stroke-width="2"/>
<text x="500" y="198" font-size="23" fill="#172b45" font-weight="700" text-anchor="middle">X</text>
<circle cx="500" cy="290" r="26" fill="#e9f0ff" stroke="#2664ce" stroke-width="3.5"/>
<text x="500" y="298" font-size="23" fill="#172b45" font-weight="700" text-anchor="middle">Y</text>
<circle cx="500" cy="390" r="26" fill="#fff" stroke="#9fb0c6" stroke-width="2"/>
<text x="500" y="398" font-size="23" fill="#172b45" font-weight="700" text-anchor="middle">Z</text>
<rect x="262" y="226" width="106" height="30" rx="6" fill="#fff" stroke="#fff" stroke-width="1"/>
<text x="315" y="248" font-size="19" fill="#147d69" font-weight="700" text-anchor="middle">matching</text>
<rect x="262" y="276" width="106" height="30" rx="6" fill="#fff" stroke="#fff" stroke-width="1"/>
<text x="315" y="298" font-size="19" fill="#ae5515" font-weight="700" text-anchor="middle">비매칭 0</text>
<text x="130" y="452" font-size="20" fill="#b42318" font-weight="700" text-anchor="middle">표시 안 됨: C row → 선</text>
<text x="500" y="452" font-size="20" fill="#b42318" font-weight="700" text-anchor="middle">표시: Y column → 선</text>
<rect x="28" y="540" width="664" height="160" rx="12" fill="#eef2f7" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="48" y="576" font-size="20" fill="#ae5515" font-weight="700" text-anchor="start">B → Y: 비매칭 0 간선</text>
<text x="48" y="610" font-size="20" fill="#147d69" font-weight="700" text-anchor="start">Y → A: matching 간선 (A-Y)</text>
<text x="48" y="644" font-size="20" fill="#172b45" font-weight="500" text-anchor="start">A에서 새 column으로 가는 0이 없어 멈춤</text>
<text x="48" y="678" font-size="20" fill="#b42318" font-weight="700" text-anchor="start">선: 표시 안 된 C row + 표시된 Y column</text>
</svg>
