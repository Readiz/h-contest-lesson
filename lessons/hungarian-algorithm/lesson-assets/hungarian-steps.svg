<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1114" role="img" aria-labelledby="title desc">
<title id="title">Hungarian 손계산: 0을 만들고 배정 찾기</title><desc id="desc">비용 행렬 A는 4,1,3, B는 2,0,5, C는 3,2,2에서 row 최솟값 1,0,2를 빼고 column X의 최솟값 1을 빼면 0이 만들어집니다. 0을 덮는 선은 C row와 Y column 2개로 matching 크기 2보다 완전 배정에 모자랍니다. 덮이지 않은 칸의 최솟값 1로 조정하면 B-X가 새 0이 되어 A-Y, B-X, C-Z 배정과 원래 비용 5가 나옵니다.</desc>
