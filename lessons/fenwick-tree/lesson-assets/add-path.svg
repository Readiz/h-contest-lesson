<text x="132.0" y="300" font-size="19" fill="#172b45" font-weight="500" text-anchor="middle">2</text>
<rect x="242" y="274" width="68" height="38" rx="7" fill="#fdf0e3" stroke="#ae5515" stroke-width="3"/>
<text x="276.0" y="300" font-size="19" fill="#172b45" font-weight="750" text-anchor="middle">6</text>
<rect x="386" y="274" width="68" height="38" rx="7" fill="#e9f0ff" stroke="#2664ce" stroke-width="1.8"/>
<text x="420.0" y="300" font-size="19" fill="#172b45" font-weight="500" text-anchor="middle">10</text>
<rect x="530" y="274" width="68" height="38" rx="7" fill="#e9f0ff" stroke="#2664ce" stroke-width="1.8"/>
<text x="564.0" y="300" font-size="19" fill="#172b45" font-weight="500" text-anchor="middle">14</text>
