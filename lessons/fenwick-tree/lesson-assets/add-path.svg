<rect x="386" y="226" width="140" height="38" rx="7" fill="#e9f0ff" stroke="#2664ce" stroke-width="1.8"/>
<text x="456.0" y="252" font-size="19" fill="#172b45" font-weight="500" text-anchor="middle">12</text>
<text x="36" y="207" font-size="18" fill="#53657d" font-weight="700" text-anchor="start">길이 8</text>
<rect x="98" y="178" width="284" height="38" rx="7" fill="#fdf0e3" stroke="#ae5515" stroke-width="3"/>
<text x="240.0" y="204" font-size="19" fill="#172b45" font-weight="750" text-anchor="middle">8</text>
<text x="36" y="159" font-size="18" fill="#53657d" font-weight="700" text-anchor="start">길이 16</text>
<rect x="98" y="130" width="572" height="38" rx="7" fill="#fdf0e3" stroke="#ae5515" stroke-width="3"/>
<text x="384.0" y="156" font-size="19" fill="#172b45" font-weight="750" text-anchor="middle">16</text>
<text x="36" y="396" font-size="18" fill="#53657d" font-weight="700" text-anchor="start">a 위치</text>
<text x="114.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">1</text>
<text x="150.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">2</text>
<text x="186.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">3</text>
<text x="222.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">4</text>
<text x="258.0" y="396" font-size="18" fill="#ae5515" font-weight="750" text-anchor="middle">5</text>
<text x="294.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">6</text>
<text x="330.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">7</text>
<text x="366.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">8</text>
<text x="402.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">9</text>
<text x="438.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">10</text>
<text x="474.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">11</text>
<text x="510.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">12</text>
<text x="546.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">13</text>
<text x="582.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">14</text>
<text x="618.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">15</text>
<text x="654.0" y="396" font-size="18" fill="#53657d" font-weight="500" text-anchor="middle">16</text>
<text x="36" y="448" font-size="21" fill="#172b45" font-weight="700" text-anchor="start">add(5, delta)</text>
<text x="36" y="482" font-size="21" fill="#ae5515" font-weight="700" text-anchor="start">5 → 5+1 = 6 → 6+2 = 8 → 8+8 = 16</text>
<text x="36" y="516" font-size="19" fill="#53657d" font-weight="500" text-anchor="start">idx += lowbit(idx) 로 a[5]를 포함하는 더 큰 구간으로 이동</text>
<text x="36" y="546" font-size="19" fill="#53657d" font-weight="500" text-anchor="start">prefixSum은 반대로 idx -= lowbit(idx) 로 내려감</text>
</svg>
