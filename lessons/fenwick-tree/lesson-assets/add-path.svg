<rect x="458" y="322" width="32" height="38" rx="7" fill="#e9f0ff" stroke="#2664ce" stroke-width="1.8"/>
<text x="474.0" y="348" font-size="19" fill="#172b45" font-weight="500" text-anchor="middle">11</text>
<rect x="530" y="322" width="32" height="38" rx="7" fill="#e9f0ff" stroke="#2664ce" stroke-width="1.8"/>
<text x="546.0" y="348" font-size="19" fill="#172b45" font-weight="500" text-anchor="middle">13</text>
<rect x="602" y="322" width="32" height="38" rx="7" fill="#e9f0ff" stroke="#2664ce" stroke-width="1.8"/>
