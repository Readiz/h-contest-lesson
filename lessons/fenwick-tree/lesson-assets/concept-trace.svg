<text x="28" y="424" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">12 − 4 = 8 · 바로 앞 구간으로</text>
<text x="28" y="449" font-size="24" fill="#2664ce" font-weight="750" text-anchor="start">3  tree[8]</text>
<text x="572" y="449" font-size="22" fill="#2664ce" font-weight="650" text-anchor="end">lowbit(8) = 8</text>
