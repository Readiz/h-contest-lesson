<text x="176" y="359" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">3</text>
<rect x="199" y="328" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="222" y="359" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">4</text>
<rect x="245" y="328" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
