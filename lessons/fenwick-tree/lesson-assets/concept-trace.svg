<rect x="61" y="496" width="368" height="48" rx="5" fill="#e9f0ff" stroke="#2664ce" stroke-width="2"/>
<text x="245" y="527" font-size="20" fill="#2664ce" font-weight="700" text-anchor="middle">1..8</text>
<text x="46" y="578" font-size="20" fill="#53657d">8 − 8 = 0 · 종료</text>
<rect x="28" y="612" width="664" height="104" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="46" y="652" font-size="20" fill="#2664ce" font-weight="700">1..8</text>
<text x="99.6" y="652" font-size="20" fill="#53657d" font-weight="400">+</text>
<text x="129.2" y="652" font-size="20" fill="#147d69" font-weight="700">9..12</text>
<text x="194.4" y="652" font-size="20" fill="#53657d" font-weight="400">+</text>
<text x="224" y="652" font-size="20" fill="#ae5515" font-weight="700">13</text>
<text x="261.6" y="652" font-size="20" fill="#172b45" font-weight="700">= 1..13</text>
<text x="46" y="692" font-size="20" fill="#53657d">세 구간은 겹치지 않고 전체 prefix를 덮습니다.</text>
</svg>
