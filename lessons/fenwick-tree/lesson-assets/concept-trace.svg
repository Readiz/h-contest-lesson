<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc"><title id="title">Fenwick: prefix를 구간으로 분해</title><desc id="desc">prefixSum(13)은 13, 9부터12, 1부터8의 서로 겹치지 않는 구간을 더합니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#172a46;font-size:21px}.small{font-size:18px}.title{font-size:28px;font-weight:700}.strong{font-weight:700}rect,line,path,circle{vector-effect:non-scaling-stroke}</style><rect width="720" height="500" rx="18" fill="#f5f8fc"/><text x="28" y="44" class="title">Fenwick: prefix를 구간으로 분해</text><text x="28" y="90" class="">prefixSum(13): 겹치지 않는 세 구간</text><rect x="28" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="40" y="151.0" class="">1</text><rect x="78" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="90" y="151.0" class="">2</text><rect x="128" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="140" y="151.0" class="">3</text><rect x="178" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="190" y="151.0" class="">4</text><rect x="228" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="240" y="151.0" class="">5</text><rect x="278" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="290" y="151.0" class="">6</text><rect x="328" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="340" y="151.0" class="">7</text><rect x="378" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="390" y="151.0" class="">8</text><rect x="428" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="440" y="151.0" class="">9</text><rect x="478" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="490" y="151.0" class="">10</text><rect x="528" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="540" y="151.0" class="">11</text><rect x="578" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="590" y="151.0" class="">12</text><rect x="628" y="120" width="46" height="48" rx="8" fill="#fff" stroke="#607999"/><text x="640" y="151.0" class="">13</text><rect x="28" y="205" width="396" height="52" rx="8" fill="#dbeafe" stroke="#607999"/><text x="40" y="238.0" class="">tree[8] = a[1..8]</text><rect x="428" y="275" width="196" height="52" rx="8" fill="#d1fae5" stroke="#607999"/><text x="440" y="308.0" class="">tree[12]: 9..12</text><rect x="628" y="345" width="64" height="52" rx="8" fill="#fde68a" stroke="#607999"/><text x="640" y="378.0" class="">13</text><text x="28" y="380" class="strong">13 → 12 → 8 → 0</text><text x="28" y="423" class="">idx -= lowbit(idx) 로 바로 앞 구간에 이동</text><text x="28" y="464" class="">총합 = tree[13] + tree[12] + tree[8]</text></svg>
