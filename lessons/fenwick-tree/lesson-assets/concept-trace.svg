<text x="314" y="191" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">6</text>
<rect x="337" y="160" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="360" y="191" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">7</text>
