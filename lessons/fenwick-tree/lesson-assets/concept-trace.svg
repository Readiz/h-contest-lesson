<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" role="img" aria-labelledby="title desc">
<title id="title">Fenwick: 구간을 건너뛰며 더하기</title><desc id="desc">prefixSum(13)은 tree[13]의 13번째 한 칸, tree[12]의 9번째부터 12번째까지 네 칸, tree[8]의 1번째부터 8번째까지 여덟 칸을 차례로 더합니다. 인덱스에서 lowbit를 빼며 13, 12, 8, 0으로 이동합니다. 이 세 구간은 서로 겹치지 않고 1부터 13까지를 덮습니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="738" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">Fenwick: 구간을 건너뛰며 더하기</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">prefixSum(13) · 칸의 숫자는 값이 아닌 인덱스</text>
<rect x="28" y="108" width="664" height="156" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="46" y="142" font-size="20" fill="#ae5515" font-weight="700">1  tree[13]</text>
<text x="676" y="142" font-size="20" fill="#ae5515" font-weight="700" text-anchor="end">lowbit(13) = 1</text>
<rect x="61" y="160" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="84" y="191" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">1</text>
<rect x="107" y="160" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="130" y="191" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">2</text>
<rect x="153" y="160" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="176" y="191" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">3</text>
<rect x="199" y="160" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="222" y="191" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">4</text>
