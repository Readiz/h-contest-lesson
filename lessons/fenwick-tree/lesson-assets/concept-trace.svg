<text x="498" y="191" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">10</text>
<rect x="521" y="160" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="544" y="191" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">11</text>
