<text x="47" y="53" font-size="27" fill="#172b45" font-weight="750" text-anchor="start">Fenwick: 구간을 건너뛰며 더하기</text>
<text x="28" y="91" font-size="22" fill="#53657d" font-weight="400" text-anchor="start">prefixSum(13) · 칸의 숫자는 값이 아닌 인덱스</text>
<text x="60.0" y="139" font-size="22" fill="#53657d" font-weight="600" text-anchor="middle">1</text>
<text x="100.0" y="139" font-size="22" fill="#53657d" font-weight="600" text-anchor="middle">2</text>
<text x="140.0" y="139" font-size="22" fill="#53657d" font-weight="600" text-anchor="middle">3</text>
