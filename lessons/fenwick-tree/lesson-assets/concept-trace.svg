<rect x="383" y="328" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="406" y="359" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">8</text>
<rect x="613" y="328" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="636" y="359" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">13</text>
<rect x="429" y="328" width="184" height="48" rx="5" fill="#e5f4ef" stroke="#147d69" stroke-width="2"/>
<text x="521" y="359" font-size="20" fill="#147d69" font-weight="700" text-anchor="middle">9..12</text>
<text x="46" y="410" font-size="20" fill="#53657d">12 − 4 = 8 · 바로 앞 구간으로</text>
<rect x="28" y="444" width="664" height="156" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="46" y="478" font-size="20" fill="#2664ce" font-weight="700">3  tree[8]</text>
<text x="676" y="478" font-size="20" fill="#2664ce" font-weight="700" text-anchor="end">lowbit(8) = 8</text>
<rect x="429" y="496" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="452" y="527" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">9</text>
<rect x="475" y="496" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="498" y="527" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">10</text>
<rect x="521" y="496" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="544" y="527" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">11</text>
<rect x="567" y="496" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
<text x="590" y="527" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">12</text>
<rect x="613" y="496" width="46" height="48" rx="0" fill="#f2f6fb" stroke="#d8e1ed" stroke-width="1.5"/>
