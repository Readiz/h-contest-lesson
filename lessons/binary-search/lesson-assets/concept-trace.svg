<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
<title id="title">이분 탐색: 첫 번째 참의 경계</title><desc id="desc">배열 1, 2, 4, 4, 7에서 4 이상인 첫 인덱스는 2입니다. 참이면 high를 mid로, 거짓이면 low를 mid+1로 옮깁니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style>
<rect x="1" y="1" width="718" height="488" rx="20" fill="#f6f8fc" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="28" y="22" width="6" height="30" rx="3" fill="#2664ce"/>
<text x="46" y="47" font-size="27" fill="#172b45" font-weight="750">이분 탐색: 첫 번째 참의 경계</text>
<text x="28" y="86" font-size="22" fill="#53657d" font-weight="400">목표: 값 4가 처음 나타나는 위치</text>
<rect x="28" y="108" width="664" height="178" rx="12" fill="#fff" stroke="#d8e1ed" stroke-width="1.5"/>
<rect x="86" y="128" width="100" height="56" rx="10" fill="#fee2e2" stroke="#b42318" stroke-width="1.5"/>
<text x="136" y="163.7" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">1</text>
<text x="136" y="214" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">0</text>
<rect x="198" y="128" width="100" height="56" rx="10" fill="#fee2e2" stroke="#b42318" stroke-width="1.5"/>
<text x="248" y="163.7" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">2</text>
<text x="248" y="214" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">1</text>
<rect x="310" y="128" width="100" height="56" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="360" y="163.7" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<text x="360" y="214" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">2</text>
<rect x="422" y="128" width="100" height="56" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="472" y="163.7" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">4</text>
<text x="472" y="214" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">3</text>
<rect x="534" y="128" width="100" height="56" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="584" y="163.7" font-size="22" fill="#172b45" font-weight="700" text-anchor="middle">7</text>
<text x="584" y="214" font-size="18" fill="#53657d" font-weight="600" text-anchor="middle">4</text>
<text x="46" y="256" font-size="20" fill="#172b45" font-weight="700">조건 a[i] &gt;= 4:  거짓, 거짓, 참, 참, 참</text>
<rect x="28" y="306" width="326" height="60" rx="10" fill="#e5f4ef" stroke="#147d69" stroke-width="1.5"/>
<text x="191" y="343" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">참이면 high = mid</text>
<rect x="366" y="306" width="326" height="60" rx="10" fill="#fee2e2" stroke="#b42318" stroke-width="1.5"/>
<text x="529" y="343" font-size="20" fill="#172b45" font-weight="700" text-anchor="middle">거짓이면 low = mid+1</text>
<circle cx="40" cy="412.0" r="4" fill="#2664ce"/>
<text x="56" y="418" font-size="20" fill="#172b45">[low, high)에서 경계를 좁혀 결과 2</text>
<circle cx="40" cy="452.0" r="4" fill="#2664ce"/>
<text x="56" y="458" font-size="20" fill="#172b45">찾는 값이 없어도 삽입 위치를 반환합니다.</text>
</svg>
