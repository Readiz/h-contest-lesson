<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc"><title id="title">이분 탐색: 첫 번째 참의 경계</title><desc id="desc">배열1,2,4,4,7에서4 이상인 첫 인덱스는2입니다. 참이면 high를 mid로, 거짓이면 low를 mid+1로 옮깁니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#172a46;font-size:21px}.small{font-size:18px}.title{font-size:28px;font-weight:700}.strong{font-weight:700}rect,line,path,circle{vector-effect:non-scaling-stroke}</style><rect width="720" height="500" rx="18" fill="#f5f8fc"/><text x="28" y="44" class="title">이분 탐색: 첫 번째 참의 경계</text><text x="28" y="90" class="">목표: 값 4가 처음 나타나는 위치</text><rect x="80" y="125" width="96" height="58" rx="8" fill="#fee2e2" stroke="#607999"/><text x="92" y="161.0" class="">1</text><text x="116" y="215" class="">0</text><rect x="192" y="125" width="96" height="58" rx="8" fill="#fee2e2" stroke="#607999"/><text x="204" y="161.0" class="">2</text><text x="228" y="215" class="">1</text><rect x="304" y="125" width="96" height="58" rx="8" fill="#d1fae5" stroke="#607999"/><text x="316" y="161.0" class="">4</text><text x="340" y="215" class="">2</text><rect x="416" y="125" width="96" height="58" rx="8" fill="#d1fae5" stroke="#607999"/><text x="428" y="161.0" class="">4</text><text x="452" y="215" class="">3</text><rect x="528" y="125" width="96" height="58" rx="8" fill="#d1fae5" stroke="#607999"/><text x="540" y="161.0" class="">7</text><text x="564" y="215" class="">4</text><text x="28" y="265" class="">조건 a[i] &gt;= 4:  거짓, 거짓, 참, 참, 참</text><rect x="28" y="300" width="310" height="62" rx="8" fill="#d1fae5" stroke="#607999"/><text x="40" y="338.0" class="">참이면 high = mid</text><rect x="378" y="300" width="314" height="62" rx="8" fill="#fee2e2" stroke="#607999"/><text x="390" y="338.0" class="">거짓이면 low = mid+1</text><text x="28" y="416" class="strong">[low, high)에서 경계를 좁혀 결과 2</text><text x="28" y="463" class="">찾는 값이 없어도 삽입 위치를 반환합니다.</text></svg>
