<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 844" role="img" aria-labelledby="title desc">
<title id="title">Dijkstra: 확정 정점과 dist 변화</title><desc id="desc">0에서 시작하는 그래프 0-&gt;1(2), 0-&gt;2(5), 1-&gt;2(1), 1-&gt;3(4), 2-&gt;3(2)입니다. 0을 확정하면 dist는 0,2,5,INF, 1을 확정하면 2번이 5에서 3으로 줄고 3번이 6이 되어 0,2,3,6, 2를 확정하면 3번이 5로 줄어 0,2,3,5, 3을 확정하면 변화가 없습니다.</desc>
