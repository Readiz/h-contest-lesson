<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc"><title id="title">Dijkstra: 큐에 남은 낡은 후보</title><desc id="desc">정점0에서2로 직접 비용5, 1을 거치면2+1=3입니다. 큐의 거리5 후보는 현재 거리3과 달라 버립니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#172a46;font-size:21px}.small{font-size:18px}.title{font-size:28px;font-weight:700}.strong{font-weight:700}rect,line,path,circle{vector-effect:non-scaling-stroke}</style><rect width="720" height="500" rx="18" fill="#f5f8fc"/><text x="28" y="44" class="title">Dijkstra: 큐에 남은 낡은 후보</text><text x="28" y="90" class="">두 경로가 같은 정점 2의 후보를 만듭니다.</text><rect x="80" y="130" width="76" height="55" rx="8" fill="#dbeafe" stroke="#607999"/><text x="92" y="164.5" class="">0</text><rect x="320" y="130" width="76" height="55" rx="8" fill="#dbeafe" stroke="#607999"/><text x="332" y="164.5" class="">1</text><rect x="560" y="260" width="76" height="55" rx="8" fill="#dbeafe" stroke="#607999"/><text x="572" y="294.5" class="">2</text><line x1="156" y1="155" x2="316" y2="155" stroke="#607999" stroke-width="3"/><text x="215" y="140" class="">2</text><line x1="396" y1="169" x2="560" y2="275" stroke="#607999" stroke-width="3"/><text x="472" y="205" class="">1</text><line x1="118" y1="187" x2="555" y2="302" stroke="#607999" stroke-width="3"/><text x="275" y="290" class="">직접 비용 5</text><rect x="28" y="335" width="320" height="55" rx="8" fill="#d1fae5" stroke="#607999"/><text x="40" y="369.5" class="">새 후보: (거리 3, 정점 2)</text><rect x="370" y="335" width="322" height="55" rx="8" fill="#fee2e2" stroke="#607999"/><text x="382" y="369.5" class="">옛 후보: (거리 5, 정점 2)</text><text x="28" y="438" class="">거리 5를 꺼내면 dist[2]=3과 달라 건너뜁니다.</text></svg>
