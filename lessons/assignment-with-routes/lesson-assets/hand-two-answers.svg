<title id="title">손계산 예시: 배정만 본 최적과 경로까지 본 최적</title><desc id="desc">기사 2명과 승객 4명의 예시입니다. 배정만 본 최적 {2,3}/{0,1}은 비용 행렬 기준 최대 22이지만 실제 점수는 29입니다. 경로까지 본 최적 {0,3}/{1,2}는 두 기사가 모두 23입니다.</desc>
