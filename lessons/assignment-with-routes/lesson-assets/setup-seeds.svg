<desc id="desc">결합 탐욕에서 시작한 탐색의 설정별 TC 5개 합을 solver seed 9개의 점과 중앙값 눈금으로 보인 그림입니다. 중앙값은 본문 설정 429,489,414, 교환 없이 이동만 429,506,756, 무작위로만 고름 431,737,879, 가중치 0 433,637,574, 가중치 16 429,611,029, 기사 후보 1명 430,147,324, 제안 100,000개 429,942,865, 제안 2,000,000개 429,119,890입니다. 가중치 0이 가장 나쁘고 무작위로만 고르는 설정이 그다음이며 교환을 빼거나 가중치를 16으로 바꾼 설정은 본문과 시드 폭 안에서 겹칩니다.</desc>
